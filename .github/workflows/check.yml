name: Controle

# Controleert elke wijziging aan de code voordat die live gaat (eerst op een werkbranch, daarna pas naar main):
# Python-scripts, JavaScript, de databestanden, de techradar en de Top 250-pijplijn op testdata,
# alle pagina's in een echte browser op telefoon- en desktopformaat, of tekst van buiten (namen, nieuws) nergens
# als HTML of code in een pagina belandt, of een aangepaste aankoopprijs blijft staan met Sync aan, en de beveiliging:
# bezoekers alleen-lezen, alleen de token van de beheerder kan opslaan, ingevoegde code draait niet (tests/test_security.js).
# Alleen lezen: deze check kan niets in de repository veranderen. Data-commits van de andere workflows starten hem niet.

on:
  push:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'scripts/**'
      - 'update_prices.py'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    # Vaste versie: 'ubuntu-latest' is sinds november 2026 Ubuntu 26.04, en daarop kan de vastgepinde testbrowser
    # (Playwright 1.56.1) niet geïnstalleerd worden. Samen bijwerken: eerst Playwright, dan deze regel.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (vastgepind)
        with:
          persist-credentials: false

      - name: Scripts, JavaScript, data en beveiliging van de pagina's
        run: python3 -B tests/test_static.py

      - name: Techradar op synthetische koersen
        run: python3 -B tests/test_tech.py

      - name: Bodemsignaal op synthetische koersen
        run: python3 -B tests/test_bodem.py

      - name: Top 250-pijplijn op de opgeslagen cijfers
        run: python3 -B tests/test_screener.py

      - name: Bewijs per pijler en de gewichten van de marktrang
        run: python3 -B tests/test_bewijs.py

      - name: Hele Top 250-run zonder netwerk (droogloop)
        run: python3 -B tests/test_screener_run.py

      - name: Browser installeren
        timeout-minutes: 6
        # Zonder --with-deps: de systeembibliotheken voor Chromium staan al op de runner. De extra lettertypen die
        # --with-deps via apt ophaalt zijn niet nodig, en maakten de controle afhankelijk van de Ubuntu-pakketserver
        # (11 november 2026: tien minuten wachten en dan mislukt op 'Temporary failure resolving azure.archive.ubuntu.com').
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium

      - name: Alle pagina's in de browser (telefoon en desktop)
        run: node tests/test_pages.js

      - name: Geen ingevoegde HTML of code via tekst van buiten (XSS)
        run: node tests/test_xss.js

      - name: Aangepaste aankoopprijs blijft staan met Sync aan (nagebootste GitHub)
        run: node tests/test_sync.js

      - name: Positie weghalen of toevoegen werkt door op elk apparaat en op het scorebord
        run: node tests/test_lijst.js

      - name: Alleen de beheerder kan wijzigen; bezoekers alleen-lezen; ingevoegde code draait niet
        run: node tests/test_security.js
