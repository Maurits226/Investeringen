name: Tijdelijk - marktdata naar logboek

# TIJDELIJK, alleen op de werkbranch: haalt de dagkoersen op die nodig zijn om het bodemsignaal door te rekenen en zet ze
# in het logboek. Alleen lezen, geen geheimen. Wordt verwijderd voordat de wijziging naar main gaat.

on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'tests/dump_markt.py'
      - '.github/workflows/dump.yml'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (vastgepind)
        with:
          persist-credentials: false
      - name: Dagkoersen ophalen
        run: python3 -B tests/dump_markt.py
