name: Top 250

# Kansen portefeuille. Breed universum (~2.000+ bedrijven), fundamentele cijfers per stock
# wekelijks ververst. Vier runs per dag: de eerste volledige scan duurt zo ongeveer 1 à 2 dagen,
# daarna is elke run vooral koersen bijwerken. Handmatig starten: Actions → Top 250 → Run workflow.

on:
  schedule:
    - cron: "40 3,9,15,21 * * *"   # 05:40, 11:40, 17:40 en 23:40 NL-zomertijd
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/screener.py'
      - 'screener_universe.txt'
      - 'kwaliteit.json'
      - '.github/workflows/screener.yml'

permissions:
  contents: write

concurrency:
  group: top250
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Stocks scannen en scoren
        run: python3 scripts/screener.py

      - name: Resultaat opslaan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add screener.json screener_cache.json etf_holdings.json; [ -f koopmoment.json ] && git add koopmoment.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"; exit 0
          fi
          git commit -q -m "Top 250 $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i * 7))
          done
          echo "Push na 5 pogingen niet gelukt"; exit 1
