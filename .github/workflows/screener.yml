name: Top 250

# Kansen portefeuille. Breed universum (~3.000 bedrijven: VS vanaf $2 mld, eurozone vanaf €1 mld), fundamentele
# cijfers per stock wekelijks ververst. Vier runs per dag: nieuwe bedrijven zijn na 1 à 2 dagen gescand,
# daarna is elke run vooral koersen bijwerken. Handmatig starten: Actions → Top 250 → Run workflow.
# Schrijft screener.json (licht), screener_det/ (details per kans), these.json en koopmoment.json.
# Opzoeken: zet je op het dashboard een aandeel in opzoeklijst.json, dan start deze run meteen en beoordeelt hij het
# (opzoeken.json, meestal binnen 2 à 3 minuten).

on:
  schedule:
    - cron: "40 3,9,15,21 * * *"   # 05:40, 11:40, 17:40 en 23:40 NL-zomertijd
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/screener.py'
      - 'screener_universe.txt'
      - 'kwaliteit.json'
      - 'opzoeklijst.json'             # tab Opzoeken: een nieuw aandeel meteen beoordelen
      - '.github/workflows/screener.yml'

permissions:
  contents: write

concurrency:
  group: top250
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0 (vastgepind)

      # Een run die in de wachtrij stond (achter een vorige Top 250-run) begint van de versie van toen:
      # eerst de nieuwste data ophalen, anders botsen de resultaten van beide runs bij het opslaan
      - name: Nieuwste stand ophalen
        run: git pull -q --ff-only origin "${GITHUB_REF_NAME}" || true

      - name: Stocks scannen en scoren
        run: python3 scripts/screener.py

      - name: Resultaat opslaan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add screener.json screener_cache.json etf_holdings.json
          [ -d screener_det ] && git add -A screener_det      # details per kans (16 bestanden)
          [ -f koopmoment.json ] && git add koopmoment.json
          [ -f these.json ] && git add these.json
          [ -f zoek.json ] && git add zoek.json                # zoekindex voor 'positie toevoegen'
          [ -f opzoeken.json ] && git add opzoeken.json        # tab Opzoeken: beoordeling per opgezocht aandeel
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"; exit 0
          fi
          git commit -q -m "Top 250 $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
          for i in 1 2 3 4 5; do
            # botst het met een andere run, dan gaat deze (nieuwste) uitvoer voor: bij een rebase is 'theirs' de eigen commit
            if git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git push -q && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 7))
          done
          echo "Push na 5 pogingen niet gelukt"; exit 1
