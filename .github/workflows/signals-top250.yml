name: Patroonradar top 250

# Patroonradar voor de Top 250 (stocks die je nog niet hebt). 250 stocks is veel voor Yahoo,
# dus deze radar ververst elk uur (op het halve uur, tussen de runs van de andere radar door).
# De stocks komen uit screener.json (workflow Top 250).

on:
  schedule:
    - cron: "30 5-21 * * 1-5"     # startmomenten (UTC); de lus doet de rest
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:                        # na een wijziging aan de radar direct herstarten
      - 'scripts/signals.py'
      - '.github/workflows/signals-top250.yml'

permissions:
  contents: write

concurrency:
  group: patroonradar-top250
  # handmatig of na een push: lopende run stoppen en met de nieuwe code beginnen
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Signalen Top 250 berekenen, elk uur tijdens handelsuren
        env:
          RADAR_SET: top250
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          INTERVAL=3600; OFFSET=1800                    # elk uur, op het halve uur
          STOP=$(( $(date +%s) + 5*3600 + 30*60 ))      # ruim binnen de limiet van 6 uur
          while true; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            python3 scripts/signals.py || echo "Run mislukt, volgende poging over een uur"
            git add signals_top250.json; [ -d archive_top250 ] && git add archive_top250
            if ! git diff --cached --quiet; then
              git commit -q -m "Patroonradar top 250 $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
              for i in 1 2 3 4 5; do
                git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break
                sleep $((i * 7))
              done
            fi
            NEXT=$(( ( ($(date +%s) - OFFSET) / INTERVAL + 1 ) * INTERVAL + OFFSET ))
            HHMM=$(date -u -d "@$NEXT" +%H%M)
            DOW=$(date -u -d "@$NEXT" +%u)
            # handelsuren 05:45-21:15 UTC op werkdagen (dekt zomer- en wintertijd)
            if [ "$NEXT" -ge "$STOP" ] || [ "$DOW" -ge 6 ] || [ "$HHMM" -lt 0545 ] || [ "$HHMM" -gt 2115 ]; then
              echo "Klaar voor nu; de volgende geplande run neemt het over."
              break
            fi
            sleep $(( NEXT - $(date +%s) ))
          done
