name: Patroonradar investeringen

# GitHub start geplande runs vaak uren te laat. Daarom start elke run aan het eind
# zelf zijn opvolger (keten), behalve op zaterdag. Tijdens handelsuren ververst de lus
# elke 15 minuten, daarbuiten wacht hij tot de beurs opengaat.
# De cron blijft als vangnet: breekt de keten, dan pakt een geplande run het weer op.

on:
  schedule:
    - cron: "*/15 5-21 * * 1-5"   # startmomenten (UTC); de lus doet de rest
    - cron: "20 */2 * * 0"        # zondag: keten op tijd starten voor maandagochtend
  workflow_dispatch:
    inputs:
      keten:
        description: "Gestart door de vorige run (niet aanvinken)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:                        # na een wijziging aan de radar direct herstarten
      - 'scripts/signals.py'
      - 'tickers.txt'
      - '.github/workflows/signals.yml'

permissions:
  contents: write
  actions: write                  # om de opvolger te starten

concurrency:
  group: patroonradar
  # handmatig of na een push: lopende run stoppen en met de nieuwe code beginnen;
  # een opvolger uit de keten wacht netjes tot de huidige run klaar is
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.keten) }}

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Signalen berekenen, elke 15 minuten tijdens handelsuren
        env:
          KETEN: ${{ inputs.keten }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          INTERVAL=900                                  # 15 minuten
          STOP=$(( $(date +%s) + 5*3600 + 30*60 ))      # ruim binnen de limiet van 6 uur
          # handelsuren 05:45-21:15 UTC op werkdagen (dekt zomer- en wintertijd)
          handelstijd() { [ "$(date -u -d "@$1" +%u)" -le 5 ] && [ "$(date -u -d "@$1" +%H%M)" -ge 0545 ] && [ "$(date -u -d "@$1" +%H%M)" -le 2115 ]; }
          keten_actief() { [ "$(date -u +%u)" -ne 6 ]; }   # op zaterdag stopt de keten
          EERSTE=1
          # timeout: een hangende git- of python-aanroep mag de lus niet uren blokkeren
          while true; do
            # buiten handelsuren alleen bij een handmatige start of na een push
            if handelstijd "$(date +%s)" || { [ -n "$EERSTE" ] && [ "$EVENT" != "schedule" ] && [ "$KETEN" != "true" ]; }; then
              timeout 2m git pull -q --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort 2>/dev/null || true
              timeout 12m python3 scripts/signals.py || echo "Run mislukt, volgende poging over 15 min"
              git add signals.json; [ -d archive ] && git add archive
              if ! git diff --cached --quiet; then
                git commit -q -m "Patroonradar $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
                for i in 1 2 3 4 5; do
                  timeout 2m git pull -q --rebase origin "${GITHUB_REF_NAME}" && timeout 2m git push -q && break
                  git rebase --abort 2>/dev/null || true     # afgebroken pull niet half laten staan
                  sleep $((i * 7))
                done
              fi
            fi
            EERSTE=
            NEXT=$(( ( $(date +%s) / INTERVAL + 1 ) * INTERVAL ))
            if [ "$NEXT" -ge "$STOP" ] || { ! keten_actief && ! handelstijd "$NEXT"; }; then
              break
            fi
            sleep $(( NEXT - $(date +%s) ))
          done

      - name: Opvolger starten
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" -ne 6 ]; then
            timeout 2m gh workflow run signals.yml --ref "$GITHUB_REF_NAME" -f keten=true \
              || echo "Opvolger starten mislukt; de geplande run neemt het over."
          else
            echo "Zaterdag: geen opvolger; de geplande runs nemen het over."
          fi
