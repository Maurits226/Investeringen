name: Patroonradar

on:
  schedule:
    # elke 15 minuten op werkdagen tijdens Europese + Amerikaanse beurstijden
    # (GitHub rekent in UTC: 6-21 UTC = 8:00-23:59 Nederlandse zomertijd)
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patroonradar
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Python staat standaard op de runner; het script heeft geen extra pakketten nodig
      - name: Signalen berekenen
        run: python3 scripts/signals.py

      - name: signals.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet && exit 0
          git commit -m "Patroonradar $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
          # de koersen-workflow pusht elke 10 min: bij een botsing eerst rebasen
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
