name: Patroonradar

on:
  schedule:
    # elk uur op werkdagen tijdens Europese + Amerikaanse beurstijden (UTC)
    - cron: "15 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patroonradar
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Signalen berekenen
        run: python scripts/signals.py

      - name: signals.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet && exit 0
          git commit -m "Patroonradar $(date -u +'%Y-%m-%d %H:%M')"
          # de koersen-workflow pusht elke 10 min: bij een botsing eerst rebasen
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
