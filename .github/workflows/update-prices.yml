name: Update stock prices

on:
  schedule:
    # Elke 10 min gevraagd. GitHub kan geplande runs vertragen; dat is normaal.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # handmatig starten via de Actions-tab
  push:
    branches: [ main ]
    paths-ignore:         # geen koers-run starten bij alleen data/state-wijzigingen
      - 'state.json'
      - 'data.json'

permissions:
  contents: write

# Voorkom dat twee runs tegelijk draaien en elkaar in de weg zitten
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python update_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in data.json"
            exit 0
          fi
          git commit -m "Update koersen $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Haal eerst eventuele nieuwe commits op (bv. state.json vanuit het dashboard)
          # en probeer tot 5 keer te pushen.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push mislukt, poging $i — opnieuw proberen..."
            sleep 5
          done
          echo "Push na 5 pogingen niet gelukt"
          exit 1
