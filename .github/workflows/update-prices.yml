name: Update stock prices

on:
  schedule:
    # Elke 10 min gevraagd. Let op: GitHub vertraagt gratis scheduled runs vaak,
    # dus in de praktijk draait dit doorgaans elke 15-30 min. Dat is normaal en
    # ruim voldoende voor koopsignalen op basis van de 52-weeks top.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # laat je het ook handmatig starten via de Actions-tab
  push:
    branches: [ main ]    # werk ook bij na elke wijziging

permissions:
  contents: write

concurrency:
  group: update-prices    # nooit twee koersen-runs tegelijk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python update_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in data.json"
            exit 0
          fi
          git commit -m "Update koersen $(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M') NL"
          # de Patroonradar pusht ook: bij een botsing eerst de nieuwste versie ophalen
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
