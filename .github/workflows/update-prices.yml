name: Update stock prices

on:
  schedule:
    # Elke 15 minuten (GitHub kan iets vertragen bij drukte; dat is normaal)
    - cron: "*/15 * * * *"
  workflow_dispatch:      # laat je het ook handmatig starten via de Actions-tab
  push:
    branches: [ main ]    # werk ook bij na elke wijziging

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python update_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in data.json"
          else
            git commit -m "Update koersen $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
