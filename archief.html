<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --up: #3ecf8e; --down: #f0595f; --warn: #f5b544; --accent: #4f8ff0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1e2430 0%, transparent 60%), var(--ink);
    color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh; padding: 28px 18px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 26px; }
  .title-block h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 12px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .title-block p { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .updated { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  button, select {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 9px 13px; border-radius: 10px; font-size: 13px; font-weight: 500; transition: .15s;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; border-color: var(--line); }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
  .stat { background: linear-gradient(180deg, var(--panel), var(--ink)); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
          cursor: pointer; transition: border-color .15s, transform .15s; }
  .stat:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat:active { transform: translateY(0); }
  .stat.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-top: 8px; }
  .stat .sub { font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }

  [hidden] { display: none !important; }
  .daynav { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .daynav > button { width: 46px; height: 46px; padding: 0; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .daypick { position: relative; flex: 1; min-width: 0; }
  #dayBtn {
    width: 100%; height: 46px; padding: 0 44px; position: relative; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  #dayBtn .chev { position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  .daypick.open #dayBtn { border-color: var(--accent); }
  .daypick.open #dayBtn .chev { transform: rotate(-135deg); margin-top: -2px; }
  #dayList {
    list-style: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 5px;
    max-height: 320px; overflow-y: auto; box-shadow: 0 14px 40px -12px rgba(0,0,0,.7);
  }
  #dayList li {
    display: flex; align-items: center; justify-content: center; gap: 10px; position: relative;
    padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
  }
  #dayList li:hover { background: rgba(255,255,255,.05); }
  #dayList li.active { background: rgba(79,143,240,.16); color: var(--accent); }
  #dayList li .tag { position: absolute; right: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
    color: var(--accent); border: 1px solid rgba(79,143,240,.45); padding: 2px 7px; border-radius: 999px; }
  .dayinfo { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; font-family: 'IBM Plex Mono', monospace; }
  .dayinfo b { color: var(--text); font-weight: 600; }
  .dayinfo .regime-off { color: var(--down); } .dayinfo .regime-calm { color: var(--up); }

  .section-header {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin: 26px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .section-header::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); }
  .section-header .right { margin-left: auto; font-size: 12px; font-weight: 500; }
  .section-header select { font-size: 12px; padding: 6px 9px; }
  .c-up { color: var(--up); } .c-down { color: var(--down); } .c-info { color: var(--muted); }

  .h-list { display: flex; flex-direction: column; gap: 6px; }
  .h-row {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
    display: grid; grid-template-columns: 118px minmax(0,1.2fr) 86px minmax(0,1.3fr) minmax(0,1.3fr); gap: 12px; align-items: center; font-size: 13px;
  }
  .h-row.new { border-color: rgba(245,181,68,.45); }
  .h-row.done { opacity: .9; }
  .st-in { color: var(--up); font-weight: 600; }
  .st-out { color: var(--warn); font-weight: 600; }
  .h-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .h-date .nw { color: var(--warn); font-weight: 600; }
  .h-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-name small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .h-px { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .h-px small, .h-res small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .h-res { font-size: 12px; }
  .pill { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; text-align: center; white-space: nowrap; }
  .pill.up { background: rgba(62,207,142,.15); color: var(--up); border: 1px solid rgba(62,207,142,.4); }
  .pill.down { background: rgba(240,89,95,.15); color: var(--down); border: 1px solid rgba(240,89,95,.4); }
  .pill.flat { background: rgba(134,149,179,.10); color: var(--muted); border: 1px solid var(--line); }

  .pos { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative; }
  .pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
  .pos.up::before { background: var(--up); } .pos.down::before { background: var(--down); }
  .pos.up { border-color: rgba(62,207,142,.35); } .pos.down { border-color: rgba(240,89,95,.35); }
  .pos summary { list-style: none; cursor: pointer; padding: 13px 16px 13px 18px; display: grid;
    grid-template-columns: minmax(0,1.3fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1.6fr) 20px; gap: 12px; align-items: center; }
  .pos summary::-webkit-details-marker { display: none; }
  .pos summary::after { content: '▸'; color: var(--muted); font-size: 12px; justify-self: end; transition: transform .15s; }
  .pos[open] summary::after { transform: rotate(90deg); }
  .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .v { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; margin-top: 3px; }
  .p-name { min-width: 0; }
  .p-ticker { font-size: 15px; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-company { font-size: 11px; color: var(--muted); }
  .top3 { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; }
  .pos-body { padding: 4px 18px 16px 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  .pat { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .pat li { font-size: 13px; display: flex; gap: 8px; }
  .pat small { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-left: 4px; }
  .plan { margin-top: 12px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; }
  .plan span:nth-child(odd) { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 12px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; font-size: 13px; line-height: 1.6; }
  .err { font-size: 12px; color: var(--muted); padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px; }

  .viewnav { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .viewnav button { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 9px; }
  .viewnav button.active { background: var(--accent); color: #0d1117; }
  .viewnav button:hover:not(.active) { color: var(--text); }
  .sb-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .sb-tools select { font-size: 13px; }
  .sb-tools .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .sb-dirs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  /* Scorebord per richting: kaart in dezelfde stijl als het beursklimaat */
  .sb-dir { position: relative; overflow: hidden; border-radius: 14px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px;
            background: linear-gradient(180deg, var(--panel), var(--ink)); border: 1px solid var(--line); --mark: var(--up); --tone: var(--muted); }
  .sb-dir.down { --mark: var(--down); }
  .sb-dir.good { --tone: var(--up); } .sb-dir.bad { --tone: var(--down); }
  .sb-dir::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--mark); }
  .sb-dir::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
                   background: radial-gradient(circle, color-mix(in srgb, var(--tone) 14%, transparent), transparent 70%); pointer-events: none; }
  .sd-k { display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); }
  .sd-k i { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mark) 22%, transparent); }
  .sd-k span { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: 'IBM Plex Mono', monospace; }
  .sd-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sd-num { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: var(--tone); }
  .sd-lbl { font-size: 12px; color: var(--muted); }
  .sd-bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--panel-2); gap: 2px; }
  .sd-bar span { display: block; height: 100%; }
  .sd-bar .lo { background: var(--accent); } .sd-bar .ve { background: #4a4e53; } .sd-bar .dl { background: var(--up); } .sd-bar .st { background: var(--down); }
  .sd-rows { display: grid; gap: 5px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .sd-rows > div { display: flex; align-items: center; gap: 8px; }
  .sd-rows i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .sd-rows .lo i { background: var(--accent); } .sd-rows .ve i { background: #4a4e53; } .sd-rows .af i { background: linear-gradient(90deg, var(--up) 50%, var(--down) 50%); }
  .sd-rows b { color: var(--text); font-weight: 600; min-width: 74px; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .sd-rows .r { margin-left: auto; }
  .sd-empty { font-size: 12.5px; color: var(--muted); }
  .sb-row {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 18px; position: relative; overflow: hidden;
    display: grid; grid-template-columns: minmax(0,1.3fr) 86px minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1.2fr); gap: 14px; align-items: center; font-size: 13px;
  }
  .sb-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .sb-row.doel::before { background: var(--up); } .sb-row.stop::before { background: var(--down); } .sb-row.verlopen::before { background: var(--muted); }
  .sb-name { min-width: 0; }
  .sb-name b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-name small { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .sb-plan { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .sb-plan small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .track { position: relative; height: 8px; background: var(--panel-2); border-radius: 6px; margin: 6px 0 4px; }
  .track .fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .track .fill.pos { background: var(--up); } .track .fill.neg { background: var(--down); }
  .track .zero { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--muted); transform: translateX(-50%); }
  .track .dot { position: absolute; top: -3px; width: 4px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }
  .track-l { display: flex; justify-content: space-between; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .track-l .t { color: var(--up); } .track-l .s { color: var(--down); }
  .sb-res { font-size: 12px; text-align: right; }
  .sb-res .big { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }
  .sb-res small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .mini { display: block; margin-top: 5px; }
  .mini .track { height: 5px; margin: 0; }
  .mini .track .zero, .mini .track .dot { top: -2px; height: 9px; }
  @media (max-width: 860px) {
    .sb-row { grid-template-columns: minmax(0,1fr) auto; gap: 8px 12px; }
    .sb-row .sb-name { grid-column: 1; }
    .sb-row .pill { grid-column: 2; grid-row: 1; justify-self: end; }
    .sb-row .sb-plan, .sb-row .sb-bar { grid-column: 1 / -1; }
    .sb-row .sb-res { grid-column: 1 / -1; text-align: left; }
    .sb-dirs { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .h-row { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 6px 10px; }
    .h-row .h-date { grid-column: 1; grid-row: 1; }
    .h-row .pill { grid-column: 2; grid-row: 1; justify-self: end; }
    .h-row .h-name { grid-column: 1 / -1; }
    .h-row .h-px { grid-column: 1; white-space: nowrap; }
    .h-row .h-px small { white-space: normal; }
    .h-row .h-res { grid-column: 2; text-align: right; }
    .pos summary { grid-template-columns: minmax(0,1fr) minmax(0,1fr) 16px; }
    .pos summary .p-name { grid-column: 1 / 3; }
    .pos summary::after { grid-column: 3; grid-row: 1; }
    .pos summary .top3 { grid-column: 1 / -1; }
    .pos-body { grid-template-columns: 1fr; gap: 0; }
  }
  @media (max-width: 520px) {
    body { padding: 18px 12px 40px; }
    header.top { flex-direction: column; align-items: stretch; }
    .summary { gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1><span class="pulse"></span><span id="pageTitle">Archief</span></h1>
      <p id="pageSub">Per handelsdag de patronen en adviezen van de Patroonradar</p>
    </div>
  </header>

  <div class="viewnav" role="tablist">
    <button data-view="day" role="tab">Archief per dag</button>
    <button data-view="score" role="tab">Scorebord</button>
  </div>
  <div class="summary" id="summary" hidden></div>
  <div id="scoreView" hidden></div>
  <div id="dayView">
  <div class="daynav">
    <button id="prev" title="Vorige dag">◀</button>
    <select id="daySel" aria-label="Kies een dag" hidden></select>
    <div class="daypick" id="dayPick">
      <button id="dayBtn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="dayLbl">–</span><i class="chev"></i></button>
      <ul id="dayList" role="listbox" hidden></ul>
    </div>
    <button id="next" title="Volgende dag">▶</button>
  </div>
  <div class="dayinfo" id="dayinfo"></div>
  <div id="day"></div>
  </div>
</div>

<script>
// Welk archief: je eigen investeringen (standaard) of de Top 250 (archief.html?set=top250)
const SET = new URLSearchParams(location.search).get('set') === 'top250' ? 'top250' : 'investeringen';
const CFG = {
  investeringen: { title: 'Archief · Investeringen', sub: 'Per handelsdag de patronen en adviezen voor je eigen posities',
                   dir: 'archive', file: 'signals.json', ui: 'archive_ui', start: 'maandag 28 september', every: 'elke 15 minuten',
                   one: 'positie', many: 'posities', Many: 'Posities' },
  top250:        { title: 'Archief · Kansen portefeuille', sub: 'Per handelsdag de patronen en adviezen voor je kansen',
                   dir: 'archive_top250', file: 'signals_top250.json', ui: 'archive_ui_top250', start: 'woensdag 30 september', every: 'elk uur',
                   one: 'stock', many: 'stocks', Many: 'Stocks' }
}[SET];
document.title = CFG.title;
const DOWN_PILL = SET === 'top250' ? 'NIET KOPEN' : 'VERKOPEN';   // Top 250: je hebt ze niet, dus een daling = wachten
const DEMO = null; /*__DEMO__*/
const SKIP_CATEGORIES = ["ETF's"];
const MERGE_CATEGORY = { Watchlist: 'Stocks' };
const GH_OWNER = 'Maurits226', GH_REPO = 'Investeringen', GH_BRANCH = 'main';
const UI_KEY = CFG.ui;

const fmt = (n, cur) => n == null ? '–' : new Intl.NumberFormat('nl-NL', { style: 'currency', currency: cur || 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
const pct = (n, d = 1) => n == null ? '–' : (n >= 0 ? '+' : '') + n.toFixed(d).replace('.', ',') + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function toDate(iso) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  return new Date(iso);
}
const dag = iso => iso ? toDate(iso).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }) : '–';
const dagLang = iso => toDate(iso).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const tijd = iso => iso ? toDate(iso).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '–';
const dagTijd = iso => iso ? dag(iso) + ' ' + tijd(iso) : '–';
const localDay = iso => { const d = toDate(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

let ui = { show: 'signal', view: 'day', sbFilter: 'all', sbSort: 'new' };
// Filters blijven bewaard zolang dit browsertabblad open is (ook bij verversen); tabblad of browser dicht = standaard
try { ui = { ...ui, ...JSON.parse(sessionStorage.getItem(UI_KEY) || '{}') }; } catch (e) {}
const saveUI = () => { try { sessionStorage.setItem(UI_KEY, JSON.stringify({ show: ui.show, view: ui.view, sbFilter: ui.sbFilter, sbSort: ui.sbSort })); } catch (e) {} };

let index = [], live = { history: [], items: [] }, trades = [], dayCache = {}, current = null, newestSeen = null;

// ---- Laden ----
async function getJSON(url) {
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function loadTrades() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem('radar_trades') || '[]'); } catch (e) {}
  let remote = [];
  if (!DEMO) try {
    const headers = { Accept: 'application/vnd.github+json' };
    const tk = localStorage.getItem('gh_token'); if (tk) headers.Authorization = 'Bearer ' + tk;
    const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/radar.json?ref=${GH_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
    if (r.ok) {
      const bin = atob((await r.json()).content.replace(/\n/g, ''));
      remote = JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)))).trades || [];
    }
  } catch (e) {}
  const m = {};
  [...remote, ...local].forEach(t => { if (t && t.id && (!m[t.id] || (t.updated || '') > (m[t.id].updated || ''))) m[t.id] = t; });
  trades = Object.values(m).filter(t => !t.deleted && (t.set || 'investeringen') === SET);
}
async function loadDay(date, force) {
  if (!force && dayCache[date]) return dayCache[date];
  const d = DEMO ? DEMO.days[date] : await getJSON(`${CFG.dir}/${date}.json`);
  dayCache[date] = d;
  return d;
}
async function load(first) {
  try {
    if (DEMO) { index = DEMO.index.days; live = DEMO.signals; }
    else {
      index = (await getJSON(`${CFG.dir}/index.json`)).days || [];
      try { live = await getJSON(CFG.file); } catch (e) {}
    }
  } catch (e) {
    document.getElementById('day').innerHTML = `<div class="empty">Het archief begint op ${CFG.start}. Vanaf dan komt er elke handelsdag automatisch een dag bij.</div>`;
    document.querySelector('.daynav').hidden = true;
    return;
  }
  await loadTrades();
  setView(ui.view);
  document.querySelector('.daynav').hidden = !index.length;
  if (!index.length) return;
  const newest = index[0].date;
  let force = false;
  if (first || !current || current === newestSeen || !index.some(d => d.date === current)) { current = newest; force = true; }
  newestSeen = newest;
  fillSelect();
  renderSummary();
  await show(current, force);
}

// ---- Scorebord per advies ----
// Resultaat in % in de richting van het advies: bij kopen = koersstijging, bij verkopen = vermeden daling.
function adviesStand(h) {
  const p = h.plan || {}, up = h.dir === 'up';
  const mv = x => x == null || !p.entry ? null : (up ? (x / p.entry - 1) * 100 : (1 - x / p.entry) * 100);
  const liveItem = (live.items || []).find(i => i.symbol === h.symbol);
  const nowPx = h.outcome === 'open' ? ((liveItem && liveItem.price) || h.last_price) : null;
  const res = h.outcome === 'open' ? (nowPx != null ? mv(nowPx) : h.result_pct) : h.result_pct;
  let days = h.days;
  if (days == null && h.start) {                     // oudere adviezen zonder teller: werkdagen sinds de start
    days = 0; const d = toDate(h.start), end = h.outcome_at ? toDate(h.outcome_at) : new Date();
    for (const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); x <= end; x.setDate(x.getDate() + 1)) if (x.getDay() % 6) days++;
  }
  return { res, doelPct: mv(p.target), stopPct: mv(p.stop), days: Math.min(days ?? 0, 10), nowPx };
}
function trackHTML(h, st, mini) {
  const lo = Math.min(st.stopPct ?? -5, -0.5), hi = Math.max(st.doelPct ?? 5, 0.5);
  const pos = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
  const z = pos(0), r = st.res == null ? null : pos(st.res);
  const fill = r == null ? '' : `<span class="fill ${st.res >= 0 ? 'pos' : 'neg'}" style="left:${Math.min(z, r)}%;width:${Math.abs(r - z)}%"></span>`;
  const bar = `<div class="track">${fill}<span class="zero" style="left:${z}%"></span>${r == null ? '' : `<span class="dot" style="left:${r}%"></span>`}</div>`;
  if (mini) return `<span class="mini" title="Van stop (links) naar doel (rechts); wit = stand nu">${bar}</span>`;
  return `${bar}<div class="track-l"><span class="s">stop ${pct(st.stopPct)}</span><span>start</span><span class="t">doel ${pct(st.doelPct)}</span></div>`;
}
const UITKOMST = { open: 'loopt', doel: 'doel gehaald', stop: 'stop geraakt', verlopen: 'termijn verstreken' };
function scoreHist() {
  return (live.history || []).filter(h => h.plan && !skipCat(((live.items || []).find(i => i.symbol === h.symbol) || {}).category));
}
function renderScore() {

      </div>
    </div>`;
  };
  let list = all.filter(h => ui.sbFilter === 'all' || (ui.sbFilter === 'mine' ? trades.some(t => t.episode === h.id) : h.outcome === ui.sbFilter));
  list.sort((a, b) => ui.sbSort === 'best' ? (adviesStand(b).res ?? -1e9) - (adviesStand(a).res ?? -1e9)

    : (b.start || '').localeCompare(a.start || ''));
  const rows = list.map(h => {

      <span class="pill ${h.dir}">${h.dir === 'up' ? 'KOPEN' : DOWN_PILL}</span>

    </div>`;
  }).join('');
  box.innerHTML = `
    <div class="sb-dirs">${dirLine('up', 'Koopadviezen')}${dirLine('down', SET === 'top250' ? 'Nog-niet-kopen-adviezen' : 'Verkoopadviezen')}</div>
    <div class="sb-tools">
      <select id="sbFilter"><option value="all">Alle adviezen</option><option value="open">Lopend</option><option value="doel">Doel gehaald</option><option value="stop">Stop geraakt</option><option value="verlopen">Termijn verstreken</option><option value="mine">Door jou opgevolgd</option></select>
      <select id="sbSort"><option value="new">Datum (nieuw → oud)</option><option value="best">Resultaat (hoog → laag)</option><option value="worst">Resultaat (laag → hoog)</option></select>

    </div>

  document.getElementById('sbFilter').value = ui.sbFilter;
  document.getElementById('sbSort').value = ui.sbSort;
}
function setView(v) {
  ui.view = v; saveUI();
  document.querySelectorAll('.viewnav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('dayView').hidden = v !== 'day';
  document.getElementById('scoreView').hidden = v !== 'score';
  document.getElementById('summary').hidden = v !== 'score';
  if (v === 'score') renderScore();
  if (index.length) renderSummary();
}

async function show(date, force) {
  current = date;
  const sel = document.getElementById('daySel'); sel.value = date;
  syncPicker();
  const i = index.findIndex(d => d.date === date);
  document.getElementById('prev').disabled = i >= index.length - 1;
  document.getElementById('next').disabled = i <= 0;
  const box = document.getElementById('day');
  let snap;
  try { snap = await loadDay(date, force); }
  catch (e) { box.innerHTML = `<div class="empty">Deze dag kon niet geladen worden.</div>`; return; }
  if (current !== date) return;

  const items = (snap.items || []).filter(it => !skipCat(it.category)).map(it => ({ ...it, category: catOf(it) }));
  const keep = new Set(items.map(it => it.symbol));
  // Een advies zonder signaal meer ("signaal weg") telt als vervallen, niet als lopend
  const gone = (snap.advices || []).filter(a => keep.has(a.symbol) && a.status === 'niet_instappen')
    .map(a => ({ ...a, end: a.end || snap.generated, end_reason: 'vervallen' }));
  const advices = (snap.advices || []).filter(a => keep.has(a.symbol) && a.status !== 'niet_instappen')
    .sort((a, b) => (b.new - a.new) || (b.start || '').localeCompare(a.start || ''));
  const nUp = items.filter(it => it.flag && it.direction === 'up').length;
  const nDown = items.filter(it => it.flag && it.direction === 'down').length;
  const isToday = date === localDay(new Date().toISOString());
  const nAf = (snap.expired || []).filter(a => keep.has(a.symbol)).length + gone.length;
  document.getElementById('dayinfo').innerHTML = `<b>${dagLang(date)}</b> · ${isToday ? 'stand van' : 'slotstand'} ${tijd(snap.generated)}<br>
    <span class="c-up">${nUp} koopsignaal</span> · <span class="c-down">${nDown} verkoopsignaal</span> · ${items.length - nUp - nDown} zonder signaal${nAf ? ` · ${nAf} ${nAf === 1 ? 'advies' : 'adviezen'} afgelopen` : ''}`;

  box.innerHTML = '';
  const add = html => box.insertAdjacentHTML('beforeend', html);
  add(isToday
    ? `<div class="section-header">Lopende adviezen (${advices.length})</div>`
    : `<div class="section-header">Actief aan het eind van deze dag (${advices.length})</div>
       ${advices.length ? '<p class="note" style="margin:-4px 0 10px">Rechts zie je hoe elk advies daarna verliep: loopt het nog, of is het inmiddels vervallen.</p>' : ''}`);
  add(advices.length ? `<div class="h-list">${advices.map(a => adviceRow(a, snap, isToday)).join('')}</div>` : `<div class="empty">Geen actief koop- of verkoopadvies aan het eind van deze dag.</div>`);
  const expired = [...(snap.expired || []).filter(a => keep.has(a.symbol)), ...gone].sort((a, b) => (b.end || '').localeCompare(a.end || ''));
  if (expired.length) {
    add(`<div class="section-header">Afgelopen deze dag (${expired.length})</div>`);
    add(`<div class="h-list">${expired.map(a => expiredRow(a, snap)).join('')}</div>`);
  }

  const opened = trades.filter(t => localDay(t.date) === date);
  const closed = trades.filter(t => t.status === 'closed' && t.closed_at && localDay(t.closed_at) === date);
  if (opened.length || closed.length) {
    add(`<div class="section-header">Jouw acties deze dag</div>`);
    add(`<div class="h-list">${opened.map(t => tradeRow(t, 'open')).join('')}${closed.map(t => tradeRow(t, 'dicht')).join('')}</div>`);
  }

  add(`<div class="section-header">Patronen per ${CFG.one}
    <span class="right"><select id="showSel"><option value="signal">Alleen met signaal</option><option value="all">Alle ${CFG.many}</option></select></span></div>`);
  document.getElementById('showSel').value = ui.show;
  const list = items.filter(it => ui.show === 'all' || it.flag)
    .sort((a, b) => (b.flag - a.flag) || Math.abs(b.projected_pct || 0) - Math.abs(a.projected_pct || 0) || (a.label || a.name || '').localeCompare(b.label || b.name || '', 'nl'));
  const wrapEl = document.createElement('div'); wrapEl.className = 'h-list';
  if (!list.length) wrapEl.innerHTML = `<div class="empty">Geen ${CFG.many} met een signaal op deze dag. Kies "Alle ${CFG.many}" om de patronen van alles te zien.</div>`;
  list.forEach(it => wrapEl.appendChild(posCard(it, snap)));
  box.appendChild(wrapEl);
  const errs = (snap.errors || []).filter(e => !skipCat(e.category));
  if (ui.show === 'all' && errs.length) add(`<div class="err" style="margin-top:8px">Geen data die dag: ${errs.map(e => esc(e.label || e.name || e.symbol)).join(', ')}</div>`);
}

document.getElementById('daySel').onchange = e => show(e.target.value);
document.getElementById('prev').onclick = () => { const i = index.findIndex(d => d.date === current); if (i < index.length - 1) show(index[i + 1].date); };
document.getElementById('next').onclick = () => { const i = index.findIndex(d => d.date === current); if (i > 0) show(index[i - 1].date); };
document.addEventListener('change', e => {
  if (e.target.id === 'showSel') { ui.show = e.target.value; saveUI(); show(current); }
  if (e.target.id === 'sbFilter') { ui.sbFilter = e.target.value; saveUI(); renderScore(); renderSummary(); }
  if (e.target.id === 'sbSort') { ui.sbSort = e.target.value; saveUI(); renderScore(); }
});
document.querySelectorAll('.viewnav button').forEach(b => b.onclick = () => setView(b.dataset.view));
// Tegels bovenaan = snelkoppeling naar het scorebord met dat filter (nog eens klikken = alle adviezen)
document.getElementById('summary').addEventListener('click', e => {
  const t = e.target.closest('.stat[data-f]'); if (!t) return;
  const f = t.dataset.f;
  ui.sbFilter = (ui.view === 'score' && ui.sbFilter === f) ? 'all' : f;
  saveUI(); setView('score');
});
document.getElementById('dayBtn').onclick = e => { e.stopPropagation(); togglePicker(); };
document.getElementById('dayList').onclick = e => {
  const li = e.target.closest('li[data-date]'); if (!li) return;
  togglePicker(false); show(li.dataset.date);
};
document.addEventListener('click', e => { if (!e.target.closest('#dayPick')) togglePicker(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') togglePicker(false); });

load(true);
setInterval(() => { if (ui.view === 'score' || (index.length && current === index[0].date)) load(); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (index.length && current === index[0].date) load();
});
document.getElementById('pageTitle').textContent = CFG.title;
document.getElementById('pageSub').textContent = CFG.sub;
</script>
</body>
</html>
