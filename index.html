<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investments</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #141517;
    --panel: #1a1c1e;
    --panel-2: #202224;
    --line: #2a2c2f;
    --muted: #83888d;
    --text: #eceef0;
    --up: #3ecf8e;
    --down: #f0595f;
    --warn: #f5b544;
    --accent: #4f8ff0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #1e2430 0%, transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 26px;
  }
  .title-block h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px;
  }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%; background: var(--up);
    box-shadow: 0 0 0 0 rgba(55,211,154,.55);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(55,211,154,.5); }
    70% { box-shadow: 0 0 0 10px rgba(55,211,154,0); }
    100% { box-shadow: 0 0 0 0 rgba(55,211,154,0); }
  }
  .title-block p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 15px;
    border-radius: 10px; font-size: 13px; font-weight: 500; transition: .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .updated { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  #interval {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 12px;
    border-radius: 10px; font-size: 13px;
  }
  #interval:hover { border-color: var(--accent); }
  .countdown { color: var(--accent); }

  .summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  }
  .stat.clickable { cursor: pointer; transition: border-color .15s, transform .15s; }
  .stat.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat.clickable:active { transform: translateY(0); }
  .stat.clickable.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-top: 8px; }
  .stat .sub { font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .toolbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin-bottom: 20px; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .tb-group { display: flex; align-items: center; gap: 8px; }
  .tb-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .toolbar select {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 7px 11px;
    border-radius: 9px; font-size: 13px;
  }
  .toolbar select:hover { border-color: var(--accent); }
  .tb-count { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-left: auto; }
  .section-header {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
    margin-top: 18px; margin-bottom: 2px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    scroll-margin-top: 16px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-header::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent);
  }

  .position {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1.6fr 1.3fr auto; gap: 18px; align-items: center;
    position: relative; overflow: hidden; transition: .2s;
  }
  .position::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line);
  }
  .position.alert::before { background: var(--down); }
  .position.alert {
    border-color: rgba(255,93,108,.5);
    box-shadow: 0 0 0 1px rgba(255,93,108,.25), 0 8px 30px -12px rgba(255,93,108,.4);
  }

  .p-name { display: flex; flex-direction: column; gap: 4px; }
  .p-ticker { font-size: 19px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; }
  .p-company { font-size: 12px; color: var(--muted); max-width: 200px; }
  .src { font-size: 10px; font-weight: 600; margin-left: 4px; }
  .src-live { color: var(--up); }
  .src-proxy { color: var(--warn); }

  .p-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .p-block .v { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-top: 4px; }
  .v.up { color: var(--up); } .v.down { color: var(--down); }

  .bar-wrap { display: flex; flex-direction: column; gap: 7px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 6px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--down), var(--warn), var(--up)); }
  .bar-marker { position: absolute; top: -3px; width: 3px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }
  .drop-tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }

  .p-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.buy { background: rgba(255,93,108,.15); color: var(--down); border: 1px solid rgba(255,93,108,.4); }
  .badge.hold { background: rgba(134,149,179,.12); color: var(--muted); border: 1px solid var(--line); }
  .remove { background: none; border: none; color: var(--muted); font-size: 12px; padding: 2px; cursor: pointer; }
  .remove:hover { color: var(--down); }
  .edit-cost { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .edit-cost:hover { border-color: var(--accent); color: var(--text); }

  .profit-block { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  .profit-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .sells { display: flex; flex-direction: column; gap: 3px; }
  .sell-row { font-size: 11px; color: var(--up); font-family: 'IBM Plex Mono', monospace; display: flex; align-items: center; gap: 4px; }
  .sell-row.reopened { color: var(--warn); }
  .sell-date { color: var(--muted); margin-left: 2px; }
  .undo-sell { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 0 2px; margin-left: auto; opacity: .5; }
  .undo-sell:hover { color: var(--down); opacity: 1; }
  .next-target { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .realise {
    background: rgba(55,211,154,.15); border: 1px solid rgba(55,211,154,.45); color: var(--up);
    font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    text-align: left; line-height: 1.3;
  }
  .realise:hover { background: rgba(55,211,154,.28); }

  .state { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .err { color: var(--warn); }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(4,8,18,.7); }
  dialog h3 { margin-bottom: 16px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--ink); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }

  @media (max-width: 860px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .position { grid-template-columns: 1fr 1fr; }
    .p-actions { grid-column: span 2; flex-direction: row; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .bar-wrap { grid-column: span 2; }
    .profit-block { grid-column: span 2; }
  }
  @media (max-width: 520px) {
    body { padding: 18px 12px 40px; }
    header.top { flex-direction: column; align-items: stretch; }
    .controls { justify-content: space-between; }
    .summary { gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
    .position { grid-template-columns: 1fr 1fr; padding: 16px; gap: 14px; }
    .p-name { grid-column: span 2; }
    .p-ticker { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1><span class="pulse"></span>Investments</h1>
      <p>Live koersen via Yahoo Finance</p>
    </div>
    <div class="controls">
      <span class="updated" id="updated">laden…</span>
      <button class="primary" id="add">+ Positie</button>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">Sorteer</span>
      <select id="sortSel">
        <option value="section">Categorie (standaard)</option>
        <option value="name">Naam (A-Z)</option>
        <option value="result">Resultaat (hoog-laag)</option>
        <option value="signal">Dichtst bij koopsignaal</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Categorie</span>
      <select id="catSel">
        <option value="all">Alle</option>
        <option value="Watchlist">Watchlist</option>
        <option value="Stocks">Stocks</option>
        <option value="ETF's">ETF's</option>
        <option value="Gold & Silver">Edelmetalen</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Status</span>
      <select id="statusSel">
        <option value="all">Alles</option>
        <option value="signals">Koopsignalen</option>
        <option value="open">Openstaande verkoop</option>
      </select>
    </div>
    <span class="tb-count" id="tbCount"></span>
  </div>

  <div class="cards" id="cards"></div>

</div>

<dialog id="dlg">
  <h3>Positie toevoegen</h3>
  <div class="field">
    <label>Ticker (Yahoo-symbool — beurs bepaalt de valuta)</label>
    <input id="f-ticker" placeholder="1YD.DE" autocomplete="off">
    <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">
      Xetra = <code style="background:var(--panel-2);padding:1px 4px;border-radius:3px">.DE</code> (EUR) ·
      Amsterdam = <code style="background:var(--panel-2);padding:1px 4px;border-radius:3px">.AS</code> ·
      NASDAQ = geen achtervoegsel (USD)
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>Categorie</label>
      <select id="f-section">
        <option value="Stocks" selected>Stocks</option>
        <option value="ETF's">ETF's</option>
        <option value="Gold &amp; Silver">Gold &amp; Silver</option>
        <option value="Watchlist">Watchlist (alleen volgen)</option>
      </select>
    </div>
    <div class="field">
      <label>Aankoopprijs</label>
      <input id="f-cost" type="number" step="0.01" placeholder="281.19">
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>Aantal</label>
      <input id="f-qty" type="number" step="0.0001" placeholder="1">
    </div>
    <div class="field">
      <label>Waarschuwing bij daling t.o.v. top</label>
      <select id="f-thresh">
        <option value="10">10%</option>
        <option value="15">15%</option>
        <option value="20" selected>20%</option>
        <option value="25">25%</option>
        <option value="30">30%</option>
      </select>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>Aankoopvaluta (weergave)</label>
      <select id="f-cur">
        <option value="native" selected>zoals genoteerd</option>
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
      </select>
    </div>
    <div class="field"></div>
  </div>
  <div class="dialog-actions">
    <button id="f-cancel">Annuleren</button>
    <button class="primary" id="f-save">Opslaan</button>
  </div>
</dialog>

<script>
const DEFAULT = [
  // Watchlist: geen aankoopprijs, alleen volgen
  { ticker: 'SPX.DE',  section: 'Watchlist', watch: true, thresh: 20, cur: 'native' },

  // Stocks

  { ticker: 'LAR0.DE', section: 'Stocks', cost: 268.90, qty: 1, thresh: 20, cur: 'native' },

  { ticker: '45C.DE',  section: 'Stocks', cost: 89.44,  qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'GOS.DE',  section: 'Stocks', cost: 739.00, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'CMC.DE',  section: 'Stocks', cost: 255.59, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'DWD.DE',  section: 'Stocks', cost: 147.57, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'NVD.DE',  section: 'Stocks', cost: 87.76,  qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'PTX.DE',  section: 'Stocks', cost: 123.29, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'TSFA.DU', section: 'Stocks', cost: 313.50, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'ASML.AS', section: 'Stocks', cost: 704.60, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'UU2.DE',  section: 'Stocks', cost: 853.60, qty: 1, thresh: 20, cur: 'native' },
  { ticker: 'MSF.DE',  section: 'Stocks', cost: 353.15, qty: 1, thresh: 20, cur: 'native' },

  // ETF's
  { ticker: 'QDVE.DE', section: "ETF's", label: 'S&P 500 Information Technology', cost: 29.983, qty: 1, thresh: 10, cur: 'native' },
  { ticker: 'VHYL.MI', section: "ETF's", label: 'Vanguard High Dividend', cost: 81.669, qty: 1, thresh: 10, cur: 'native' },
  { ticker: 'VUAA.MI', section: "ETF's", label: 'S&P 500', cost: 93.02,  qty: 1, thresh: 10, cur: 'native' },

  // Gold & Silver
  { ticker: 'WSLV.MI', section: 'Gold & Silver', label: 'Silver', cost: 64.32,  qty: 1, thresh: 10, cur: 'native' },
  { ticker: 'PHAU.AS', section: 'Gold & Silver', label: 'Gold', cost: 364.33, qty: 1, thresh: 10, cur: 'native' }
];

// Volgorde waarin de secties getoond worden
const SECTION_ORDER = ['Watchlist', 'Stocks', "ETF's", 'Gold & Silver'];

// Verhoog dit nummer wanneer de standaardlijst wijzigt; dan wordt de lijst zelf
// opnieuw ingeladen. Je gerealiseerde verkopen en aangepaste aankoopprijzen
// (opgeslagen onder 'portfolio_state') blijven daarbij behouden.
const DEFAULT_VERSION = 20;

// Geef elke DEFAULT-positie een stabiel id (sectie + ticker), zodat we per
// positie de verkoop-historie en prijsaanpassingen kunnen bewaren.
function posId(p) { return (p.section || 'X') + '|' + p.ticker; }

// Gebruikersstate per positie-id: { cost, sells: [{level, pct, date}] }
function loadState() {
  try {
    const s = localStorage.getItem('portfolio_state');
    if (s) return JSON.parse(s);
  } catch (e) {}
  return {};
}
function saveState() {
  try { localStorage.setItem('portfolio_state', JSON.stringify(userState)); } catch (e) {}
}
let userState = loadState();

function loadPositions() {
  let base;
  try {
    const savedVer = parseInt(localStorage.getItem('portfolio_version') || '0');
    const saved = localStorage.getItem('portfolio_positions');
    if (saved && savedVer >= DEFAULT_VERSION) {
      base = JSON.parse(saved);
    }
  } catch (e) {}
  if (!base) {
    base = DEFAULT.map(p => ({ ...p }));
    try {
      localStorage.setItem('portfolio_positions', JSON.stringify(base));
      localStorage.setItem('portfolio_version', String(DEFAULT_VERSION));
    } catch (e) {}
  }
  // Pas opgeslagen aangepaste aankoopprijzen toe
  base.forEach(p => {
    const st = userState[posId(p)];
    if (st && st.cost != null) p.cost = st.cost;
  });
  return base;
}
function savePositions() {
  try {
    localStorage.setItem('portfolio_positions', JSON.stringify(positions));
    localStorage.setItem('portfolio_version', String(DEFAULT_VERSION));
  } catch (e) {}
}

let positions = loadPositions();

// Winst-cyclus: elke +50% een trede. Trede 1,4,7.. = 10%, trede 2,5,8.. = 20%,
// trede 3,6,9.. = 30% van de winst verkopen.
function sellPctForStep(step) {
  const mod = ((step - 1) % 3);
  return mod === 0 ? 10 : (mod === 1 ? 20 : 30);
}
// Hoeveel treden zijn bereikt bij een bepaald winstpercentage (elke 50%)
function stepsReached(plPct) {
  if (plPct < 50) return 0;
  return Math.floor(plPct / 50);
}

// Kerngetallen per positie, gebruikt voor sorteren en filteren
function metrics(p, q) {
  if (!q) return { plPct: -Infinity, drop: -Infinity, alert: false, openSell: false };
  const isWatch = p.watch || p.cost == null;
  const plPct = isWatch ? 0 : ((q.price - p.cost) / p.cost) * 100;
  const drop = q.high52 ? ((q.high52 - q.price) / q.high52) * 100 : 0;
  const alert = drop >= p.thresh;
  // Openstaande verkoop? (winsttrede bereikt en nog niet/again te realiseren)
  let openSell = false;
  if (!isWatch) {
    const st = userState[posId(p)] || {};
    const sells = st.sells || [];
    const reached = stepsReached(plPct);
    const maxDone = sells.length ? Math.max(...sells.map(s => s.level)) : 0;
    // heropend?
    let heropend = false;
    for (let step = 1; step <= maxDone; step++) {
      const opStap = sells.filter(s => s.level === step);
      const v = opStap.length ? opStap[opStap.length - 1] : null;
      if (v && v.price != null && step <= reached && q.price <= v.price * 0.75) { heropend = true; break; }
    }
    openSell = heropend || (reached >= maxDone + 1);
  }
  return { plPct, drop, alert, openSell };
}

const fmt = (n, cur) => new Intl.NumberFormat('nl-NL', {
  style: 'currency', currency: cur || 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2
}).format(n);
const pct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';

// De data komt uit data.json, dat GitHub Actions elke 15 min bijwerkt.
// Geen CORS, geen proxy — het dashboard leest gewoon zijn eigen bestand.
let dataCache = null;
let dataUpdated = null;

async function loadData() {
  // cache-buster zodat de browser niet een oude versie vasthoudt
  const r = await fetch('data.json?t=' + Date.now());
  if (!r.ok) throw new Error('data.json niet gevonden');
  const j = await r.json();
  dataCache = j.quotes || {};
  dataUpdated = j.updated || null;
}

function getQuote(ticker) {
  const q = dataCache && dataCache[ticker.toUpperCase()];
  if (!q || q.price == null) return null;
  return {
    price: q.price,
    prevClose: q.prevClose,
    currency: q.currency || 'USD',
    name: q.name || ticker,
    high52: q.high52,
    low52: q.low52,
    source: 'github'
  };
}

function positionCard(p, q, err) {
  const el = document.createElement('div');
  el.className = 'position';
  if (err || !q) {
    el.innerHTML = `
      <div class="p-name"><span class="p-ticker">${p.ticker}</span>
        <span class="p-company err">Koers niet geladen — bronnen geblokkeerd</span></div>
      <div style="grid-column: span 3; font-size:12px; color:var(--muted); line-height:1.5">
        Nog geen data voor deze ticker. Staat hij in <code>tickers.txt</code>? Draai anders
        de GitHub Action één keer handmatig (tab <strong>Actions</strong> → <strong>Run workflow</strong>)
        en ververs daarna.
      </div>
      <div class="p-actions"><button class="remove" data-t="${p.ticker}">verwijder</button></div>`;
    el.querySelector('.remove').onclick = () => removePosition(p.ticker);
    return el;
  }

  const cur = p.cur === 'native' ? q.currency : p.cur;
  const dayChg = q.prevClose ? ((q.price - q.prevClose) / q.prevClose) * 100 : 0;
  const fromHigh = ((q.price - q.high52) / q.high52) * 100; // negatief = onder top
  const dropFromHigh = -fromHigh;
  const isWatch = p.watch || p.cost == null;
  const plPct = isWatch ? 0 : ((q.price - p.cost) / p.cost) * 100;
  const plAbs = isWatch ? 0 : (q.price - p.cost) * (p.qty || 1);
  const alert = dropFromHigh >= p.thresh;
  const rangePos = Math.max(0, Math.min(100, ((q.price - q.low52) / (q.high52 - q.low52)) * 100));

  if (alert) el.classList.add('alert');

  const id = posId(p);
  const st = userState[id] || {};
  const sells = st.sells || [];

  const resultBlock = isWatch
    ? `<div class="p-block">
         <div class="k">Op watchlist</div>
         <div class="v" style="color:var(--muted)">volgen</div>
         <div class="drop-tag" style="color:var(--muted)">geen positie</div>
       </div>`
    : `<div class="p-block">
         <div class="k">Resultaat (koop ${fmt(p.cost, cur)})</div>
         <div class="v ${plPct >= 0 ? 'up' : 'down'}">${pct(plPct)}</div>
       </div>`;

  // Winstniveau-blok (niet voor watchlist)
  let profitBlock = '';
  if (!isWatch) {
    const reached = stepsReached(plPct);   // hoogste bereikte trede op basis van huidige winst

    // Voor elke trede: is hij al gerealiseerd en nog "geldig"?
    // Een verkoop op een trede vervalt (trede weer beschikbaar) zodra de koers
    // 25% of meer onder de verkoopkoers van die verkoop is gezakt (optie B),
    // MAAR alleen zolang je nog boven dat winstniveau zit.
    const REOPEN_DROP = 0.25;
    function laatsteVerkoop(step) {
      const opStap = sells.filter(s => s.level === step);
      return opStap.length ? opStap[opStap.length - 1] : null;
    }
    // Is een reeds afgevinkte trede vervallen (dus opnieuw te realiseren)?
    function tredeVervallen(step) {
      const v = laatsteVerkoop(step);
      if (!v || v.price == null) return false;
      if (step > reached) return false;           // je zit niet meer op dit winstniveau
      return q.price <= v.price * (1 - REOPEN_DROP);
    }

    const maxDone = sells.length ? Math.max(...sells.map(s => s.level)) : 0;

    // Zoek de laagste AFGEVINKTE trede die is vervallen (heropend)
    let openStep = null;
    for (let step = 1; step <= maxDone; step++) {
      if (laatsteVerkoop(step) && tredeVervallen(step)) { openStep = step; break; }
    }
    // Geen heropende trede? Dan is de eerstvolgende trede maxDone+1,
    // en die is realiseerbaar zodra hij bereikt is.
    const isHeropend = openStep != null;
    const nextStep = isHeropend ? openStep : (maxDone + 1);
    const nextTargetPct = nextStep * 50;
    const nextSellPct = sellPctForStep(nextStep);
    const canRealise = isHeropend || (reached >= nextStep);

    // Lijst van gerealiseerde verkopen
    let sellsHtml = '';
    if (sells.length) {
      sellsHtml = '<div class="sells">' + sells
        .map((s, i) => ({ s, i }))
        .sort((a,b)=>a.s.level-b.s.level)
        .map(({ s, i }) => {
          const heropend = laatsteVerkoop(s.level) === s && tredeVervallen(s.level);
          const cls = heropend ? 'sell-row reopened' : 'sell-row';
          const mark = heropend ? '↻' : '✓';
          return `<div class="${cls}">${mark} +${s.level*50}% → ${s.pct}% verkocht <span class="sell-date">${s.date}</span> <button class="undo-sell" data-id="${id}" data-idx="${i}" title="verwijder deze registratie">✕</button></div>`;
        })
        .join('') + '</div>';
    }

    const btnHtml = canRealise
      ? `<button class="realise" data-id="${id}" data-step="${nextStep}" data-pct="${nextSellPct}">
           ${isHeropend ? 'Opnieuw realiseren' : 'Realiseer'} +${nextTargetPct}% (verkoop ${nextSellPct}%)
         </button>`
      : `<div class="next-target">Volgende: +${nextTargetPct}% → ${nextSellPct}% verkopen</div>`;

    profitBlock = `
      <div class="profit-block">
        <div class="k">Winst nemen</div>
        ${sellsHtml}
        ${btnHtml}
      </div>`;
  }

  el.innerHTML = `
    <div class="p-name">
      <span class="p-ticker">${p.label || q.name}</span>
      <span class="p-company">(${p.ticker}) <span class="src src-live">● data</span></span>
    </div>
    <div class="p-block">
      <div class="k">Huidige koers</div>
      <div class="v ${isWatch ? '' : (plPct >= 0 ? 'up' : 'down')}">${fmt(q.price, cur)}</div>
    </div>
    ${resultBlock}
    <div class="bar-wrap">
      <div class="bar-labels"><span>${fmt(q.low52, cur)}</span><span>52-wk range</span><span>${fmt(q.high52, cur)}</span></div>
      <div class="bar">
        <div class="bar-fill" style="width:100%"></div>
        <div class="bar-marker" style="left:${rangePos}%"></div>
      </div>
      <div class="drop-tag" style="color:${alert?'var(--down)':'var(--muted)'}">
        ${dropFromHigh.toFixed(1)}% onder de top · drempel ${p.thresh}%
      </div>
    </div>
    ${profitBlock}
    <div class="p-actions">
      <span class="badge ${alert ? 'buy' : 'hold'}">${alert ? 'KOOPSIGNAAL' : 'geen actie'}</span>
      ${isWatch ? '' : `<button class="edit-cost" data-id="${id}">Aankoopprijs aanpassen</button>`}
      <button class="remove" data-id="${id}">verwijder</button>
    </div>`;

  // Knop: verwijderen
  el.querySelector('.remove').onclick = () => removePosition(id);

  // Knop: aankoopprijs aanpassen
  const editBtn = el.querySelector('.edit-cost');
  if (editBtn) editBtn.onclick = () => {
    const huidige = p.cost;
    const invoer = prompt(
      `Nieuwe gemiddelde aankoopprijs voor ${p.label || p.ticker} (in ${cur}):\n` +
      `Huidig: ${huidige}`, huidige);
    if (invoer == null) return;
    const nieuw = parseFloat(invoer.replace(',', '.'));
    if (!isFinite(nieuw) || nieuw <= 0) { alert('Ongeldig bedrag'); return; }
    userState[id] = userState[id] || {};
    userState[id].cost = nieuw;
    p.cost = nieuw;
    saveState(); savePositions(); render();
  };

  // Knop: verkoop realiseren
  const realBtn = el.querySelector('.realise');
  if (realBtn) realBtn.onclick = () => {
    const step = parseInt(realBtn.dataset.step);
    const sellPct = parseInt(realBtn.dataset.pct);
    const today = new Date().toLocaleDateString('nl-NL');
    userState[id] = userState[id] || {};
    userState[id].sells = userState[id].sells || [];
    // Sla de koers op het verkoopmoment op, zodat we een 25% koersdaling
    // kunnen detecteren die dit niveau opnieuw vrijgeeft (optie B).
    userState[id].sells.push({ level: step, pct: sellPct, date: today, price: q.price });
    saveState(); render();
  };

  // Knoppen: verkoopregistratie verwijderen
  el.querySelectorAll('.undo-sell').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (userState[id] && userState[id].sells) {
        userState[id].sells.splice(idx, 1);
        saveState(); render();
      }
    };
  });

  return el;
}

let firstRender = true;
async function render() {
  const cards = document.getElementById('cards');
  const summary = document.getElementById('summary');
  // Bewaar scrollpositie zodat de pagina niet terugspringt bij verversen
  const scrollY = window.scrollY;
  if (firstRender) cards.innerHTML = '<div class="state">Koersen laden…</div>';

  let loadError = false;
  try {
    await loadData();
  } catch (e) {
    loadError = true;
  }

  const results = positions.map(p => {
    const q = getQuote(p.ticker);
    return { p, q, err: !q };
  });

  cards.innerHTML = '';
  let totalValue = 0, totalCost = 0, alerts = 0, loaded = 0;

  // Tel eerst alle totalen/signalen over ALLE posities (los van filter)
  results.forEach(({ p, q }) => {
    if (q && !p.watch) {
      loaded++;
      totalValue += q.price * (p.qty || 1);
      totalCost += p.cost * (p.qty || 1);
      const m = metrics(p, q);
      if (m.alert) alerts++;
    } else if (q && p.watch) {
      loaded++;
    }
  });

  // Groepeer per sectie (voor tellers)
  const bySection = {};
  results.forEach(r => {
    const sec = r.p.section || 'Overig';
    (bySection[sec] = bySection[sec] || []).push(r);
  });

  // Huidige sorteer- en filterkeuzes
  const sortBy = document.getElementById('sortSel').value;
  const catBy = document.getElementById('catSel').value;
  const statusBy = document.getElementById('statusSel').value;

  // Filter toepassen: categorie EN status samen
  function passesFilter(r) {
    if (catBy !== 'all' && (r.p.section || 'Overig') !== catBy) return false;
    if (statusBy !== 'all') {
      const m = metrics(r.p, r.q);
      if (statusBy === 'signals' && !m.alert) return false;
      if (statusBy === 'open' && !m.openSell) return false;
    }
    return true;
  }
  const filtered = results.filter(passesFilter);

  // Naam-helper
  const naam = r => (r.p.label || (r.q && r.q.name) || r.p.ticker).toLowerCase();

  // Toon in secties (sorteren op categorie én geen status-filter) of platte lijst
  const useSections = (sortBy === 'section') && (statusBy === 'all');

  function renderCard(r) {
    cards.appendChild(positionCard(r.p, r.q, r.err));
  }

  if (useSections) {
    const sections = [...SECTION_ORDER.filter(s => bySection[s]),
                      ...Object.keys(bySection).filter(s => !SECTION_ORDER.includes(s))];
    sections.forEach(sec => {
      const inSec = filtered.filter(r => (r.p.section || 'Overig') === sec);
      if (!inSec.length) return;
      const header = document.createElement('div');
      header.className = 'section-header';
      header.id = 'sec-' + sec.replace(/[^a-zA-Z]/g, '');
      header.textContent = sec;
      cards.appendChild(header);
      inSec.slice().sort((a, b) => naam(a).localeCompare(naam(b), 'nl')).forEach(renderCard);
    });
  } else {
    // Platte, gesorteerde lijst
    const sorted = filtered.slice().sort((a, b) => {
      if (sortBy === 'name') return naam(a).localeCompare(naam(b), 'nl');
      if (sortBy === 'result') return metrics(b.p, b.q).plPct - metrics(a.p, a.q).plPct;
      if (sortBy === 'signal') return metrics(b.p, b.q).drop - metrics(a.p, a.q).drop;
      return naam(a).localeCompare(naam(b), 'nl');
    });
    sorted.forEach(renderCard);
  }

  // Teller: hoeveel getoond
  const tbCount = document.getElementById('tbCount');
  if (tbCount) {
    tbCount.textContent = filtered.length === results.length
      ? `${results.length} posities`
      : `${filtered.length} van ${results.length} getoond`;
  }

  const totalPl = totalValue - totalCost;
  const totalPlPct = totalCost ? (totalPl / totalCost) * 100 : 0;

  const cnt = s => (bySection[s] ? bySection[s].length : 0);
  summary.innerHTML = `
    <div class="stat clickable" data-cat="Stocks"><div class="label">Stocks</div><div class="value">${cnt('Stocks')}</div><div class="sub" style="color:var(--muted)">aandelen</div></div>
    <div class="stat clickable" data-cat="ETF's"><div class="label">ETF's</div><div class="value">${cnt("ETF's")}</div><div class="sub" style="color:var(--muted)">fondsen</div></div>
    <div class="stat clickable" data-cat="Watchlist"><div class="label">Watchlist</div><div class="value">${cnt('Watchlist')}</div><div class="sub" style="color:var(--muted)">gevolgd</div></div>
    <div class="stat clickable" data-cat="Gold & Silver"><div class="label">Edelmetalen</div><div class="value">${cnt('Gold & Silver')}</div><div class="sub" style="color:var(--muted)">goud &amp; zilver</div></div>`;

  const catSel = document.getElementById('catSel');
  summary.querySelectorAll('.stat.clickable').forEach(el => {
    const cat = el.dataset.cat;
    if (catSel.value === cat) el.classList.add('active');
    el.onclick = () => {
      // Klik op actieve categorie = terug naar alle; anders filter op die categorie
      catSel.value = (catSel.value === cat) ? 'all' : cat;
      render();
    };
  });

  let base;
  if (dataUpdated) {
    const d = new Date(dataUpdated);
    base = 'data van ' + d.toLocaleString('nl-NL', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  } else {
    base = 'bijgewerkt ' + new Date().toLocaleTimeString('nl-NL');
  }
  const upd = document.getElementById('updated');
  upd.dataset.base = base;
  upd.textContent = base;

  // Herstel de scrollpositie (behalve bij de allereerste render)
  if (!firstRender) window.scrollTo(0, scrollY);
  firstRender = false;
}

function removePosition(id) {
  positions = positions.filter(p => posId(p) !== id);
  savePositions();
  render();
}

// Dialog
const dlg = document.getElementById('dlg');
document.getElementById('add').onclick = () => dlg.showModal();
document.getElementById('f-cancel').onclick = () => dlg.close();
document.getElementById('f-save').onclick = () => {
  const t = document.getElementById('f-ticker').value.trim().toUpperCase();
  if (!t) return;
  const section = document.getElementById('f-section').value;
  const isWatch = section === 'Watchlist';
  const costVal = parseFloat(document.getElementById('f-cost').value);
  positions.push({
    ticker: t,
    section: section,
    watch: isWatch,
    cost: isWatch ? null : (costVal || 0),
    qty: parseFloat(document.getElementById('f-qty').value) || 1,
    thresh: parseInt(document.getElementById('f-thresh').value),
    cur: document.getElementById('f-cur').value
  });
  ['f-ticker','f-cost','f-qty'].forEach(id => document.getElementById(id).value = '');
  dlg.close();
  savePositions();
  render();
};

// Automatisch verversen: de pagina haalt elke 5 minuten data.json opnieuw op.
// GitHub werkt data.json elke 15 min bij, dus nieuwe koersen komen vanzelf binnen.
setInterval(render, 5 * 60 * 1000);

// Ook verversen zodra je terugkeert naar het tabblad
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
});

// Sorteren en filteren: opnieuw renderen bij wijziging
document.getElementById('sortSel').onchange = render;
document.getElementById('catSel').onchange = render;
document.getElementById('statusSel').onchange = render;

render();
</script>
</body>
</html>
