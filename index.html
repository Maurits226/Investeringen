<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style id="af">html{display:none}</style>
<script src="antiframe.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="preload" href="fonts/SpaceGrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investeringen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141517">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Investeringen">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --accent: #4f8ff0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    /* als app op het beginscherm: niet onder de notch, de statusbalk of de thuisbalk */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  nav.tabs {
    flex: 0 0 auto; display: flex; justify-content: center;
    padding: 12px 18px; background: var(--ink); border-bottom: 1px solid var(--line);
  }
  .navwrap { display: flex; gap: 10px; width: 100%; max-width: 1100px; }
  .seg {
    display: flex; gap: 4px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  }
  /* breedte volgt de labels; groeiruimte naar rato van het aantal knoppen, zodat alle labels even ver uit elkaar staan */
  .seg.world { flex: 2 1 auto; }
  .seg button.home { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding-left: 12px; padding-right: 14px; }
  .seg button.home svg { width: 16px; height: 16px; flex-shrink: 0; }
  .seg.world button.home.active { background: var(--accent); color: #0d1117; }
  /* op Vandaag is het tweede niveau rustiger, maar de labels blijven leesbaar */
  .navwrap.is-home .seg.view { background: transparent; }
  .seg.view { flex: 5 1 auto; }
  .seg button {
    flex: 1 1 auto; min-width: 0; min-height: 40px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 9px; padding: 10px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: transparent; color: var(--muted); transition: background .15s, color .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .seg button:hover { color: var(--text); }
  .seg button:active { background: rgba(255,255,255,.06); }
  /* bovenste niveau: welke wereld (vol blauw) */
  .seg.world button.active { background: var(--accent); color: #0d1117; }
  /* tweede niveau: welk scherm (licht blauw) */
  .seg.view button.active { background: rgba(79,143,240,.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(79,143,240,.55); }
  .seg button .n { font-size: 11px; font-weight: 600; opacity: .75; margin-left: 4px; }
  .seg button .short { display: none; }
  /* tablet en kleine laptop: één rij, iets compacter zodat de labels passen */
  @media (max-width: 1120px) and (min-width: 721px) {
    .seg button { font-size: 14px; padding-left: 8px; padding-right: 8px; }
    .seg button.home { padding-left: 10px; padding-right: 12px; }
  }
  @media (max-width: 1000px) and (min-width: 721px), (max-width: 520px) {
    .seg.view button .full { display: none; }
    .seg.view button .short { display: inline; }
  }
  @media (max-width: 860px) and (min-width: 721px), (max-width: 340px) {
    .seg.world button .full { display: none; }
    .seg.world button .short { display: inline; }
  }
  @media (max-width: 720px) {
    nav.tabs { padding: 10px 12px; }
    .navwrap { flex-direction: column; gap: 6px; }
    .seg button { font-size: 13.5px; padding: 8px 6px; }
    .seg button.home .lbl { display: none; }
    .seg button.home { padding: 8px 12px; }
  }
  @media (max-width: 380px) {
    nav.tabs { padding: 8px 8px; }
    .seg { gap: 2px; padding: 3px; }
    .seg button { font-size: 12.5px; padding: 8px 3px; letter-spacing: -.1px; }
  }
  /* telefoon liggend: één rij met korte labels, anders blijft er te weinig hoogte over */
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 540px) and (max-width: 1000px) {
    nav.tabs { padding: 6px 12px; }
    .navwrap { flex-direction: row; gap: 6px; }
    .seg { padding: 3px; }
    .seg button { font-size: 13.5px; padding: 6px 8px; }
    .seg button.home { padding: 6px 10px; }
    .seg button.home .lbl, .seg button .full { display: none; }
    .seg button .short { display: inline; }
  }
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 540px) and (max-width: 600px) {
    .seg button { font-size: 12.5px; padding: 6px 5px; }
  }
  main { flex: 1 1 auto; position: relative; min-height: 0; }
  /* zolang een scherm nog laadt: tekst in plaats van een leeg vlak (de pagina zelf dekt dit af) */
  main::before {
    content: "Laden…"; position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px;
  }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent; display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
  <nav class="tabs">
    <div class="navwrap">
      <div class="seg world" role="tablist" aria-label="Portefeuille">
        <button role="tab" data-world="home" class="home" title="Vandaag: je dag in één oogopslag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span class="lbl">Vandaag</span></button>
        <button role="tab" data-world="inv"><span class="full">Mijn investeringen</span><span class="short">Investeringen</span></button>
        <button role="tab" data-world="top"><span class="full">Kansen portefeuille</span><span class="short">Kansen</span></button>
      </div>
      <div class="seg view" role="tablist" aria-label="Scherm">
        <button role="tab" data-view="overzicht">Overzicht</button>
        <button role="tab" data-view="score" title="De 12 stappen en de scorecard per aandeel"><span class="full">Beoordeling</span><span class="short">Score</span></button>
        <button role="tab" data-view="radar"><span class="full">Patroonradar</span><span class="short">Radar</span></button>
        <button role="tab" data-view="archief">Archief</button>
        <button role="tab" data-view="koop"><span class="full">Koopmoment</span><span class="short">Koop</span></button>
      </div>
    </div>
  </nav>
  <main>
    <iframe id="home" title="Vandaag" data-src="vandaag.html"></iframe>
    <iframe id="inv-overzicht" title="Investeringen" src="portfolio.html"></iframe>
    <iframe id="inv-score" title="Beoordeling · Investeringen" data-src="beoordeling.html"></iframe>
    <iframe id="inv-radar" title="Patroonradar · Investeringen" data-src="signals.html"></iframe>
    <iframe id="inv-archief" title="Archief · Investeringen" data-src="archief.html"></iframe>
    <iframe id="inv-koop" title="Bijkopen · Investeringen" data-src="koopmoment.html?set=own"></iframe>
    <iframe id="top-overzicht" title="Kansen portefeuille" data-src="screener.html"></iframe>
    <iframe id="top-score" title="Survivors · Kansen portefeuille" data-src="beoordeling.html?set=top"></iframe>
    <iframe id="top-radar" title="Patroonradar · Kansen portefeuille" data-src="signals.html?set=top250"></iframe>
    <iframe id="top-archief" title="Archief · Kansen portefeuille" data-src="archief.html?set=top250"></iframe>
    <iframe id="top-koop" title="Koopmoment · Kansen portefeuille" data-src="koopmoment.html"></iframe>
  </main>
<script>
  // Twee niveaus: wereld (je eigen investeringen of de Top 250) × scherm (overzicht, beoordeling, radar, archief, koopmoment)
  const WORLDS = ['inv', 'top'], VIEWS = ['overzicht', 'score', 'radar', 'archief', 'koop'];
  const HASH = {            // mooie adressen, ook de oude (#patroonradar, #archief, #top250) blijven werken
    'home': 'vandaag',
    'inv-overzicht': 'investeringen', 'inv-radar': 'patroonradar', 'inv-archief': 'archief',
    'top-overzicht': 'top250', 'top-radar': 'top250-radar', 'top-archief': 'top250-archief',
    'inv-koop': 'bijkopen', 'top-koop': 'koopmoment', 'inv-score': 'beoordeling', 'top-score': 'survivors'
  };
  const FROM_HASH = Object.fromEntries(Object.entries(HASH).map(([k, v]) => [v, k]));
  FROM_HASH.signalen = 'inv-radar';
  const TITLE = {
    'home': 'Vandaag',
    'inv-overzicht': 'Investeringen', 'inv-radar': 'Patroonradar · Investeringen', 'inv-archief': 'Archief · Investeringen',
    'top-overzicht': 'Kansen portefeuille', 'top-radar': 'Patroonradar · Kansen portefeuille', 'top-archief': 'Archief · Kansen portefeuille',
    'inv-koop': 'Bijkopen · Investeringen', 'top-koop': 'Koopmoment · Kansen portefeuille',
    'inv-score': 'Beoordeling · Investeringen', 'top-score': 'Survivors · Kansen portefeuille'
  };
  let world = 'inv', view = 'overzicht';

  let atHome = false;
  function show(w, v) {
    atHome = w === 'home';
    if (!atHome) {
      world = WORLDS.includes(w) ? w : 'inv';
      view = VIEWS.includes(v) ? v : 'overzicht';
    }
    const id = atHome ? 'home' : world + '-' + view;
    document.querySelector('.navwrap').classList.toggle('is-home', atHome);
    document.querySelectorAll('.seg.world button').forEach(b => {
      const on = atHome ? b.dataset.world === 'home' : b.dataset.world === world;
      b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('.seg.view button').forEach(b => {
      const on = !atHome && b.dataset.view === view; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('main iframe').forEach(f => {
      const on = f.id === id;
      if (on && !f.getAttribute('src') && f.dataset.src) f.src = f.dataset.src;   // pas laden bij eerste keer openen
      else if (on) try { f.contentWindow.postMessage({ type: 'dashboard-shown' }, location.origin); } catch (e) {}   // tabblad weer getoond: bijwerken (shared.js)
      f.classList.toggle('active', on);
    });
    document.title = TITLE[id];
    try { sessionStorage.setItem('active_tab', id); } catch (e) {}
    if (location.hash !== '#' + HASH[id]) history.replaceState(null, '', '#' + HASH[id]);
  }
  function fromKey(key) {
    const id = FROM_HASH[key] || key;
    if (id === 'home') return ['home'];
    const [w, v] = String(id || '').split('-');
    return [w, v];
  }

  // Wissel je van wereld, dan blijf je op hetzelfde scherm (radar → radar)
  document.querySelectorAll('.seg.world button').forEach(b => b.addEventListener('click', () => show(b.dataset.world, view)));
  // Vanaf Vandaag een scherm kiezen: dat scherm van de laatst gebruikte lijst
  document.querySelectorAll('.seg.view button').forEach(b => b.addEventListener('click', () => show(world, b.dataset.view)));
  window.addEventListener('hashchange', () => show(...fromKey(location.hash.slice(1))));
  // iOS toont de ingedrukte knop (:active) alleen als er een touchstart-luisteraar is
  document.addEventListener('touchstart', () => {}, { passive: true });

  // Nieuw tabblad of browser opnieuw geopend: startscherm Vandaag.
  // Verversen binnen hetzelfde tabblad: je blijft waar je was.
  let start = null;
  try { start = sessionStorage.getItem('active_tab'); } catch (e) {}
  if (start && FROM_HASH[location.hash.slice(1)]) start = FROM_HASH[location.hash.slice(1)];
  show(...fromKey(start || 'home'));
</script>
</body>
</html>
