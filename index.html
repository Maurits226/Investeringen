<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investeringen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --accent: #4f8ff0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  nav.tabs {
    flex: 0 0 auto; display: flex; justify-content: center;
    padding: 12px 18px; background: var(--ink); border-bottom: 1px solid var(--line);
  }
  .navwrap { display: flex; gap: 10px; width: 100%; max-width: 1100px; }
  .seg {
    display: flex; gap: 4px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  }
  .seg.world { flex: 2 1 0; }
  .seg.view { flex: 3 1 0; }
  .seg button {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 9px; padding: 10px 12px; white-space: nowrap;
    background: transparent; color: var(--muted); transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button:hover { color: var(--text); }
  /* bovenste niveau: welke wereld (vol blauw) */
  .seg.world button.active { background: var(--accent); color: #0d1117; }
  /* tweede niveau: welk scherm (licht blauw) */
  .seg.view button.active { background: rgba(79,143,240,.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(79,143,240,.55); }
  .seg button .n { font-size: 11px; font-weight: 600; opacity: .75; margin-left: 4px; }
  @media (max-width: 720px) {
    nav.tabs { padding: 10px 12px; }
    .navwrap { flex-direction: column; gap: 6px; }
    .seg button { font-size: 13.5px; padding: 9px 6px; }
  }
  main { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: var(--ink); display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
  <nav class="tabs">
    <div class="navwrap">
      <div class="seg world" role="tablist" aria-label="Portefeuille">
        <button role="tab" data-world="inv">Mijn investeringen</button>
        <button role="tab" data-world="top">Kansen portefeuille</button>
      </div>
      <div class="seg view" role="tablist" aria-label="Scherm">
        <button role="tab" data-view="overzicht">Overzicht</button>
        <button role="tab" data-view="radar">Patroonradar</button>
        <button role="tab" data-view="archief">Archief</button>
      </div>
    </div>
  </nav>
  <main>
    <iframe id="inv-overzicht" title="Investeringen" src="portfolio.html"></iframe>
    <iframe id="inv-radar" title="Patroonradar · Investeringen" data-src="signals.html"></iframe>
    <iframe id="inv-archief" title="Archief · Investeringen" data-src="archief.html"></iframe>
    <iframe id="top-overzicht" title="Kansen portefeuille" data-src="screener.html"></iframe>
    <iframe id="top-radar" title="Patroonradar · Kansen portefeuille" data-src="signals.html?set=top250"></iframe>
    <iframe id="top-archief" title="Archief · Kansen portefeuille" data-src="archief.html?set=top250"></iframe>
  </main>
<script>
  // Twee niveaus: wereld (je eigen investeringen of de Top 250) × scherm (overzicht, radar, archief)
  const WORLDS = ['inv', 'top'], VIEWS = ['overzicht', 'radar', 'archief'];
  const HASH = {            // mooie adressen, ook de oude (#patroonradar, #archief, #top250) blijven werken
    'inv-overzicht': 'investeringen', 'inv-radar': 'patroonradar', 'inv-archief': 'archief',
    'top-overzicht': 'top250', 'top-radar': 'top250-radar', 'top-archief': 'top250-archief'
  };
  const FROM_HASH = Object.fromEntries(Object.entries(HASH).map(([k, v]) => [v, k]));
  FROM_HASH.signalen = 'inv-radar';
  const TITLE = {
    'inv-overzicht': 'Investeringen', 'inv-radar': 'Patroonradar · Investeringen', 'inv-archief': 'Archief · Investeringen',
    'top-overzicht': 'Kansen portefeuille', 'top-radar': 'Patroonradar · Kansen portefeuille', 'top-archief': 'Archief · Kansen portefeuille'
  };
  let world = 'inv', view = 'overzicht';

  function show(w, v) {
    world = WORLDS.includes(w) ? w : 'inv';
    view = VIEWS.includes(v) ? v : 'overzicht';
    const id = world + '-' + view;
    document.querySelectorAll('.seg.world button').forEach(b => {
      const on = b.dataset.world === world; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('.seg.view button').forEach(b => {
      const on = b.dataset.view === view; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('main iframe').forEach(f => {
      const on = f.id === id;
      if (on && !f.getAttribute('src') && f.dataset.src) f.src = f.dataset.src;   // pas laden bij eerste keer openen
      f.classList.toggle('active', on);
    });
    document.title = TITLE[id];
    if (location.hash !== '#' + HASH[id]) history.replaceState(null, '', '#' + HASH[id]);
    try { localStorage.setItem('active_tab', id); } catch (e) {}
  }
  function fromKey(key) {
    const id = FROM_HASH[key] || key;
    const [w, v] = String(id || '').split('-');
    return [w, v];
  }

  // Wissel je van wereld, dan blijf je op hetzelfde scherm (radar → radar)
  document.querySelectorAll('.seg.world button').forEach(b => b.addEventListener('click', () => show(b.dataset.world, view)));
  document.querySelectorAll('.seg.view button').forEach(b => b.addEventListener('click', () => show(world, b.dataset.view)));
  window.addEventListener('hashchange', () => show(...fromKey(location.hash.slice(1))));

  let start = location.hash.slice(1);
  if (!FROM_HASH[start]) { try { start = localStorage.getItem('active_tab') || ''; } catch (e) {} }
  show(...fromKey(start));
</script>
</body>
</html>
