<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investeringen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --accent: #4f8ff0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  nav.tabs {
    flex: 0 0 auto; display: flex; justify-content: center;
    padding: 12px 18px; background: var(--ink); border-bottom: 1px solid var(--line);
  }
  .seg {
    display: flex; gap: 4px; width: 100%; max-width: 1100px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  }
  .seg button {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 9px; padding: 10px 14px;
    background: transparent; color: var(--muted); transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--accent); color: #0d1117; }
  @media (max-width: 440px) { nav.tabs { padding: 10px 12px; } .seg button { flex: 1 1 auto; font-size: 12px; padding: 10px 6px; letter-spacing: -.1px; white-space: nowrap; } .seg { gap: 2px; } }
  main { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: var(--ink); display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
  <nav class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" data-tab="investeringen">Investeringen</button>
      <button role="tab" data-tab="patroonradar">Patroonradar</button>
      <button role="tab" data-tab="top250">Top 250</button>
      <button role="tab" data-tab="archief">Archief</button>
    </div>
  </nav>
  <main>
    <iframe id="investeringen" title="Investeringen" src="portfolio.html"></iframe>
    <iframe id="patroonradar" title="Patroonradar" data-src="signals.html"></iframe>
    <iframe id="top250" title="Top 250" data-src="screener.html"></iframe>
    <iframe id="archief" title="Archief" data-src="archief.html"></iframe>
  </main>
<script>
  const TABS = ['investeringen', 'patroonradar', 'top250', 'archief'];
  function show(tab) {
    if (tab === 'signalen') tab = 'patroonradar';
    if (!TABS.includes(tab)) tab = 'investeringen';
    document.querySelectorAll('.seg button').forEach(b => {
      const on = b.dataset.tab === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('main iframe').forEach(f => {
      const on = f.id === tab;
      if (on && !f.getAttribute('src') && f.dataset.src) f.src = f.dataset.src;  // laad pas bij eerste keer openen
      f.classList.toggle('active', on);
    });
    document.title = { investeringen: 'Investeringen', patroonradar: 'Patroonradar', top250: 'Top 250', archief: 'Archief' }[tab];
    if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
    try { localStorage.setItem('active_tab', tab); } catch (e) {}
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  let start = location.hash.slice(1);
  if (!TABS.includes(start)) { try { start = localStorage.getItem('active_tab'); } catch (e) {} }
  show(start);
</script>
</body>
</html>
