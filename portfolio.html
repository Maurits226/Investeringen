<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investeringen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #141517;
    --panel: #1a1c1e;
    --panel-2: #202224;
    --line: #2a2c2f;
    --muted: #83888d;
    --text: #eceef0;
    --up: #3ecf8e;
    --down: #f0595f;
    --warn: #f5b544;
    --accent: #4f8ff0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #1e2430 0%, transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 26px;
  }
  .title-block h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px;
  }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%; background: var(--up);
    box-shadow: 0 0 0 0 rgba(55,211,154,.55);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(55,211,154,.5); }
    70% { box-shadow: 0 0 0 10px rgba(55,211,154,0); }
    100% { box-shadow: 0 0 0 0 rgba(55,211,154,0); }
  }
  .title-block p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 15px;
    border-radius: 10px; font-size: 13px; font-weight: 500; transition: .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .updated { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  #interval {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 12px;
    border-radius: 10px; font-size: 13px;
  }
  #interval:hover { border-color: var(--accent); }
  .countdown { color: var(--accent); }

  .summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  }
  .stat.clickable { cursor: pointer; transition: border-color .15s, transform .15s; }
  .stat.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat.clickable:active { transform: translateY(0); }
  .stat.clickable.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-top: 8px; }
  .stat .sub { font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .markets {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .mkt {
    display: flex; flex-direction: column; gap: 4px; padding: 11px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    min-width: 0;
  }
  .mkt { cursor: pointer; transition: border-color .15s, transform .15s, opacity .15s; }
  .mkt:hover { border-color: var(--accent); transform: translateY(-2px); }
  .mkt:active { transform: translateY(0); }
  .mkt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mkt.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .markets.filtering .mkt:not(.active) { opacity: .5; }
  .markets.filtering .mkt:not(.active):hover { opacity: 1; }
  .mkt-top { display: flex; align-items: center; gap: 8px; }
  .mkt-hours { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .mkt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mkt.open .mkt-dot { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .mkt.closed .mkt-dot { background: var(--down); }
  .mkt-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .mkt-state { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .mkt.open .mkt-state b { color: var(--up); font-weight: 600; }
  .mkt.closed .mkt-state b { color: var(--down); font-weight: 600; }
  .mkt-count { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .mkt-foot {
    font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--line);
  }
  .mkt-city { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .exch-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 8px; vertical-align: middle; position: relative; top: -2px;
    background: var(--line);
  }
  .exch-dot.open { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .exch-dot.closed { background: var(--down); }
  /* Filterbalk: vier filters in gelijke kolommen, daaronder reset + teller */
  .toolbar {
    display: grid; grid-template-columns: 1.4fr 1.2fr 1.1fr 1fr; gap: 14px;
    margin-bottom: 20px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .tb-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .tb-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .toolbar select {
    font-family: inherit; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    height: 38px; padding: 0 11px; border-radius: 9px; font-size: 13px; width: 100%; min-width: 0; cursor: pointer;
  }
  .toolbar select:hover { border-color: var(--accent); outline: none; }
  /* Portefeuillecheck */
  .pcheck { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; transition: border-color .15s; }
  .pcheck:hover, .pcheck[open] { border-color: rgba(79,143,240,.5); }
  .pcheck > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 13.5px; }
  .pcheck > summary::-webkit-details-marker { display: none; }
  .pcheck .h-sub { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .pcheck .h-sub b { color: var(--warn); font-weight: 600; }
  .pcheck .h-btn { margin-left: auto; font-size: 11px; color: var(--accent); border: 1px solid rgba(79,143,240,.45); padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
  .pcheck .h-btn::after { content: ' ▾'; } .pcheck[open] .h-btn::after { content: ' ▴'; }
  .pcheck .h-less { display: none; } .pcheck[open] .h-more { display: none; } .pcheck[open] .h-less { display: inline; }
  .pc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 2px 14px 14px; }
  .pc { position: relative; overflow: hidden; border-radius: 12px; padding: 13px 15px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); --mark: var(--accent); }
  .pc::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--mark); }
  .pc.warn { --mark: var(--warn); } .pc.ok { --mark: var(--up); } .pc.violet { --mark: #a78bfa; }
  .pc-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .pc-k span { text-transform: none; letter-spacing: 0; font-family: 'IBM Plex Mono', monospace; }
  .pc-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed #26282b; }
  .pc-row:last-child { border-bottom: 0; }
  .pc-row small { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .pc-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .pc-score { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .pc-mini { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 6px; }
  .pc-mini i { width: 6px; height: 12px; border-radius: 1px; background: var(--panel); position: relative; overflow: hidden; display: inline-block; }
  .pc-mini i b { position: absolute; left: 0; right: 0; bottom: 0; }
  .trend-tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .switch input { display: none; }
  .switch i { width: 30px; height: 17px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); position: relative; }
  .switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
  .switch input:checked + i { background: rgba(79,143,240,.25); border-color: rgba(79,143,240,.6); }
  .switch input:checked + i::after { left: 15px; background: var(--accent); }
  @media (max-width: 760px) { .pc-grid { grid-template-columns: 1fr; } }
  .tb-row2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tb-count { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-left: auto; white-space: nowrap; }
  .tb-reset {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    height: 38px; padding: 0 14px; border-radius: 9px; font-size: 13px; white-space: nowrap;
  }
  .tb-reset:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 640px) { .toolbar { grid-template-columns: 1fr 1fr; gap: 10px 12px; } }
  .sync-btn {
    font-family: inherit; cursor: pointer; font-weight: 500; font-size: 13px;
    padding: 9px 15px; border-radius: 10px; transition: .15s;
    color: var(--down); background: rgba(255,93,108,.12); border: 1px solid rgba(255,93,108,.45);
  }
  .sync-btn:hover { filter: brightness(1.15); }
  .sync-btn.synced {
    color: var(--up); background: rgba(62,207,142,.12); border-color: rgba(62,207,142,.45);
  }
  .sync-btn.error { color: var(--down); background: rgba(255,93,108,.18); border-color: rgba(255,93,108,.6); }
  .sync-btn.syncing { color: var(--warn); background: rgba(245,181,68,.12); border-color: rgba(245,181,68,.45); }
  .section-header {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
    margin-top: 18px; margin-bottom: 2px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    scroll-margin-top: 16px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-header::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent);
  }

  .position {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1.6fr 1.3fr auto; gap: 18px; align-items: center;
    position: relative; overflow: hidden; transition: .2s;
  }
  .position::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line);
  }
  .position.alert::before { background: var(--down); }
  .position.alert {
    border-color: rgba(255,93,108,.5);
    box-shadow: 0 0 0 1px rgba(255,93,108,.25), 0 8px 30px -12px rgba(255,93,108,.4);
  }
  .position.sell-alert::before { background: var(--up); }
  .position.sell-alert {
    border-color: rgba(62,207,142,.5);
    box-shadow: 0 0 0 1px rgba(62,207,142,.25), 0 8px 30px -12px rgba(62,207,142,.4);
  }

  .p-name { display: flex; flex-direction: column; gap: 4px; }
  .p-ticker { font-size: 19px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; }
  .p-company { font-size: 12px; color: var(--muted); max-width: 200px; }
  .src { font-size: 10px; font-weight: 600; margin-left: 4px; white-space: nowrap; display: inline-block; }
  .src-live { color: var(--up); }
  .src-proxy { color: var(--warn); }

  .p-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .p-block .v { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-top: 4px; }
  .v.up { color: var(--up); } .v.down { color: var(--down); }

  .bar-wrap { display: flex; flex-direction: column; gap: 7px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 6px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--down), var(--warn), var(--up)); }
  .bar-marker { position: absolute; top: -3px; width: 3px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }
  .day-chg { font-size: 12px; font-family: 'IBM Plex Mono', monospace; margin-top: 3px; }
  .day-chg.up { color: var(--up); }
  .day-chg.down { color: var(--down); }
  .drop-tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }

  .p-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.buy { background: rgba(255,93,108,.15); color: var(--down); border: 1px solid rgba(255,93,108,.4); }
  .badge.sell { background: rgba(62,207,142,.15); color: var(--up); border: 1px solid rgba(62,207,142,.4); }
  .badge.hold { background: rgba(134,149,179,.12); color: var(--muted); border: 1px solid var(--line); }
  .remove { background: none; border: none; color: var(--muted); font-size: 12px; padding: 2px; cursor: pointer; }
  .remove:hover { color: var(--down); }
  .edit-cost { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .edit-cost:hover { border-color: var(--accent); color: var(--text); }

  .profit-block { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  .profit-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .sells { display: flex; flex-direction: column; gap: 3px; }
  .sell-row { font-size: 11px; color: var(--up); font-family: 'IBM Plex Mono', monospace; display: flex; align-items: center; gap: 4px; }
  .sell-row.reopened { color: var(--warn); }
  .sell-date { color: var(--muted); margin-left: 2px; }
  .undo-sell { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 0 2px; margin-left: auto; opacity: .5; }
  .undo-sell:hover { color: var(--down); opacity: 1; }
  .next-target { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .realise {
    background: rgba(55,211,154,.15); border: 1px solid rgba(55,211,154,.45); color: var(--up);
    font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    text-align: left; line-height: 1.3;
  }
  .realise:hover { background: rgba(55,211,154,.28); }

  .state { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .err { color: var(--warn); }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(4,8,18,.7); }
  dialog h3 { margin-bottom: 16px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--ink); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }

  @media (max-width: 860px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .position { grid-template-columns: 1fr 1fr; }
    .p-actions { grid-column: span 2; flex-direction: row; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .bar-wrap { grid-column: span 2; }
    .profit-block { grid-column: span 2; }
  }
  @media (max-width: 520px) {
    .markets { grid-template-columns: repeat(2, 1fr); }
    .mkt-top { flex-wrap: wrap; }
    body { padding: 18px 12px 40px; }
    header.top { flex-direction: column; align-items: stretch; }
    .controls { justify-content: space-between; }
    .summary { gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
    .position { grid-template-columns: 1fr 1fr; padding: 16px; gap: 14px; }
    .p-name { grid-column: span 2; }
    .p-ticker { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1><span class="pulse"></span>Investeringen</h1>
      <p>Live koersen via Yahoo Finance</p>
    </div>
    <div class="controls">
      <span class="updated" id="updated">laden…</span>
      <button id="syncBtn" class="sync-btn" title="Synchronisatie met GitHub instellen">⟳ Sync</button>
      <button class="primary" id="add">+ Positie</button>
    </div>
  </header>

  <div class="markets" id="markets"></div>

  <details class="pcheck" id="pcheck" hidden>
    <summary>🩺 Portefeuillecheck <span class="h-sub" id="pcSub"></span>
      <span class="h-btn"><span class="h-more">tonen</span><span class="h-less">verbergen</span></span></summary>
    <div class="pc-grid" id="pcGrid"></div>
  </details>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">Sorteer</span>
      <select id="sortSel">
        <option value="section">Categorie (standaard)</option>
        <option value="result">Resultaat (hoog → laag)</option>
        <option value="signal">Dichtst bij koopsignaal</option>
        <option value="sellsignal">Dichtst bij verkoopsignaal</option>
        <option value="name">Naam (A → Z)</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Categorie</span>
      <select id="catSel">
        <option value="all">Alle</option>
        <option value="Watchlist">Watchlist</option>
        <option value="Stocks">Stocks</option>
        <option value="ETF's">ETF's</option>
        <option value="Gold & Silver">Edelmetalen</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Beurs</span>
      <select id="mktSel">
        <option value="all">Alle</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Status</span>
      <select id="statusSel">
        <option value="all">Alle</option>
        <option value="signals">Koopsignalen</option>
        <option value="open">Openstaande verkoop</option>
      </select>
    </div>
    <div class="tb-row2">
      <label class="switch" title="Koopdrempel afgestemd op de beweeglijkheid van elk aandeel (halve jaarbeweeglijkheid, tussen 8% en 35%). Uit = je vaste drempel."><input type="checkbox" id="smartChk"><i></i>Slimme koopdrempel</label>
      <button id="resetFilters" class="tb-reset">Reset filters</button>
      <span class="tb-count" id="tbCount"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>

</div>

<dialog id="dlg">
  <h3>Positie toevoegen</h3>
  <div class="field">
    <label>Ticker (Yahoo-symbool — beurs bepaalt de valuta)</label>
    <input id="f-ticker" placeholder="1YD.DE" autocomplete="off">
    <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">
      Xetra = <code style="background:var(--panel-2);padding:1px 4px;border-radius:3px">.DE</code> (EUR) ·
      Amsterdam = <code style="background:var(--panel-2);padding:1px 4px;border-radius:3px">.AS</code> ·
      NASDAQ = geen achtervoegsel (USD)
    </div>
  </div>

// Volgorde waarin de secties getoond worden
const SECTION_ORDER = ['Watchlist', 'Stocks', "ETF's", 'Gold & Silver'];

// Verhoog dit nummer wanneer de standaardlijst wijzigt; dan wordt de lijst zelf
// opnieuw ingeladen. Je gerealiseerde verkopen en aangepaste aankoopprijzen
// (opgeslagen onder 'portfolio_state') blijven daarbij behouden.
const DEFAULT_VERSION = 35;

// Geef elke DEFAULT-positie een stabiel id (sectie + ticker), zodat we per
// positie de verkoop-historie en prijsaanpassingen kunnen bewaren.
function posId(p) { return (p.section || 'X') + '|' + p.ticker; }

// Gebruikersstate per positie-id: { cost, sells: [{level, pct, date}] }
// Wordt lokaal bewaard (localStorage) EN, als een token is ingevoerd,
// gesynchroniseerd met state.json in de GitHub-repository zodat het op
// elk apparaat gelijk is.
const GH_OWNER = 'Maurits226';
const GH_REPO = 'Investeringen';
const GH_BRANCH = 'main';
const GH_STATE_FILE = 'state.json';

function getToken() {
  try { return localStorage.getItem('gh_token') || ''; } catch (e) { return ''; }
}
function setToken(t) {
  try {
    if (t) localStorage.setItem('gh_token', t);
    else localStorage.removeItem('gh_token');
  } catch (e) {}
}

function loadStateLocal() {
  try {
    const s = localStorage.getItem('portfolio_state');
    if (s) return JSON.parse(s);
  } catch (e) {}
  return {};
}
function saveStateLocal() {
  try { localStorage.setItem('portfolio_state', JSON.stringify(userState)); } catch (e) {}
}
function applyState(p) {
  const st = userState[posId(p)];
  if (st && st.cost != null) p.cost = st.cost;
  if (st && st.qty != null) p.qty = st.qty;
}
// Samenvoegen: GitHub is leidend, maar lokaal bekende aankoopprijzen vullen ontbrekende aan
function mergeState(remote, local) {
  const out = {};
  new Set([...Object.keys(remote || {}), ...Object.keys(local || {})]).forEach(id => {
    const r = (remote || {})[id], l = (local || {})[id];
    if (!r) { out[id] = l; return; }
    if (!l || typeof r !== 'object') { out[id] = r; return; }
    out[id] = { ...l, ...r };
    if (r.cost == null && l.cost != null) out[id].cost = l.cost;
    if (r.qty == null && l.qty != null) out[id].qty = l.qty;
    if (!(r.sells && r.sells.length) && l.sells && l.sells.length) out[id].sells = l.sells;
  });
  return out;
}

let userState = loadStateLocal();
let stateSha = null;          // sha van state.json op GitHub (nodig om te schrijven)
let stateLocked = false;      // false | 'geen-token' | 'verkeerde-token'
let syncStatus = 'local';     // 'local' | 'synced' | 'error' | 'syncing'

// Lees state.json van GitHub (werkt ook zonder token, want repo is public)
async function loadStateFromGitHub() {
  try {
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_STATE_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`;
    const headers = { 'Accept': 'application/vnd.github+json' };
    const token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(url, { headers });
    if (r.status === 404) { stateSha = null; return null; } // bestaat nog niet
    if (!r.ok) throw new Error('kon state niet laden');
    const j = await r.json();
    stateSha = j.sha;
    // base64 -> UTF-8 tekst (robuust met €, accenten)
    const parsed = JSON.parse(Vault.b64ToText(j.content));
    stateLocked = false;
    if (Vault.isLocked(parsed)) {
      if (!token) { stateLocked = 'geen-token'; return null; }
      try { return await Vault.unlock(parsed, token); }
      catch (e) { stateLocked = 'verkeerde-token'; return null; }   // token vervangen op een ander apparaat?
    }
    return parsed;                                                  // oude, nog niet versleutelde versie
  } catch (e) {
    return null;
  }
}

// Alleen de sha ophalen (nodig om te schrijven), zonder te ontsleutelen
async function refreshStateSha() {
  const token = getToken();
  const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_STATE_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
    { headers: Object.assign({ Accept: 'application/vnd.github+json' }, token ? { Authorization: 'Bearer ' + token } : {}) });
  stateSha = r.status === 404 ? null : (r.ok ? (await r.json()).sha : stateSha);
}

// Schrijf userState versleuteld naar GitHub (vereist token).
// force = bewust opnieuw versleutelen met een nieuwe token (de gegevens in het geheugen zijn dan al ontsleuteld).
async function saveStateToGitHub(force = false) {
  const token = getToken();
  if (!token) return false;
  try {
    syncStatus = 'syncing'; updateSyncBadge();
    // Eerst de laatste sha ophalen (kan gewijzigd zijn op een ander apparaat)
    await refreshStateSha();
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_STATE_FILE}`;
    // Niet overschrijven als we de versie op GitHub niet konden openen (dan zou je gegevens van een ander apparaat wissen)
    if (stateLocked === 'verkeerde-token' && !force) throw new Error('state.json is versleuteld met een andere token');
    // Versleutelen met de token, daarna als tekst naar GitHub
    const locked = await Vault.lock(userState, token);
    const body = {
      message: 'Update portfolio state (versleuteld) ' + new Date().toISOString(),
      content: Vault.textToB64(JSON.stringify(locked, null, 2)),
      branch: GH_BRANCH
    };
    if (stateSha) body.sha = stateSha;
    const r = await fetch(url, {
      method: 'PUT',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('schrijven mislukt (' + r.status + ')');
    const j = await r.json();
    stateSha = j.content.sha;
    syncStatus = 'synced'; updateSyncBadge();
    return true;
  } catch (e) {
    syncStatus = 'error'; updateSyncBadge();
    return false;
  }
}

// Sla op: altijd lokaal, en naar GitHub als er een token is
function saveState() {
  saveStateLocal();
  if (getToken()) saveStateToGitHub();
}

// Eenmalige migratie: aankoopprijzen die nog in de oude lokale lijst staan, gaan naar de state
// (die versleuteld naar GitHub gaat), zodat ze niet verloren gaan nu ze uit de openbare lijst zijn.
let migrated = false;
function migrateCosts(list) {
  (list || []).forEach(p => {
    if (!p || p.cost == null) return;
    const id = posId(p);
    const st = userState[id] || (userState[id] = {});
    if (st.cost == null) { st.cost = p.cost; migrated = true; }
    if (p.qty != null && st.qty == null && p.qty !== 1) { st.qty = p.qty; migrated = true; }
  });
  if (migrated) saveStateLocal();
}

function loadPositions() {
  let base;
  try {
    const savedVer = parseInt(localStorage.getItem('portfolio_version') || '0');
    const saved = localStorage.getItem('portfolio_positions');
    if (saved) migrateCosts(JSON.parse(saved));
    if (saved && savedVer >= DEFAULT_VERSION) {
      base = JSON.parse(saved);
    }
  } catch (e) {}
  if (!base) {
    base = DEFAULT.map(p => ({ ...p }));
    try {
      localStorage.setItem('portfolio_positions', JSON.stringify(base));
      localStorage.setItem('portfolio_version', String(DEFAULT_VERSION));
    } catch (e) {}
  }
  // Pas de (versleuteld bewaarde) aankoopprijzen en aantallen toe
  base.forEach(p => applyState(p));
  return base;
}
function savePositions() {
  try {
    localStorage.setItem('portfolio_positions', JSON.stringify(positions));
    localStorage.setItem('portfolio_version', String(DEFAULT_VERSION));
  } catch (e) {}
}

let positions = loadPositions();

// Winst-cyclus: elke +50% een trede. Trede 1,4,7.. = 10%, trede 2,5,8.. = 20%,
// trede 3,6,9.. = 30% van de winst verkopen.
function sellPctForStep(step) {
  const mod = ((step - 1) % 3);
  return mod === 0 ? 10 : (mod === 1 ? 20 : 30);
}
// Hoeveel treden zijn bereikt bij een bepaald winstpercentage (elke 50%)
function stepsReached(plPct) {
  if (plPct < 50) return 0;
  return Math.floor(plPct / 50);
}

// Slimme koopdrempel: halve jaarbeweeglijkheid, tussen 8% en 35% (een wild aandeel krijgt meer ruimte dan een rustig)
function smartOn() { try { return localStorage.getItem('buy_mode') !== 'vast'; } catch (e) { return true; } }
function thresholdFor(p, q) {
  if (smartOn() && q && q.vol) return Math.round(Math.max(8, Math.min(35, q.vol * 0.5)));
  return p.thresh;
}

// Kerngetallen per positie, gebruikt voor sorteren en filteren
function metrics(p, q) {
  if (!q) return { plPct: -Infinity, drop: -Infinity, alert: false, openSell: false };
  const isWatch = p.watch || p.cost == null;
  const plPct = isWatch ? 0 : ((q.price - p.cost) / p.cost) * 100;
  const drop = q.high52 ? ((q.high52 - q.price) / q.high52) * 100 : 0;
  const alert = drop >= thresholdFor(p, q);
  // Openstaande verkoop? (winsttrede bereikt en nog niet/again te realiseren)
  let openSell = false;
  if (!isWatch) {
    const st = userState[posId(p)] || {};
    const sells = st.sells || [];
    const reached = stepsReached(plPct);
    const maxDone = sells.length ? Math.max(...sells.map(s => s.level)) : 0;
    // heropend?
    let heropend = false;
    for (let step = 1; step <= maxDone; step++) {
      const opStap = sells.filter(s => s.level === step);
      const v = opStap.length ? opStap[opStap.length - 1] : null;
      if (v && v.price != null && step <= reached && q.price <= v.price * 0.75) { heropend = true; break; }
    }
    openSell = heropend || (reached >= maxDone + 1);
  }
  // Afstand tot volgende winsttrede (voor 'dichtst bij verkoopsignaal').
  // 0 = precies op een trede of eroverheen (verkoopsignaal actief).
  let toSell = Infinity;
  if (!isWatch && q) {
    if (openSell) {
      toSell = 0;
    } else {
      // volgende trede die nog niet is afgevinkt
      const st = userState[posId(p)] || {};
      const sells = st.sells || [];
      const maxDone = sells.length ? Math.max(...sells.map(s => s.level)) : 0;
      const nextTargetPct = (maxDone + 1) * 50;
      toSell = nextTargetPct - plPct;   // hoeveel % winst nog te gaan
    }
  }
  return { plPct, drop, alert, openSell, toSell };
}

const fmt = (n, cur) => new Intl.NumberFormat('nl-NL', {
  style: 'currency', currency: cur || 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2
}).format(n);
const pct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';

// De data komt uit data.json, dat GitHub Actions elke 15 min bijwerkt.
// Geen CORS, geen proxy — het dashboard leest gewoon zijn eigen bestand.
let dataCache = null;
let dataUpdated = null;

// ---- Portefeuillecheck: ETF-doorkijk, kwaliteit (Score 2.0), trend, kwartaalcijfers, branches ----
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let extra = { refs: [], etf: null, sig: null, at: 0 };
async function loadExtra() {
  if (Date.now() - extra.at < 15 * 60 * 1000) return;
  const get = async u => { try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [scr, etf, sig] = await Promise.all([get('screener.json'), get('etf_holdings.json'), get('signals.json')]);
  extra = { refs: (scr && scr.refs) || [], branches: (scr && scr.branches) || {}, weights: scr && scr.weights,
            etf: etf && etf.etfs, sig, at: Date.now() };
}
const normName = n => String(n || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ')
  .split(/\s+/).filter(w => w && !['inc', 'corp', 'corporation', 'co', 'plc', 'nv', 'se', 'sa', 'ag', 'holdings', 'holding', 'group', 'class', 'the', 'ltd', 'a', 'com'].includes(w)).slice(0, 2).join(' ');
function renderCheck() {
  const box = document.getElementById('pcheck');
  if (!box) return;
  const sig = extra.sig || {};
  const usOf = {};                                   // euro-ticker -> Amerikaanse ticker (uit de Patroonradar)
  (sig.items || []).concat(sig.errors || []).forEach(i => { if (i.pattern_symbol) usOf[i.symbol.toUpperCase()] = i.pattern_symbol.toUpperCase(); });
  const earnOf = {};
  (sig.items || []).forEach(i => { const e = i.context && i.context.earnings; if (e && e.days != null) earnOf[i.symbol.toUpperCase()] = e; });
  const stocks = positions.filter(p => !p.watch && p.cost != null && p.section === 'Stocks');
  const etfs = positions.filter(p => !p.watch && p.section === "ETF's");
  const refOf = p => {
    const t = p.ticker.toUpperCase(), us = usOf[t];
    return extra.refs.find(r => (r.eu || '').toUpperCase() === t || r.sym === t || (us && r.sym === us));
  };
  const qn = p => { const q = getQuote(p.ticker); return q ? q.name : p.ticker; };
  const cards = [];
  let issues = 0;

  // 1. ETF-doorkijk
  if (extra.etf) {
    const rows = [];
    etfs.forEach(e => {
      const d = extra.etf[e.ticker.toUpperCase()];
      if (!d) return;
      const hits = d.holdings.filter(h => stocks.some(p => {
        const us = usOf[p.ticker.toUpperCase()];
        return (us && us === h.sym) || normName(qn(p)) === normName(h.name);
      }));
      if (hits.length) {
        issues++;
        const short = n => String(n || '').replace(/\b(Corporation|Corp\.?|Inc\.?|Incorporated|Holdings?|plc|N\.V\.|SE|AG|Class [A-C]|Common Stock|Ltd\.?)\b/gi, '').replace(/[,.]+\s*$/, '').replace(/\s+/g, ' ').trim();
        rows.push(`<div class="pc-row"><span><b>${e.ticker.split('.')[0]}</b> bevat ook ${hits.map(h => `${esc(short(h.name))} <small>${h.w.toFixed(1).replace('.', ',')}%</small>`).join(', ')}</span></div>`);
      }
    });
    cards.push(`<div class="pc ${rows.length ? 'warn' : 'ok'}"><div class="pc-k">ETF-doorkijk <span>${rows.length ? 'dubbele blootstelling' : 'geen overlap'}</span></div>
      ${rows.join('') || '<div class="pc-note">Je ETF\'s bevatten geen van je losse aandelen in hun grootste posities.</div>'}
      <div class="pc-note">Grootste posities van je ETF's${Object.values(extra.etf).some(d => d.proxy) ? ' (deels via een tegenhanger met dezelfde index)' : ''}. Zit een bedrijf zowel los als via een ETF in je portefeuille, dan weegt het zwaarder dan je denkt.</div></div>`);
  }

  // 2. Kwaliteit van je posities (scorecard, 0-125)
  const cardOf = r => (r.card && r.card.s != null) ? r.card.s : null;
  const scored = stocks.map(p => ({ p, r: refOf(p) })).filter(x => x.r && cardOf(x.r) != null).sort((a, b) => cardOf(a.r) - cardOf(b.r));
  if (scored.length) {
    const weak = scored.filter(x => cardOf(x.r) < 75);
    issues += weak.length;
    const col = v => v == null ? 'var(--line)' : v >= 75 ? 'var(--up)' : v >= 50 ? 'var(--accent)' : v >= 30 ? 'var(--warn)' : 'var(--down)';
    const mini = pl => ['F', 'Q', 'G', 'V', 'M'].map(k => `<i><b style="height:${(pl || {})[k] || 0}%;background:${col((pl || {})[k])}"></b></i>`).join('');
    cards.push(`<div class="pc ${weak.length ? 'warn' : 'ok'}"><div class="pc-k">Kwaliteit van je posities <span>${scored.length} gescoord</span></div>
      ${scored.slice(0, 8).map(x => { const c = cardOf(x.r); return `<div class="pc-row"><span>${esc(x.r.name)}</span><span><span class="pc-score" title="Scorecard ${Math.round(c)} van 125 · marktrang P${Math.round(x.r.score)}" style="color:${c >= 100 ? 'var(--up)' : c >= 75 ? 'var(--warn)' : 'var(--down)'}">${Math.round(c)}<small style="color:var(--muted);font-weight:400">/125</small></span><span class="pc-mini" title="Marktrang: Formuleblad · Kwaliteit · Groei · Waardering · Momentum">${mini(x.r.pillars)}</span></span></div>`; }).join('')}
      <div class="pc-note">Zelfde scorecard als bij Kansen portefeuille: 100+ once-in-a-lifetime, 75–100 watchlist, onder 75 afvallen. Zwakste eerst${weak.length ? `; <b style="color:var(--warn)">${weak.length} onder de 75</b>` : ''}.</div></div>`);
  }

  // 3. Trend
  const below = stocks.filter(p => { const q = getQuote(p.ticker); return q && q.sma200 && q.price < q.sma200; });
  issues += below.length;
  cards.push(`<div class="pc ${below.length ? 'warn' : 'ok'}"><div class="pc-k">Trend <span>${stocks.length - below.length} van ${stocks.length} boven 200-daags gem.</span></div>
    ${below.map(p => ({ p, q: getQuote(p.ticker) })).sort((a, b) => a.q.price / a.q.sma200 - b.q.price / b.q.sma200).slice(0, 8)
        .map(({ q }) => `<div class="pc-row"><span>${esc(q.name)}</span><small>${((q.price / q.sma200 - 1) * 100).toFixed(1).replace('.', ',')}% onder</small></div>`).join('')
      || '<div class="pc-note">Al je aandelen zitten in een stijgende trend.</div>'}
    ${below.length > 8 ? `<div class="pc-note">en nog ${below.length - 8} andere.</div>` : ''}
    <div class="pc-note">Onder het 200-daags gemiddelde = dalende trend. Een koopsignaal daar is riskanter (vallend mes).</div></div>`);

  // 4. Kwartaalcijfers binnenkort
  const soon = stocks.map(p => ({ p, e: earnOf[p.ticker.toUpperCase()] || ((refOf(p) || {}).earn_days != null ? { days: refOf(p).earn_days, date: refOf(p).earnings } : null) }))
    .filter(x => x.e && x.e.days >= 0 && x.e.days <= 14).sort((a, b) => a.e.days - b.e.days);
  issues += soon.length;
  cards.push(`<div class="pc ${soon.length ? 'warn' : 'ok'}"><div class="pc-k">Kwartaalcijfers <span>komende 14 dagen</span></div>
    ${soon.map(x => `<div class="pc-row"><span>${esc(qn(x.p))}</span><small>${x.e.days === 0 ? 'vandaag' : 'over ' + x.e.days + ' dagen'}${x.e.date ? ' · ' + new Date(x.e.date).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : ''}</small></div>`).join('')
      || '<div class="pc-note">Geen cijfers binnen twee weken.</div>'}
    <div class="pc-note">Rond cijfers kan de koers hard springen; liever niet vlak ervoor kopen.</div></div>`);

  // 5. Branchespreiding
  const labels = { tech: 'Technologie', fin: 'Financieel', zorg: 'Gezondheidszorg', energie: 'Energie & energietransitie' };
  const cnt = {};
  stocks.forEach(p => { const r = refOf(p); const k = (r && r.branch) ? labels[r.branch] : 'Overig / onbekend'; cnt[k] = (cnt[k] || 0) + 1; });
  if (etfs.length) cnt["ETF's"] = etfs.length;
  const tot = Object.values(cnt).reduce((a, b) => a + b, 0) || 1;
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const named = top.filter(([k]) => k !== "ETF's" && k !== 'Overig / onbekend');
  const heavy = named.length && named[0][1] / tot > 0.5;
  if (heavy) issues++;
  cards.push(`<div class="pc violet"><div class="pc-k">Branchespreiding <span>${tot} posities</span></div>
    ${top.map(([k, v]) => `<div class="pc-row"><span>${esc(k)}</span><small>${v} · ${Math.round(v / tot * 100)}%</small></div>`).join('')}
    <div class="pc-note">${heavy ? `<b style="color:var(--warn)">Meer dan de helft zit in ${esc(named[0][0].toLowerCase())}.</b> ` : ''}Telt het aantal posities, niet de waarde (aantallen staan nu op 1).</div></div>`);

  document.getElementById('pcGrid').innerHTML = cards.join('');
  document.getElementById('pcSub').innerHTML = issues ? `<b>${issues} ${issues === 1 ? 'aandachtspunt' : 'aandachtspunten'}</b> · ETF-doorkijk · kwaliteit · trend · cijfers · spreiding` : 'alles op orde · ETF-doorkijk · kwaliteit · trend · cijfers · spreiding';
  box.hidden = false;
}

async function loadData() {
  // cache-buster zodat de browser niet een oude versie vasthoudt
  const r = await fetch('data.json?t=' + Date.now());
  if (!r.ok) throw new Error('data.json niet gevonden');
  const j = await r.json();
  dataCache = j.quotes || {};
  dataUpdated = j.updated || null;
}

function getQuote(ticker) {
  const q = dataCache && dataCache[ticker.toUpperCase()];
  if (!q || q.price == null) return null;
  return {
    price: q.price,
    prevClose: q.prevClose,
    currency: q.currency || 'USD',
    name: q.name || ticker,
    high52: q.high52,
    low52: q.low52,
    vol: q.vol, sma50: q.sma50, sma200: q.sma200,
    source: 'github'
  };
}

function positionCard(p, q, err) {
  const el = document.createElement('div');
  el.className = 'position';
  if (err || !q) {
    el.innerHTML = `
      <div class="p-name"><span class="p-ticker">${p.ticker}</span>
        <span class="p-company err">Koers niet geladen — bronnen geblokkeerd</span></div>
      <div style="grid-column: span 3; font-size:12px; color:var(--muted); line-height:1.5">
        Nog geen data voor deze ticker. Staat hij in <code>tickers.txt</code>? Draai anders
        de GitHub Action één keer handmatig (tab <strong>Actions</strong> → <strong>Run workflow</strong>)
        en ververs daarna.
      </div>
      <div class="p-actions"><button class="remove" data-t="${p.ticker}">verwijder</button></div>`;
    el.querySelector('.remove').onclick = () => removePosition(p.ticker);
    return el;
  }

  const cur = p.cur === 'native' ? q.currency : p.cur;
  const dayChg = q.prevClose ? ((q.price - q.prevClose) / q.prevClose) * 100 : 0;
  const fromHigh = ((q.price - q.high52) / q.high52) * 100; // negatief = onder top
  const dropFromHigh = -fromHigh;
  const isWatch = p.watch || p.cost == null;
  const plPct = isWatch ? 0 : ((q.price - p.cost) / p.cost) * 100;
  const plAbs = isWatch ? 0 : (q.price - p.cost) * (p.qty || 1);
  const thr = thresholdFor(p, q);
  const alert = dropFromHigh >= thr;
  const trendUp = q.sma200 ? q.price > q.sma200 : null;
  const rangePos = Math.max(0, Math.min(100, ((q.price - q.low52) / (q.high52 - q.low52)) * 100));

  if (alert) {
    el.classList.add('alert');
  } else if (!isWatch) {
    const m = metrics(p, q);
    if (m.openSell) el.classList.add('sell-alert');
  }

  const id = posId(p);
  const st = userState[id] || {};
  const sells = st.sells || [];

  const resultBlock = isWatch
    ? `<div class="p-block">
         <div class="k">Op watchlist</div>
         <div class="v" style="color:var(--muted)">volgen</div>
         <div class="drop-tag" style="color:var(--muted)">geen positie</div>
       </div>`
    : `<div class="p-block">
         <div class="k">Resultaat (koop ${fmt(p.cost, cur)})</div>
         <div class="v ${plPct >= 0 ? 'up' : 'down'}">${pct(plPct)}</div>
       </div>`;

  // Winstniveau-blok (niet voor watchlist)
  let profitBlock = '';
  if (!isWatch) {
    const reached = stepsReached(plPct);   // hoogste bereikte trede op basis van huidige winst

    // Voor elke trede: is hij al gerealiseerd en nog "geldig"?
    // Een verkoop op een trede vervalt (trede weer beschikbaar) zodra de koers
    // 25% of meer onder de verkoopkoers van die verkoop is gezakt (optie B),
    // MAAR alleen zolang je nog boven dat winstniveau zit.
    const REOPEN_DROP = 0.25;
    function laatsteVerkoop(step) {
      const opStap = sells.filter(s => s.level === step);
      return opStap.length ? opStap[opStap.length - 1] : null;
    }
    // Is een reeds afgevinkte trede vervallen (dus opnieuw te realiseren)?
    function tredeVervallen(step) {
      const v = laatsteVerkoop(step);
      if (!v || v.price == null) return false;
      if (step > reached) return false;           // je zit niet meer op dit winstniveau
      return q.price <= v.price * (1 - REOPEN_DROP);
    }

    const maxDone = sells.length ? Math.max(...sells.map(s => s.level)) : 0;

    // Zoek de laagste AFGEVINKTE trede die is vervallen (heropend)
    let openStep = null;
    for (let step = 1; step <= maxDone; step++) {
      if (laatsteVerkoop(step) && tredeVervallen(step)) { openStep = step; break; }
    }
    // Geen heropende trede? Dan is de eerstvolgende trede maxDone+1,
    // en die is realiseerbaar zodra hij bereikt is.
    const isHeropend = openStep != null;
    const nextStep = isHeropend ? openStep : (maxDone + 1);
    const nextTargetPct = nextStep * 50;
    const nextSellPct = sellPctForStep(nextStep);
    const canRealise = isHeropend || (reached >= nextStep);

    // Lijst van gerealiseerde verkopen
    let sellsHtml = '';
    if (sells.length) {
      sellsHtml = '<div class="sells">' + sells
        .map((s, i) => ({ s, i }))
        .sort((a,b)=>a.s.level-b.s.level)
        .map(({ s, i }) => {
          const heropend = laatsteVerkoop(s.level) === s && tredeVervallen(s.level);
          const cls = heropend ? 'sell-row reopened' : 'sell-row';
          const mark = heropend ? '↻' : '✓';
          return `<div class="${cls}">${mark} +${s.level*50}% → ${s.pct}% verkocht <span class="sell-date">${s.date}</span> <button class="undo-sell" data-id="${id}" data-idx="${i}" title="verwijder deze registratie">✕</button></div>`;
        })
        .join('') + '</div>';
    }

    const btnHtml = canRealise
      ? `<button class="realise" data-id="${id}" data-step="${nextStep}" data-pct="${nextSellPct}">
           ${isHeropend ? 'Opnieuw realiseren' : 'Realiseer'} +${nextTargetPct}% (verkoop ${nextSellPct}%)
         </button>`
      : `<div class="next-target">Volgende: +${nextTargetPct}% → ${nextSellPct}% verkopen</div>`;

    profitBlock = `
      <div class="profit-block">
        <div class="k">Winst nemen</div>
        ${sellsHtml}
        ${btnHtml}
      </div>`;
  }

  el.innerHTML = `
    <div class="p-name">
      <span class="p-ticker"><span class="exch-dot" data-exch="${exchangeKeyOf(p.ticker) || ''}"></span>${p.label || q.name}</span>
      <span class="p-company">(${p.ticker})${(() => { const k = exchangeKeyOf(p.ticker); return k && EXCHANGES[k] ? ' · ' + EXCHANGES[k].name : ''; })()} <span class="src src-live">● data</span></span>
    </div>
    <div class="p-block">
      <div class="k">Huidige koers</div>
      <div class="v ${q.prevClose ? (dayChg >= 0 ? 'up' : 'down') : ''}">${fmt(q.price, cur)}</div>
      ${q.prevClose ? `<div class="day-chg ${dayChg >= 0 ? 'up' : 'down'}">${dayChg >= 0 ? '+' : ''}${dayChg.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}% vandaag</div>` : ''}
    </div>
    ${resultBlock}
    <div class="bar-wrap">
      <div class="bar-labels"><span>${fmt(q.low52, cur)}</span><span>52-wk range</span><span>${fmt(q.high52, cur)}</span></div>
      <div class="bar">
        <div class="bar-fill" style="width:100%"></div>
        <div class="bar-marker" style="left:${rangePos}%"></div>
      </div>
      <div class="drop-tag" style="color:${alert?'var(--down)':'var(--muted)'}">
        ${dropFromHigh.toFixed(1)}% onder de top · drempel ${thr}%${smartOn() && q.vol ? ` <span title="Beweeglijkheid ${q.vol.toFixed(0)}% per jaar; je vaste drempel is ${p.thresh}%">(slim)</span>` : ''}
      </div>
      ${alert && trendUp != null ? `<div class="trend-tag" style="color:${trendUp ? 'var(--up)' : 'var(--warn)'}">${trendUp
        ? '✓ dip in een stijgende trend (boven 200-daags gemiddelde)'
        : '⚠ onder het 200-daags gemiddelde: dalende trend, voorzichtig'}</div>` : ''}
    </div>
    ${profitBlock}
    <div class="p-actions">
      ${(() => {
        const m = metrics(p, q);
        if (m.alert) return '<span class="badge buy">KOOPSIGNAAL</span>';
        if (!isWatch && m.openSell) return '<span class="badge sell">VERKOOPSIGNAAL</span>';
        return '<span class="badge hold">geen actie</span>';
      })()}
      ${isWatch ? '' : `<button class="edit-cost" data-id="${id}">Aankoopprijs aanpassen</button>`}
      <button class="remove" data-id="${id}">verwijder</button>
    </div>`;

  // Knop: verwijderen
  el.querySelector('.remove').onclick = () => removePosition(id);

  // Knop: aankoopprijs aanpassen
  const editBtn = el.querySelector('.edit-cost');
  if (editBtn) editBtn.onclick = () => {
    const huidige = p.cost;
    const invoer = prompt(
      `Nieuwe gemiddelde aankoopprijs voor ${p.label || p.ticker} (in ${cur}):\n` +
      `Huidig: ${huidige}`, huidige);
    if (invoer == null) return;
    const nieuw = parseFloat(invoer.replace(',', '.'));
    if (!isFinite(nieuw) || nieuw <= 0) { alert('Ongeldig bedrag'); return; }
    userState[id] = userState[id] || {};
    userState[id].cost = nieuw;
    p.cost = nieuw;
    saveState(); savePositions(); render();
  };

  // Knop: verkoop realiseren
  const realBtn = el.querySelector('.realise');
  if (realBtn) realBtn.onclick = () => {
    const step = parseInt(realBtn.dataset.step);
    const sellPct = parseInt(realBtn.dataset.pct);
    const today = new Date().toLocaleDateString('nl-NL');
    userState[id] = userState[id] || {};
    userState[id].sells = userState[id].sells || [];
    // Sla de koers op het verkoopmoment op, zodat we een 25% koersdaling
    // kunnen detecteren die dit niveau opnieuw vrijgeeft (optie B).
    userState[id].sells.push({ level: step, pct: sellPct, date: today, price: q.price });
    saveState(); render();
  };

  // Knoppen: verkoopregistratie verwijderen
  el.querySelectorAll('.undo-sell').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (userState[id] && userState[id].sells) {
        const s = userState[id].sells[idx];
        const oms = s ? ` (+${s.level*50}% → ${s.pct}% verkocht op ${s.date})` : '';
        if (!confirm(`Weet je zeker dat je deze verkoopregistratie${oms} wilt verwijderen?`)) return;
        userState[id].sells.splice(idx, 1);
        saveState(); render();
      }
    };
  });

  return el;
}

let firstRender = true;
async function render() {
  const cards = document.getElementById('cards');
  const summary = document.getElementById('summary');
  // Bewaar scrollpositie zodat de pagina niet terugspringt bij verversen
  const scrollY = window.scrollY;
  if (firstRender) cards.innerHTML = '<div class="state">Koersen laden…</div>';

  let loadError = false;
  try {
    await loadData();
  } catch (e) {
    loadError = true;
  }
  loadExtra().then(renderCheck).catch(() => {});

  const results = positions.map(p => {
    const q = getQuote(p.ticker);
    return { p, q, err: !q };
  });

  cards.innerHTML = '';
  let totalValue = 0, totalCost = 0, alerts = 0, loaded = 0;

  // Tel eerst alle totalen/signalen over ALLE posities (los van filter)
  results.forEach(({ p, q }) => {
    if (q && !p.watch) {
      loaded++;
      totalValue += q.price * (p.qty || 1);
      totalCost += p.cost * (p.qty || 1);
      const m = metrics(p, q);
      if (m.alert) alerts++;
    } else if (q && p.watch) {
      loaded++;
    }
  });

  // Groepeer per sectie (voor tellers)
  const bySection = {};
  results.forEach(r => {
    const sec = r.p.section || 'Overig';
    (bySection[sec] = bySection[sec] || []).push(r);
  });

  // Huidige sorteer- en filterkeuzes
  const sortBy = document.getElementById('sortSel').value;
  const catBy = document.getElementById('catSel').value;
  const statusBy = document.getElementById('statusSel').value;
  const mktBy = document.getElementById('mktSel').value;
  try { sessionStorage.setItem('portfolio_filters', JSON.stringify({ sort: sortBy, cat: catBy, status: statusBy, mkt: mktBy })); } catch (e) {}

  // Filter toepassen: categorie EN status samen
  function passesFilter(r) {
    if (catBy !== 'all' && (r.p.section || 'Overig') !== catBy) return false;
    if (mktBy !== 'all' && exchangeKeyOf(r.p.ticker) !== mktBy) return false;
    if (statusBy !== 'all') {
      const m = metrics(r.p, r.q);
      if (statusBy === 'signals' && !m.alert) return false;
      if (statusBy === 'open' && !m.openSell) return false;
    }
    return true;
  }
  const filtered = results.filter(passesFilter);

  // Naam-helper
  const naam = r => (r.p.label || (r.q && r.q.name) || r.p.ticker).toLowerCase();

  // Toon in secties (sorteren op categorie én geen status-filter) of platte lijst
  const useSections = (sortBy === 'section') && (statusBy === 'all');

  function renderCard(r) {
    cards.appendChild(positionCard(r.p, r.q, r.err));
  }

  if (useSections) {
    const sections = [...SECTION_ORDER.filter(s => bySection[s]),
                      ...Object.keys(bySection).filter(s => !SECTION_ORDER.includes(s))];
    sections.forEach(sec => {
      const inSec = filtered.filter(r => (r.p.section || 'Overig') === sec);
      if (!inSec.length) return;
      const header = document.createElement('div');
      header.className = 'section-header';
      header.id = 'sec-' + sec.replace(/[^a-zA-Z]/g, '');
      header.textContent = sec;
      cards.appendChild(header);
      inSec.slice().sort((a, b) => naam(a).localeCompare(naam(b), 'nl')).forEach(renderCard);
    });
  } else {
    // Platte, gesorteerde lijst
    const sorted = filtered.slice().sort((a, b) => {
      if (sortBy === 'name') return naam(a).localeCompare(naam(b), 'nl');
      if (sortBy === 'result') return metrics(b.p, b.q).plPct - metrics(a.p, a.q).plPct;
      if (sortBy === 'signal') return metrics(b.p, b.q).drop - metrics(a.p, a.q).drop;
      if (sortBy === 'sellsignal') return metrics(a.p, a.q).toSell - metrics(b.p, b.q).toSell;
      return naam(a).localeCompare(naam(b), 'nl');
    });
    sorted.forEach(renderCard);
  }

  // Teller: hoeveel getoond
  const tbCount = document.getElementById('tbCount');
  if (tbCount) {
    tbCount.textContent = filtered.length === results.length
      ? `${results.length} posities`
      : `${filtered.length} van ${results.length} getoond`;
  }

  const totalPl = totalValue - totalCost;
  const totalPlPct = totalCost ? (totalPl / totalCost) * 100 : 0;

  const cnt = s => (bySection[s] ? bySection[s].length : 0);
  summary.innerHTML = `
    <div class="stat clickable" data-cat="Watchlist"><div class="label">Watchlist</div><div class="value">${cnt('Watchlist')}</div><div class="sub" style="color:var(--muted)">gevolgd</div></div>
    <div class="stat clickable" data-cat="Stocks"><div class="label">Stocks</div><div class="value">${cnt('Stocks')}</div><div class="sub" style="color:var(--muted)">aandelen</div></div>
    <div class="stat clickable" data-cat="ETF's"><div class="label">ETF's</div><div class="value">${cnt("ETF's")}</div><div class="sub" style="color:var(--muted)">fondsen</div></div>
    <div class="stat clickable" data-cat="Gold & Silver"><div class="label">Edelmetalen</div><div class="value">${cnt('Gold & Silver')}</div><div class="sub" style="color:var(--muted)">goud &amp; zilver</div></div>`;

  const catSel = document.getElementById('catSel');
  summary.querySelectorAll('.stat.clickable').forEach(el => {
    const cat = el.dataset.cat;
    if (catSel.value === cat) el.classList.add('active');
    el.onclick = () => {
      // Klik op actieve categorie = terug naar alle; anders filter op die categorie
      catSel.value = (catSel.value === cat) ? 'all' : cat;
      render();
    };
  });

  let base;
  if (dataUpdated) {
    const d = new Date(dataUpdated);
    base = 'data van ' + d.toLocaleString('nl-NL', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  } else {
    base = 'bijgewerkt ' + new Date().toLocaleTimeString('nl-NL');
  }
  const upd = document.getElementById('updated');
  upd.dataset.base = base;
  upd.textContent = base;

  // Herstel de scrollpositie (behalve bij de allereerste render)
  if (!firstRender) window.scrollTo(0, scrollY);
  firstRender = false;
  renderMarkets();
}

function removePosition(id) {
  const pos = positions.find(p => posId(p) === id);
  const q = pos && getQuote(pos.ticker);
  const naam = pos ? (pos.label || (q && q.name) || pos.ticker) : id;
  const tick = pos && pos.ticker !== naam ? ` (${pos.ticker})` : '';
  if (!confirm(`Weet je zeker dat je ${naam}${tick} wilt verwijderen?`)) return;
  positions = positions.filter(p => posId(p) !== id);
  savePositions();
  render();
}

// Dialog
const dlg = document.getElementById('dlg');
document.getElementById('add').onclick = () => dlg.showModal();
document.getElementById('f-cancel').onclick = () => dlg.close();
document.getElementById('f-save').onclick = () => {
  const t = document.getElementById('f-ticker').value.trim().toUpperCase();
  if (!t) return;
  const section = document.getElementById('f-section').value;
  const isWatch = section === 'Watchlist';
  const costVal = parseFloat(document.getElementById('f-cost').value);
  positions.push({
    ticker: t,
    section: section,
    watch: isWatch,
    cost: isWatch ? null : (costVal || 0),
    qty: parseFloat(document.getElementById('f-qty').value) || 1,
    thresh: parseInt(document.getElementById('f-thresh').value),
    cur: document.getElementById('f-cur').value
  });
  ['f-ticker','f-cost','f-qty'].forEach(id => document.getElementById(id).value = '');
  dlg.close();
  savePositions();
  render();
};

// Automatisch verversen: de pagina haalt elke 5 minuten data.json opnieuw op.
// GitHub werkt data.json elke 15 min bij, dus nieuwe koersen komen vanzelf binnen.
// ---- Beursstatus: open/dicht per handelsplaats in je portefeuille ----
const EXCHANGES = {
  XETRA:  { name: 'Xetra',              city: 'Frankfurt',  tz: 'Europe/Berlin',    open: [9, 0],  close: [17, 30] },
  DUS:    { name: 'Börse Düsseldorf',   city: 'Düsseldorf', tz: 'Europe/Berlin',    open: [8, 0],  close: [22, 0]  },
  AMS:    { name: 'Euronext Amsterdam', city: 'Amsterdam',  tz: 'Europe/Amsterdam', open: [9, 0],  close: [17, 30] },
  MIL:    { name: 'Borsa Italiana',     city: 'Milaan',     tz: 'Europe/Rome',      open: [9, 0],  close: [17, 30] },
  NYSE:   { name: 'NYSE',               city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  },
  NASDAQ: { name: 'NASDAQ',             city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  },
  US:     { name: 'VS-beurs',           city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  }
};
const EXCHANGE_ORDER = ['XETRA', 'DUS', 'AMS', 'MIL', 'NYSE', 'NASDAQ', 'US'];

// Yahoo-beurscodes -> onze sleutels
const YAHOO_EXCHANGE = {
  GER: 'XETRA', DUS: 'DUS', AMS: 'AMS', MIL: 'MIL',
  NYQ: 'NYSE', ASE: 'NYSE', PCX: 'NYSE',
  NMS: 'NASDAQ', NGM: 'NASDAQ', NCM: 'NASDAQ', NAS: 'NASDAQ'
};
// Terugval op het achtervoegsel van de ticker (als de data nog geen beurscode heeft)
const SUFFIX_EXCHANGE = { DE: 'XETRA', DU: 'DUS', AS: 'AMS', MI: 'MIL' };

function exchangeKeyOf(ticker) {
  const q = dataCache && dataCache[ticker.toUpperCase()];
  if (q && q.exchange && YAHOO_EXCHANGE[q.exchange]) return YAHOO_EXCHANGE[q.exchange];
  const m = ticker.match(/\.([A-Z]+)$/);
  if (m) return SUFFIX_EXCHANGE[m[1]] || null;
  return 'US';
}

// Datum/tijd-onderdelen van een moment in een bepaalde tijdzone
function tzParts(date, tz) {
  const f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const o = {};
  f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute };
}
// Het echte moment (Date) van een lokale beurstijd y-m-d h:mi in tijdzone tz
function tzDate(tz, y, m, d, h, mi) {
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const p = tzParts(new Date(guess), tz);
  const offset = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) - guess;
  return new Date(guess - offset);
}

function marketStatus(ex, now) {
  const p = tzParts(now, ex.tz);
  for (let k = 0; k < 8; k++) {
    const day = new Date(Date.UTC(p.y, p.m - 1, p.d + k));
    const wd = day.getUTCDay();
    if (wd === 0 || wd === 6) continue;            // weekend
    const y = day.getUTCFullYear(), m = day.getUTCMonth() + 1, d = day.getUTCDate();
    const openAt = tzDate(ex.tz, y, m, d, ex.open[0], ex.open[1]);
    const closeAt = tzDate(ex.tz, y, m, d, ex.close[0], ex.close[1]);
    if (now >= openAt && now < closeAt) return { open: true, at: closeAt };
    if (now < openAt) return { open: false, at: openAt };
  }
  return { open: false, at: null };
}

function fmtMoment(date, now) {
  const tijd = date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  const zelfdeDag = date.toDateString() === now.toDateString();
  if (zelfdeDag) return tijd;
  const morgen = new Date(now); morgen.setDate(now.getDate() + 1);
  if (date.toDateString() === morgen.toDateString()) return 'morgen ' + tijd;
  return date.toLocaleDateString('nl-NL', { weekday: 'short' }) + ' ' + tijd;
}

function renderMarkets() {
  const box = document.getElementById('markets');
  if (!box) return;
  const counts = {};
  positions.forEach(p => {
    const key = exchangeKeyOf(p.ticker);
    if (key && EXCHANGES[key]) counts[key] = (counts[key] || 0) + 1;
  });
  const now = new Date();
  const status = {};
  Object.keys(EXCHANGES).forEach(k => { status[k] = marketStatus(EXCHANGES[k], now); });

  // Handelstijden van vandaag in lokale tijd, voor weergave én sortering
  function lokaleTijden(ex) {
    const p = tzParts(now, ex.tz);
    const o = tzDate(ex.tz, p.y, p.m, p.d, ex.open[0], ex.open[1]);
    const c = tzDate(ex.tz, p.y, p.m, p.d, ex.close[0], ex.close[1]);
    const hm = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    return {
      openMin: o.getHours() * 60 + o.getMinutes(),
      closeMin: c.getHours() * 60 + c.getMinutes(),
      label: hm(o) + '–' + hm(c)
    };
  }

  const keys = Object.keys(counts).filter(k => EXCHANGES[k]);
  const tijden = {};
  keys.forEach(k => { tijden[k] = lokaleTijden(EXCHANGES[k]); });
  keys.sort((a, b) =>
    tijden[a].openMin - tijden[b].openMin ||
    tijden[a].closeMin - tijden[b].closeMin ||
    EXCHANGES[a].name.localeCompare(EXCHANGES[b].name));

  // Beurs-dropdown in de toolbar bijwerken (alleen als de lijst verandert,
  // zodat een geopende dropdown niet elke minuut dichtklapt)
  const mktSel = document.getElementById('mktSel');
  const sig = keys.join(',');
  if (mktSel && mktSel.dataset.sig !== sig) {
    const keuze = mktSel.dataset.want || mktSel.value;
    const wanted = !!mktSel.dataset.want; delete mktSel.dataset.want;
    mktSel.innerHTML = '<option value="all">Alle</option>' +
      keys.map(k => `<option value="${k}">${EXCHANGES[k].name}</option>`).join('');
    mktSel.value = keys.includes(keuze) ? keuze : 'all';
    mktSel.dataset.sig = sig;
    if (wanted && mktSel.value !== 'all') setTimeout(render, 0);   // bewaarde beurskeuze toepassen
  }
  const actief = mktSel ? mktSel.value : 'all';
  box.classList.toggle('filtering', actief !== 'all');

  box.innerHTML = keys.map(key => {
    const ex = EXCHANGES[key];
    const st = status[key];
    const tekst = st.open
      ? `<b>open</b> · sluit ${fmtMoment(st.at, now)}`
      : `<b>gesloten</b>${st.at ? ' · opent ' + fmtMoment(st.at, now) : ''}`;
    const aan = actief === key;
    return `<div class="mkt ${st.open ? 'open' : 'closed'}${aan ? ' active' : ''}" data-mkt="${key}"
      role="button" tabindex="0" aria-pressed="${aan}"
      title="${aan ? 'Toon weer alle posities' : 'Toon alleen posities op ' + ex.name}">
      <div class="mkt-top">
        <span class="mkt-dot"></span>
        <span class="mkt-name">${ex.name}</span>
      </div>
      <div class="mkt-hours">${ex.city} · ${tijden[key].label}</div>
      <div class="mkt-state">${tekst}</div>
      <div class="mkt-foot">${counts[key]} ${counts[key] === 1 ? 'positie' : 'posities'}</div>
    </div>`;
  }).join('');

  // Bolletjes op de kaarten bijwerken
  document.querySelectorAll('.exch-dot').forEach(el => {
    const key = el.dataset.exch;
    const ex = EXCHANGES[key];
    if (!ex) { el.className = 'exch-dot'; return; }
    const st = status[key];
    el.className = 'exch-dot ' + (st.open ? 'open' : 'closed');
    el.title = `${ex.name}: ${st.open ? 'open, sluit ' : 'gesloten, opent '}${st.at ? fmtMoment(st.at, now) : ''}`;
  });
}

function toggleMarket(key) {
  const sel = document.getElementById('mktSel');
  sel.value = (sel.value === key) ? 'all' : key;
  renderMarkets();                       // direct visuele feedback
  render().then(() => {
    // Staat de lijst buiten beeld (bv. op de telefoon), scroll er dan naartoe
    const tb = document.querySelector('.toolbar');
    if (sel.value !== 'all' && tb && tb.getBoundingClientRect().top > window.innerHeight - 140) {
      tb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}
(function () {
  const box = document.getElementById('markets');
  box.addEventListener('click', e => {
    const el = e.target.closest('.mkt');
    if (el) toggleMarket(el.dataset.mkt);
  });
  box.addEventListener('keydown', e => {
    const el = e.target.closest('.mkt');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleMarket(el.dataset.mkt); }
  });
})();

renderMarkets();
setInterval(renderMarkets, 60 * 1000);

setInterval(render, 5 * 60 * 1000);

// Ook verversen zodra je terugkeert naar het tabblad
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
});



// Sorteren en filteren: opnieuw renderen bij wijziging
// Filters blijven bewaard zolang dit browsertabblad open is (ook bij verversen); tabblad of browser dicht = standaard
try {
  const f = JSON.parse(sessionStorage.getItem('portfolio_filters') || 'null');
  if (f) {
    [['sortSel', f.sort], ['catSel', f.cat], ['statusSel', f.status]].forEach(([id, v]) => {
      const el = document.getElementById(id);
      if (v != null && [...el.options].some(o => o.value === v)) el.value = v;
    });
    const ms = document.getElementById('mktSel');
    if (f.mkt && f.mkt !== 'all') {
      if ([...ms.options].some(o => o.value === f.mkt)) ms.value = f.mkt;
      else ms.dataset.want = f.mkt;          // beurslijst nog niet opgebouwd: toepassen zodra die er is
    }
  }
} catch (e) {}
document.getElementById('smartChk').checked = smartOn();
document.getElementById('smartChk').onchange = e => { try { localStorage.setItem('buy_mode', e.target.checked ? 'slim' : 'vast'); } catch (err) {} render(); };
document.getElementById('sortSel').onchange = render;
document.getElementById('catSel').onchange = render;
document.getElementById('statusSel').onchange = render;
document.getElementById('mktSel').onchange = render;

// Toon de synchronisatiestatus
function updateSyncBadge() {
  const btn = document.getElementById('syncBtn');
  if (!btn) return;
  const map = {
    synced:  { cls: 'sync-btn synced',  txt: '✓ Gesynct',  title: 'Gesynchroniseerd met GitHub — klik om te wijzigen' },
    local:   { cls: 'sync-btn',         txt: '⟳ Sync uit',  title: 'Synchronisatie met GitHub instellen' },
    error:   { cls: 'sync-btn error',   txt: '⚠ Sync-fout', title: 'Synchronisatie mislukt — klik om opnieuw te proberen' },
    syncing: { cls: 'sync-btn syncing', txt: '⟳ Bezig…',   title: 'Bezig met synchroniseren' },
    locked:  { cls: 'sync-btn error',   txt: '🔒 Token nodig', title: 'Je gegevens op GitHub zijn versleuteld met een andere token. Klik om je huidige token in te voeren.' }
  };
  const s = map[syncStatus] || map.local;
  btn.className = s.cls;
  btn.textContent = s.txt;
  btn.title = s.title;
}

// Token instellen / wijzigen / verwijderen
document.getElementById('syncBtn').onclick = async () => {
  const huidige = getToken();
  if (huidige) {
    const keuze = confirm('Synchronisatie is actief op dit apparaat.\n\nOK = token vervangen\nAnnuleren = token verwijderen (terug naar alleen dit apparaat)');
    if (keuze) {
      const nieuw = prompt('Plak je nieuwe GitHub-token (github_pat_...):', '');
      if (nieuw) {
        // Had dit apparaat de gegevens al open (juiste oude token)? Dan versleutelen we ze opnieuw met de nieuwe token.
        const hadOpen = stateLocked !== 'verkeerde-token';
        setToken(nieuw.trim());
        if (!hadOpen) {
          const remote = await loadStateFromGitHub();      // op een ander apparaat al omgezet? Dan opent de nieuwe token hem
          if (remote) { userState = mergeState(remote, userState); saveStateLocal(); positions.forEach(applyState); render(); }
        }
        const ok = await saveStateToGitHub(hadOpen || stateLocked !== 'verkeerde-token');
        alert(ok ? 'Token opgeslagen. Je gegevens zijn versleuteld met de nieuwe token.' : 'Kon niet opslaan — controleer de token.');
      }
    } else {
      setToken('');
      syncStatus = 'local'; updateSyncBadge();
      alert('Token verwijderd van dit apparaat. Je gegevens blijven lokaal bewaard.');
    }
    return;
  }
  const t = prompt('Plak je GitHub-token (github_pat_...) om je gegevens tussen apparaten te synchroniseren.\n\nDe token wordt alleen op dit apparaat bewaard, niet in de code.', '');
  if (t) {
    setToken(t.trim());
    syncStatus = 'syncing'; updateSyncBadge();
    // Bij het aanzetten: haal eerst remote op, en als die er niet is, push de lokale
    const remote = await loadStateFromGitHub();
    if (remote && typeof remote === 'object') {
      userState = mergeState(remote, userState); saveStateLocal();
      positions.forEach(applyState);
      render();
    }
    const ok = await saveStateToGitHub();
    alert(ok ? 'Synchronisatie ingesteld. Je gegevens staan nu ook op GitHub.' : 'Kon niet naar GitHub schrijven — controleer de token.');
  }
};

// Reset alle filters naar standaard
document.getElementById('resetFilters').onclick = () => {
  document.getElementById('sortSel').value = 'section';
  document.getElementById('catSel').value = 'all';
  document.getElementById('statusSel').value = 'all';
  document.getElementById('mktSel').value = 'all';
  render();
};

// Bij opstart: probeer de state van GitHub te halen (bron van waarheid bij
// meerdere apparaten). Lukt dat, gebruik die; anders val terug op lokaal.
async function initSync() {
  let wasPlain = false;
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_STATE_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
      { headers: getToken() ? { Authorization: 'Bearer ' + getToken() } : {} });
    if (r.ok) wasPlain = !Vault.isLocked(JSON.parse(Vault.b64ToText((await r.json()).content)));
  } catch (e) {}
  const remote = await loadStateFromGitHub();
  if (remote && typeof remote === 'object') {
    const merged = mergeState(remote, userState);
    const changed = JSON.stringify(merged) !== JSON.stringify(remote);
    userState = merged;
    saveStateLocal();
    positions.forEach(applyState);
    syncStatus = getToken() ? 'synced' : 'local';
    // oude onversleutelde versie of nieuwe gegevens (migratie)? Meteen versleuteld terugschrijven
    if (getToken() && (wasPlain || changed || migrated)) saveStateToGitHub();
  } else if (stateLocked === 'verkeerde-token') {
    syncStatus = 'locked';
  } else if (getToken() && (migrated || wasPlain)) {
    saveStateToGitHub();
  }
  updateSyncBadge();
  render();
}

initSync();
</script>
