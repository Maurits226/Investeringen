<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style id="af">html{display:none}</style>
<script src="antiframe.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patroonradar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #141517;
    --panel: #1a1c1e;
    --panel-2: #202224;
    --line: #2a2c2f;
    --muted: #83888d;
    --text: #eceef0;
    --up: #3ecf8e;
    --down: #f0595f;
    --warn: #f5b544;
    --accent: #4f8ff0;
    --violet: #a78bfa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #1e2430 0%, transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 26px;
  }
  .title-block h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  /* bovenaan: loopt de titel over twee regels, dan blijft de stip bij de eerste regel */
  .pulse {
    flex-shrink: 0; margin-top: .45em;
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(79,143,240,.55);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,143,240,.5); }
    70% { box-shadow: 0 0 0 10px rgba(79,143,240,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,143,240,0); }
  }
  .title-block p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, .btn {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 15px;
    border-radius: 10px; font-size: 13px; font-weight: 500; transition: .15s;
    text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .updated { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  }
  .stat { min-width: 0; }
  .stat.clickable { cursor: pointer; transition: border-color .15s, transform .15s; }
  /* Hover alleen met een muis: op een touchscreen blijft hij na een tik 'hangen' */
  @media (hover: hover) { .stat.clickable:hover { border-color: var(--accent); transform: translateY(-2px); } }
  .stat.clickable:active { transform: translateY(0); }
  .stat.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stat.clickable.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .stat .label.plain { text-transform: none; letter-spacing: .3px; font-size: 12px; }
  .stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-top: 8px; }
  .stat .sub { font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .world { margin-bottom: 18px; }
  .world-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .world-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .regime { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .regime.off { color: var(--down); border-color: rgba(255,93,108,.4); background: rgba(255,93,108,.10); }
  .regime.calm { color: var(--up); border-color: rgba(62,207,142,.4); background: rgba(62,207,142,.10); }
  .regime.week { color: var(--muted); }
  .regime.week b { font-weight: 600; }
  .regime.week.pos { color: var(--up); border-color: rgba(62,207,142,.4); background: rgba(62,207,142,.06); }
  .regime.week.neg { color: var(--down); border-color: rgba(255,93,108,.4); background: rgba(255,93,108,.06); }
  .factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .fac { padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .fac-l { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fac-v { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; margin-top: 3px; }
  .fac-d { font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 1px; }
  .fac-d .w { color: var(--muted); display: block; }
  .heads { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0; transition: border-color .15s; }
  .heads:hover, .heads[open] { border-color: rgba(79,143,240,.5); }
  .heads summary {
    cursor: pointer; font-size: 13px; color: var(--text); list-style: none; padding: 11px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .heads summary .h-sub { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .heads summary .h-btn {
    margin-left: auto; font-size: 11px; color: var(--accent); border: 1px solid rgba(79,143,240,.45);
    padding: 4px 10px; border-radius: 8px; white-space: nowrap;
  }
  .heads summary .h-btn::after { content: ' ▾'; }
  .heads[open] summary .h-btn::after { content: ' ▴'; }
  .heads .h-show-less { display: none; }
  .heads[open] .h-show-more { display: none; }
  .heads[open] .h-show-less { display: inline; }
  .heads ul { padding: 0 14px 12px; }
  .h-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; position: relative; top: -1px; background: var(--line); }
  .h-dot.pos { background: var(--up); } .h-dot.neg { background: var(--down); }
  .regime-why { font-size: 11.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; line-height: 1.5; }
  .regime-why b { color: var(--text); font-weight: 500; }
  /* Beursklimaat: twee kaarten (vandaag = blauw, deze week = paars) */
  .clim { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .cc {
    position: relative; overflow: hidden; border-radius: 14px; padding: 16px 18px 14px;
    background: linear-gradient(180deg, var(--panel), var(--ink)); border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px; --tone: var(--muted); --mark: var(--accent);
  }
  .cc::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--mark); }
  .cc::after { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
               background: radial-gradient(circle, color-mix(in srgb, var(--tone) 16%, transparent), transparent 70%); pointer-events: none; }
  .cc.wk { --mark: var(--violet); }
  .cc.good { --tone: var(--up); } .cc.bad { --tone: var(--down); } .cc.mid { --tone: var(--warn, #f5b544); }
  .cc-k { display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); }
  .cc-k i { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mark) 22%, transparent); }
  .cc-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .cc-verdict { font-size: 22px; font-weight: 700; letter-spacing: -.4px; color: var(--tone); line-height: 1.1; }
  .cc-num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: var(--tone); white-space: nowrap; }
  .cc-sub { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
  .cc-meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .meter { background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .meter-l { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .meter-l b { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .gauge { position: relative; height: 6px; border-radius: 6px; margin-top: 8px;
           background: linear-gradient(90deg, var(--up) 0 26.7%, var(--warn, #f5b544) 26.7% 50%, var(--down) 50% 100%); opacity: .85; }
  .gauge .pin { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--panel); }
  .trend { margin-top: 5px; font-size: 12.5px; font-weight: 600; }
  .dist { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--panel-2); gap: 2px; }
  .dist span { display: block; height: 100%; }
  .dist .u { background: var(--up); } .dist .f { background: #3a3e43; } .dist .d { background: var(--down); }
  .dist-l { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: -3px; flex-wrap: wrap; }
  .dist-l em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
  .dist-l em::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
  .dist-l .u { color: var(--up); } .dist-l .f { color: #6b7075; } .dist-l .d { color: var(--down); }
  .cc-basis { font-size: 11px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 9px; margin-top: auto; }
  .cc-basis b { color: var(--mark); font-weight: 500; }
  /* Met de techradar (vierde, hoge tegel): de andere tegels links onder elkaar, de techradar rechts ernaast.
     De onderste tegel links vult de rest van de hoogte, zodat de voetregels links en rechts op één lijn staan. */
  .clim.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 761px) {
    .clim.c4 { grid-template-rows: auto auto 1fr; }
    .clim.c4 > .cc { grid-column: 1; }
    .clim.c4 > .tw-cc { grid-column: 2; grid-row: 1 / -1; }
    .clim.c4:not(:has(> .cc.wk)), .clim.c4:not(:has(> .cc.cr)) { grid-template-rows: auto 1fr; }
  }
  /* drie tegels zonder techradar: past de derde niet meer naast de andere twee, dan over de volle breedte */
  @media (min-width: 761px) and (max-width: 960px) {
    .clim:not(.c4) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .clim:not(.c4) > .cc:nth-child(3), .clim:not(.c4) > .cc:only-child { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) { .clim, .clim.c4 { grid-template-columns: 1fr; } }
  /* Crashradar: derde kaart (amber) + uitklapbare historie sinds 1950 */
  .cc.cr { --mark: #f5b544; }
  .cc.cr.koop { --tone: var(--up); }
  .cc-num small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .pbar { position: relative; height: 6px; border-radius: 6px; margin-top: 8px; background: var(--panel-2); overflow: visible; }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--tone); }
  .pbar em { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--muted); transform: translateX(-1px); }
  .ladder3 { display: flex; gap: 4px; margin-top: 8px; }
  .ladder3 span { flex: 1; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-align: center; padding: 3px 0; border-radius: 5px;
                  border: 1px dashed var(--line); color: var(--muted); }
  .ladder3 span.hit { border-style: solid; border-color: rgba(62,207,142,.6); color: var(--up); background: rgba(62,207,142,.08); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.on { color: var(--warn); border-color: rgba(245,181,68,.5); background: rgba(245,181,68,.07); }
  .cc-basis a { color: #f5b544; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .cc-basis a:focus-visible { outline: 2px solid #f5b544; outline-offset: 2px; border-radius: 3px; }
  details.crashx { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: -2px 0 14px; }
  /* techradar-onderbouwing: los blok over de volle breedte, zelfde stijl als de crashhistorie */
  .tw-full { margin: -2px 0 14px; --mark: #2dd4bf; --tone: var(--muted); } .tw-full details.tw-det { background: var(--panel); border-radius: 12px; }
  .tw-full details.tw-det[open] { border-color: rgba(45,212,191,.45); }
  .tw-full details.tw-det > summary { padding: 11px 14px; font-size: 13px; } .tw-full .tw-dbody { padding: 0 14px 14px; }
  details.crashx[open] { border-color: rgba(245,181,68,.45); }
  details.crashx > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 13px; }
  details.crashx > summary::-webkit-details-marker { display: none; }
  details.crashx .h-sub { color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  details.crashx .h-btn { margin-left: auto; font-size: 11px; color: #f5b544; border: 1px solid rgba(245,181,68,.45); padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
  details.crashx .h-btn::after { content: ' ▾'; }
  details.crashx[open] .h-btn::after { content: ' ▴'; }
  details.crashx .h-show-less { display: none; }
  details.crashx[open] .h-show-more { display: none; }
  details.crashx[open] .h-show-less { display: inline; }
  @media (max-width: 560px) { details.crashx .h-sub, .heads summary .h-sub { display: none; } }
  .cx-body { padding: 4px 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cx-c { background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .cx-c.wide { grid-column: 1 / -1; }
  .cx-k { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; }
  .cx-k span { text-transform: none; letter-spacing: 0; font-family: 'IBM Plex Mono', monospace; }
  .cx-t { width: 100%; border-collapse: collapse; font-size: 12px; }
  .cx-t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 3px 0; }
  .cx-t th:not(:first-child), .cx-t td:not(:first-child) { text-align: right; font-family: 'IBM Plex Mono', monospace; padding-left: 10px; white-space: nowrap; }
  .cx-t td { padding: 4px 0; border-top: 1px dashed #26282b; vertical-align: top; }
  .cx-t td.l { text-align: left !important; white-space: normal !important; font-family: inherit !important; }
  .cx-t tr.cur td { color: #f5b544; }
  .cx-t .chip { font-size: 11px; font-weight: 500; padding: 1px 7px; margin: 0 3px 3px 0; display: inline-block; }
  .cx-t td small { font-size: 11px; }
  .cx-note { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
  .cx-note b { color: var(--text); font-weight: 600; }
  .cx-chart svg { width: 100%; height: 150px; display: block; }
  /* jaartallen als gewone tekst over de grafiek: de svg rekt mee in de breedte, de letters niet */
  .cx-plot { position: relative; }
  .cx-plot span { position: absolute; transform: translate(-50%, -100%); font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1;
                  color: #83888d; white-space: nowrap; pointer-events: none; }
  .cx-plot span.bear { color: #f0595f; }
  .cx-wrap { overflow-x: auto; }
  @media (max-width: 900px) { .cx-body { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {
    .cx-body { padding: 4px 10px 12px; gap: 10px; }
    .cx-c { padding: 10px 12px; }
    .cx-plot span.bear, .cx-bn { display: none; }  /* te smal: jaartallen van berenmarkten vallen over elkaar (en de uitleg erover vervalt) */
    .cx-t th, .cx-t th:not(:first-child) { white-space: normal; }
    .cx-t th:not(:first-child), .cx-t td:not(:first-child) { padding-left: 8px; }
    /* Brede tabellen: per rij eerst het label over de volle breedte, daaronder de cijfers in vaste kolommen
       (koprij blijft staan, zonder de eerste kop). Zo hoeft er niets opzij te scrollen. */
    .cx-t.stk, .cx-t.stk tbody { display: block; }
    .cx-t.stk tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 8px; padding: 6px 0; border-top: 1px dashed #26282b; }
    .cx-t.stk tr:first-child { border-top: 0; padding: 0 0 2px; }
    .cx-t.stk th:first-child { display: none; }
    .cx-t.stk td, .cx-t.stk th { border-top: 0; padding: 0; text-align: left !important; white-space: normal; }
    .cx-t.stk td:first-child { grid-column: 1 / -1; }
    .cx-t.stk td small { display: block; }
    .cx-t.lad tr { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cx-t.dip tr { grid-template-columns: minmax(0, .55fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr); }
    /* Berenmarkten: periode en daling naast elkaar, de signalen eronder met een eigen label */
    .cx-t.bears tr { grid-template-columns: minmax(0, 1fr) auto; }
    .cx-t.bears tr:first-child { display: none; }
    .cx-t.bears td:first-child { grid-column: auto; }
    .cx-t.bears td:nth-child(2) { text-align: right !important; }
    .cx-t.bears td:nth-child(n+3) { grid-column: 1 / -1; position: relative; padding-left: 5.8em; }
    .cx-t.bears td[data-l]::before { content: attr(data-l); position: absolute; left: 0; top: 2px; color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
    .cx-t.bears td small { display: inline; }
  }
  .fac.key { box-shadow: inset 0 2px 0 var(--accent); }
  .heads summary::-webkit-details-marker { display: none; }
  .heads ul { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
  .heads li, .news li { font-size: 13px; line-height: 1.4; }
  .heads a, .news a { color: var(--text); text-decoration: none; }
  .heads a:hover, .news a:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-left: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.warn { color: var(--warn); border-color: rgba(245,181,68,.45); }
  .tag.pos { color: var(--up); border-color: rgba(62,207,142,.4); }
  .tag.neg { color: var(--down); border-color: rgba(255,93,108,.4); }
  .news { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .ctx-list { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; font-size: 13px; }
  .ctx-list small { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-left: 4px; }
  .markets {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .mkt {
    display: flex; flex-direction: column; gap: 4px; padding: 11px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    min-width: 0;
  }
  .mkt { cursor: pointer; transition: border-color .15s, transform .15s, opacity .15s; }
  @media (hover: hover) {
    .mkt:hover { border-color: var(--accent); transform: translateY(-2px); }
    .markets.filtering .mkt:not(.active):hover { opacity: 1; }
  }
  .mkt:active { transform: translateY(0); }
  .mkt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mkt.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .markets.filtering .mkt:not(.active) { opacity: .5; }
  .mkt-top { display: flex; align-items: center; gap: 8px; }
  .mkt-hours { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .mkt-time { white-space: nowrap; }
  .mkt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mkt.open .mkt-dot { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .mkt.closed .mkt-dot { background: var(--down); }
  .mkt-name { font-size: 13px; font-weight: 600; color: var(--text); }
  /* groeit mee, zodat de voetregels van kaarten naast elkaar op één lijn staan */
  .mkt-state { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); flex-grow: 1; }
  .mkt.open .mkt-state b { color: var(--up); font-weight: 600; }
  .mkt.closed .mkt-state b { color: var(--down); font-weight: 600; }
  .mkt-foot {
    font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--line);
  }
  .exch-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 8px; vertical-align: middle; position: relative; top: -2px;
    background: var(--line);
  }
  .exch-dot.open { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .exch-dot.closed { background: var(--down); }
  /* Filterbalk: vier filters in gelijke kolommen, daaronder reset + teller */
  .toolbar {
    display: grid; grid-template-columns: 1.4fr 1.2fr 1.1fr 1fr; gap: 14px;
    margin-bottom: 20px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .tb-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .tb-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .toolbar select {
    font-family: inherit; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    height: 38px; padding: 0 11px; border-radius: 9px; font-size: 13px; width: 100%; min-width: 0; cursor: pointer;
  }
  .toolbar select:hover { border-color: var(--accent); outline: none; }
  .tb-row2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tb-count { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-left: auto; white-space: nowrap; }
  .tb-reset {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    height: 38px; padding: 0 14px; border-radius: 9px; font-size: 13px; white-space: nowrap;
  }
  .tb-reset:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 640px) { .toolbar { grid-template-columns: 1fr 1fr; gap: 10px 12px; } }
  .section-header {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
    margin-top: 18px; margin-bottom: 2px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-header::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent);
  }

  .position {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: grid;
    /* vaste kolommen voor koers, verwachting, plan en knoppen: dan staat alles op elke kaart op dezelfde plek.
       De balk krijgt minstens de breedte voor 'stop US$ 1.046,23 · nu · doel US$ 1.145,47', de naam de rest. */
    grid-template-columns: minmax(0,1.1fr) 118px 118px minmax(185px,1fr) 224px 156px; gap: 14px; align-items: center;
    /* clip i.p.v. hidden (waar de browser het kent): knipt hetzelfde af, maar laat 'sticky' in de details werken */
    position: relative; overflow: hidden; overflow: clip; transition: .2s;
  }
  .position::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line);
  }
  .position.down::before { background: var(--down); }
  .position.down.flag {
    border-color: rgba(255,93,108,.5);
    box-shadow: 0 0 0 1px rgba(255,93,108,.25), 0 8px 30px -12px rgba(255,93,108,.4);
  }
  .position.up::before { background: var(--up); }
  .position.up.flag {
    border-color: rgba(62,207,142,.5);
    box-shadow: 0 0 0 1px rgba(62,207,142,.25), 0 8px 30px -12px rgba(62,207,142,.4);
  }

  .position.new::before { background: var(--warn); }
  .position.new.flag {
    border-color: rgba(245,181,68,.55);
    box-shadow: 0 0 0 1px rgba(245,181,68,.28), 0 8px 30px -12px rgba(245,181,68,.45);
  }

  .p-name { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .p-ticker { font-size: 19px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; overflow-wrap: anywhere; display: flex; align-items: baseline; }   /* lange Duitse namen niet buiten de kolom */
  .p-ticker .exch-dot, .p-ticker .rank-tag { flex-shrink: 0; }   /* tweede regel van een lange naam loopt onder de tekst, niet onder de stip */
  .p-company { font-size: 12px; color: var(--muted); max-width: 220px; }
  .rank-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--accent); margin-right: 7px; }
  .src { font-size: 11px; font-weight: 600; margin-left: 4px; white-space: nowrap; }
  .src-live { color: var(--up); }
  .src-none { color: var(--warn); }

  .p-block .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .p-block .v { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-top: 4px; }
  .v.up, .c-up { color: var(--up); } .v.down, .c-down { color: var(--down); }
  .drop-tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; color: var(--muted); }
  .drop-tag.c-up { color: var(--up); } .drop-tag.c-down { color: var(--down); }

  .bar-wrap { display: flex; flex-direction: column; gap: 7px; }
  /* drie gelijke vakken: 'nu' staat midden boven het witte streepje; past een label niet, dan op twee regels */
  .bar-labels { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 6px; font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .bar-labels .doel { color: var(--up); }
  .bar-labels > span:last-child { text-align: right; }
  .bar-wrap .drop-tag b { color: var(--text); font-weight: 600; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 6px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .bar-fill.down { right: 50%; background: linear-gradient(270deg, var(--warn), var(--down)); }
  .bar-fill.up { left: 50%; background: linear-gradient(90deg, var(--warn), var(--up)); }
  .bar-marker { position: absolute; top: -3px; left: 50%; width: 3px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }

  .profit-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-right: 10px; }
  .profit-block .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .plan-row { font-size: 11px; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 82px minmax(0,1fr) auto; align-items: baseline; gap: 6px; }
  .plan-row b { font-weight: 600; }
  .plan-row b { color: var(--text); }
  .plan-row .pp { color: var(--muted); white-space: nowrap; }
  .next-target { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .plan-row .real-pct { grid-column: 2 / -1; margin-top: -3px; color: var(--up); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

  .p-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; min-width: 0; }
  .p-actions .entry { white-space: normal; text-align: right; }
  .p-btns { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .err-msg { grid-column: 2 / -2; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.down { background: rgba(255,93,108,.15); color: var(--down); border: 1px solid rgba(255,93,108,.4); }
  .badge.up { background: rgba(62,207,142,.15); color: var(--up); border: 1px solid rgba(62,207,142,.4); }
  .badge.new { background: rgba(245,181,68,.15); color: var(--warn); border: 1px solid rgba(245,181,68,.45); }
  .badge.hold { background: rgba(134,149,179,.12); color: var(--muted); border: 1px solid var(--line); }
  .toggle { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .toggle:hover { border-color: var(--accent); color: var(--text); }
  /* lange lijst op een smal scherm: de rest van een groep achter deze knop */
  .more-btn { display: block; width: 100%; min-height: 44px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px;
              background: transparent; color: var(--muted); font-size: 13px; }
  .more-btn:hover { border-color: var(--accent); color: var(--text); }

  .detail {
    grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 16px;
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px;
  }
  .spark { display: block; width: 100%; height: 130px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; border-top: 2px dashed currentColor; vertical-align: middle; margin-right: 5px; }
  .d-k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .pat { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .pat li { font-size: 13px; display: flex; gap: 8px; }
  .pat li.off { color: var(--muted); }
  .pat small { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-left: 4px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .facts .v { font-family: 'IBM Plex Mono', monospace; font-size: 15px; margin-top: 3px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .note b { color: var(--text); font-weight: 600; }
  .stopnote { font-size: 12px; line-height: 1.5; padding: 9px 11px; border-radius: 9px; background: rgba(245,181,68,.10); border: 1px solid rgba(245,181,68,.35); color: var(--warn); margin-bottom: 14px; }

  .state { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .err { color: var(--warn); }
  .empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }

  /* ---- advies sinds / opgevolgd ---- */
  .since { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .badge.followed { background: rgba(79,143,240,.15); color: var(--accent); border: 1px solid rgba(79,143,240,.45); }
  .toggle.follow { color: var(--accent); border-color: rgba(79,143,240,.45); }
  .entry { font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .entry.in { color: var(--up); border: 1px dashed rgba(62,207,142,.6); }
  .entry.in.down { color: var(--down); border-color: rgba(255,93,108,.6); }
  .entry.out { color: var(--warn); border: 1px solid rgba(245,181,68,.5); background: rgba(245,181,68,.08); }
  .position.late { border-color: rgba(245,181,68,.45) !important; box-shadow: none !important; }
  .position.late::before { background: var(--warn) !important; }

  .trade {
    background: var(--panel); border: 1px solid rgba(79,143,240,.45); border-radius: 16px; padding: 18px 20px;
    /* zelfde kolommen als de kaarten eronder: naam, koers en resultaat staan recht boven naam, koers en verwachting */
    display: grid; grid-template-columns: minmax(0,1.1fr) 118px 118px minmax(185px,1fr) 224px 156px;
    gap: 14px; align-items: center; position: relative; overflow: hidden;
  }
  .trade .t-action { grid-column: 4 / 6; }
  .trade::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .trade > .p-block { align-self: start; }      /* 'Koers nu' en 'Resultaat' op één lijn, ook al is het tweede blok hoger */
  .trade.go { border-color: rgba(62,207,142,.6); box-shadow: 0 0 0 1px rgba(62,207,142,.25), 0 8px 30px -12px rgba(62,207,142,.4); }
  .trade.go::before { background: var(--up); }
  .trade.stop { border-color: rgba(240,89,95,.6); box-shadow: 0 0 0 1px rgba(240,89,95,.25), 0 8px 30px -12px rgba(240,89,95,.4); }
  .trade.stop::before { background: var(--down); }
  .t-action { font-size: 13px; line-height: 1.5; }
  .t-action b { font-weight: 700; }
  .t-action .sub { display: block; font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 3px; }
  .t-warn { display: block; font-size: 11px; color: var(--warn); margin-top: 4px; }
  .t-btns { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .t-range { height: 6px; background: var(--panel-2); border-radius: 6px; position: relative; margin-top: 8px; }
  .t-range .dot { position: absolute; top: -4px; width: 3px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }
  .t-range-l { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 5px; }

  #pinned:not(:empty) { margin-bottom: 26px; }
  .sync-note { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  /* Desktop: de twee koersblokken even hoog (label en onderregel op twee regels), dan staan de bedragen op één lijn */
  @media (min-width: 1101px) {
    .position > .p-block .k { min-height: 2.6em; line-height: 1.3; display: flex; align-items: flex-end; }
    .position > .p-block .v, .trade > .p-block .v { font-size: 16px; }
    .position > .p-block .drop-tag { min-height: 2.6em; line-height: 1.3; }
  }
  /* Details open: de koersgrafiek links blijft in beeld terwijl je de lange rechterkolom leest */
  @media (min-width: 861px) {
    .detail > div:first-child { position: sticky; top: 12px; align-self: start; }
  }
  /* Tablet: naam | koers | verwachting op één rij; balk, plan en knoppen eronder over de volle breedte */
  @media (max-width: 1100px) {
    .position { grid-template-columns: minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr); }
    .position > .p-block { align-self: start; }
    .p-actions, .bar-wrap, .profit-block { grid-column: 1 / -1; }
    .err-msg { grid-column: 2 / -1; }
    /* status links, knoppen rechts: zo staan ze op elke kaart op dezelfde plek */
    .p-actions { flex-direction: row; justify-content: flex-start; align-items: center; flex-wrap: wrap; }
    .p-actions .entry { text-align: left; }
    .p-btns { flex-direction: row; align-items: center; margin-left: auto; }
    /* plan: percentage direct naast de prijs, niet helemaal aan de rechterkant van de kaart */
    .plan-row { grid-template-columns: 94px minmax(13ch, max-content) minmax(0,1fr); column-gap: 14px; }
    .plan-row .pp { justify-self: start; }
    .factors { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    /* opgevolgde adviezen: dezelfde drie kolommen als de kaarten */
    .trade { grid-template-columns: minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr); }
    .trade .t-action, .trade .t-btns { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .summary { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat .label { min-height: 2.8em; }
    .detail { grid-template-columns: 1fr; }
  }
  /* Aanraakscherm of smal venster: knoppen groot genoeg voor een vinger (±40px), velden 16px (anders zoomt iOS in) */
  @media (pointer: coarse), (max-width: 860px) {
    .toggle { min-height: 40px; padding: 8px 12px; font-size: 12px; }
    .t-btns { gap: 10px; }
    .t-btns .toggle[data-del] { min-width: 40px; }
    .toolbar select, .tb-reset { height: 40px; }
    .toolbar select { font-size: 16px; }
    .cc-basis a { padding: 12px 4px; margin: 0 -4px; }
  }
  @media (max-width: 520px) {
    /* Beurzen: één rij kaarten om horizontaal door te vegen in plaats van drie rijen onder elkaar */
    .markets {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 12px;
      gap: 8px; margin: -4px -12px 14px; padding: 4px 12px 6px; scrollbar-width: none;
    }
    .markets::-webkit-scrollbar { display: none; }
    .mkt { flex: 0 0 190px; scroll-snap-align: start; }        /* derde kaart steekt net in beeld: er is meer */
    .mkt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body { padding: 18px 12px 40px; }
    header.top { flex-direction: column; align-items: stretch; }
    .title-block h1 { font-size: 22px; }
    .controls { justify-content: space-between; }
    .summary { gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
    .position { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 16px; gap: 14px; }
    .p-name, .err-msg { grid-column: 1 / -1; }
    .p-ticker { font-size: 22px; }
    .factors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* zonder signaal is de balk leeg en is er geen plan: kaart compact houden (staat ook onder Details) */
    .position:not(.flag) > .bar-wrap, .position:not(.flag) > .profit-block { display: none; }
    .trade { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 16px; gap: 14px; }
    .trade .t-name { grid-column: 1 / -1; }
  }
  /* Smalle telefoon en smal tablet: 'Verwachting 10 dagen' past niet op één regel. Beide labels twee regels hoog
     (tekst onderaan), dan staan de bedragen van koers en verwachting op één lijn */
  @media (max-width: 400px), (min-width: 521px) and (max-width: 720px) {
    .position > .p-block .k { min-height: 2.6em; line-height: 1.3; display: flex; align-items: flex-end; }
  }
  @media (min-width: 521px) and (max-width: 720px) {
    .position > .p-block .v { font-size: 16px; }      /* 'US$ 3.147,99' past dan in de smalle kolom */
  }
  @media (max-width: 380px) {
    .summary { gap: 8px; }
    .stat { padding: 10px; }
    .stat .label { letter-spacing: .4px; }
    .stat .sub { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1><span class="pulse"></span><span id="pageTitle">Patroonradar</span></h1>
      <p id="pageSub"></p>
    </div>
    <div class="controls">
      <span class="sync-note" id="syncNote"></span>
      <span class="updated" id="updated">laden…</span>
    </div>
  </header>
  <p class="hint" id="demo" hidden style="margin:-10px 0 20px">Voorbeeld met een kopie van je signals.json. Op GitHub Pages leest deze pagina je live bestand.</p>

  <div class="markets" id="markets"></div>
  <div class="world" id="world"></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="tb-group">
      <label class="tb-label" for="sortSel">Sorteer</label>
      <select id="sortSel">
        <option value="section">Categorie</option>
        <option value="result">Resultaat (hoog → laag)</option>
        <option value="name">Naam (A → Z)</option>
      </select>
    </div>
    <div class="tb-group">
      <label class="tb-label" for="catSel">Categorie</label>
      <select id="catSel">
        <option value="all">Alle</option>
        <option value="Stocks">Stocks</option>
        <option value="Gold & Silver">Edelmetalen</option>
      </select>
    </div>
    <div class="tb-group">
      <label class="tb-label" for="mktSel">Beurs</label>
      <select id="mktSel">
        <option value="all">Alle</option>
      </select>
    </div>
    <div class="tb-group">
      <label class="tb-label" for="statusSel">Status</label>
      <select id="statusSel">
        <option value="all">Alle</option>
        <option value="up">Koopsignaal</option>
        <option value="new">Nieuw signaal</option>
        <option value="flat">Geen signaal</option>
      </select>
    </div>
    <div class="tb-row2">
      <button id="resetFilters" class="tb-reset">Reset filters</button>
      <span class="tb-count" id="tbCount"></span>
    </div>
  </div>

  <div class="cards" id="pinned"></div>
  <div class="cards" id="cards"></div>

</div>

<script src="vault.js"></script>
<script src="shared.js"></script>
<script src="techwarn.js"></script>
<script>
// Welke radar: je eigen investeringen (standaard) of de Top 250 (signals.html?set=top250)
const SET = new URLSearchParams(location.search).get('set') === 'top250' ? 'top250' : 'investeringen';
const SETS = {

const fmt = (n, cur) => n == null ? '–' : new Intl.NumberFormat('nl-NL', {
  style: 'currency', currency: cur || 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2
}).format(n);
const pct = (n, d = 1) => (n >= 0 ? '+' : '') + n.toFixed(d).replace('.', ',') + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
// Externe links (nieuws): alleen http(s), anders gewoon tekst. Nieuw tabblad zonder verwijzing terug naar het dashboard.
const safeUrl = u => { try { const x = new URL(String(u || ''), location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
// Google News zet de bron achter de kop ("… - Yahoo Finance"); die staat al in de regel eronder
const stripSrc = (t, src) => { t = String(t || ''); const tail = ' - ' + String(src || ''); return src && t.endsWith(tail) ? t.slice(0, -tail.length) : t; };
const extLink = (u, text) => { const s = safeUrl(u); return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>` : esc(text); };

// Posities van het portfolio (zelfde website, dus zelfde localStorage):
// zo kloppen categorie, label en watchlist ook voor posities die je later toevoegt.
function portfolioPositions() {
  try {
    const list = JSON.parse(localStorage.getItem('portfolio_positions') || '[]');
    const map = {};
    list.forEach(p => { if (p && p.ticker) map[p.ticker.toUpperCase()] = p; });
    return map;
  } catch (e) { return {}; }
}

function prep(raw) {
  const pos = portfolioPositions();
  const one = it => {
    const p = pos[it.symbol.toUpperCase()];
    const cat = (p && p.section) || it.category || 'Stocks';
    const pr = it.projected_pct;
    const flag = pr != null && it.direction === 'up' && pr >= MOVE_MIN;   // alleen koopsignalen
    return { ...it, flag, category: MERGE_CATEGORY[cat] || cat, label: (p && p.label) || it.label, watch: SET === 'top250' };
  };
  const keep = it => !SKIP_CATEGORIES.includes(it.category);
  const all = raw.items.map(one);
  const items = all.filter(keep);
  const skipped = new Set(all.filter(x => !keep(x)).map(x => x.symbol));
  // trefkans opnieuw optellen zonder de weggelaten posities
  const leeg = () => ({ n: 0, hits: 0, base_n: 0, base_hits: 0, plan_n: 0, wins: 0, losses: 0, ret_sum: 0 });
  const stats = { down: leeg(), up: leeg() };
  items.forEach(it => ['down', 'up'].forEach(d => Object.keys(stats[d]).forEach(k => { stats[d][k] += (it.backtest?.[d]?.[k] || 0); })));
  return { ...raw, stats, items, skipped, history: raw.history || [], errors: (raw.errors || []).map(one).filter(keep) };
}

async function load() {
  if (DEMO) { data = prep(DEMO); quotes = DEMO_QUOTES || {}; document.getElementById('demo').hidden = false; render(); return; }
  try {
    const q = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (q.ok) quotes = (await q.json()).quotes || {};
  } catch (e) {}
  try {
    const c = await fetch('crash.json?t=' + Date.now(), { cache: 'no-store' });
    if (c.ok) crash = await c.json();
  } catch (e) {}
  try {
    const t = await fetch('tech.json?t=' + Date.now(), { cache: 'no-store' });
    if (t.ok) tech = await t.json();
  } catch (e) {}
  try {
    const r = await fetch(CFG.file + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = prep(await r.json());
    render();
  } catch (e) {
    if (!data) {
      document.getElementById('updated').textContent = 'geen ' + CFG.file;
      document.getElementById('cards').innerHTML = `<div class="empty">Nog geen signalen. Start de workflow <b>${CFG.workflow}</b> via de tab <b>Actions</b> → <b>Run workflow</b> en ververs daarna.${SET === 'top250' ? ' Deze radar gebruikt de lijst van de workflow <b>Top 250</b>; draai die eerst.' : ''}</div>`;
    }
  }
}

function stappen(it) {
  const p = it.plan; if (!p) return null;
  const r = (a, b) => pct((b / a - 1) * 100);
  return [
    ['koop', it.watch ? 'Kopen' : 'Bijkopen', p.entry, 'nu'],
    ['real', 'Verkopen', p.target, (p.target / p.entry - 1) * 100],
    ['koop', 'Terugkopen', p.next, r(p.target, p.next)],
  ];
}

function rate(a, b) { return b ? Math.round(100 * a / b) : null; }

// het realisatiepercentage dat in het plan groen staat (null = geen signaal)
// signaal vandaag gekregen dat er gisteren nog niet was
// Nieuw = het advies is in de afgelopen handelsdag ontstaan (24 uur terug, weekend overgeslagen).
// Draait de markt eerder, dan vervalt het advies gewoon eerder: geen signaal meer = niet meer op de radar.
function newCutoff() {
  const c = new Date(Date.now() - 24 * 3600 * 1000);
  while (c.getDay() === 0 || c.getDay() === 6) c.setDate(c.getDate() - 1);   // maandag telt vanaf vrijdag
  return c;
}
function isNew(it) {
  if (!it.flag) return false;
  const ep = activeEpisode(it.symbol, it.direction);
  if (!ep || ep.bootstrap || !ep.start) return false;
  return new Date(ep.start) >= newCutoff();
}

function realPct(it) {
  if (!it.flag || !it.plan) return null;
  const p = it.plan;
  return it.direction === 'up' ? (p.target / p.entry - 1) * 100 : (p.next / p.target - 1) * 100;
}

function card(it) {
  const el = document.createElement('div');
  const cur = it.currency;
  // alleen een signaal bij een verwachte beweging van 5% of meer
  const sig = it.flag, d = sig ? it.direction : 'flat', p = it.projected_pct;
  el.className = 'position' + (sig ? ' ' + d + ' flag' : '') + (isNew(it) ? ' new' : '');
  const open = ui.open.includes(it.symbol);
  const title = it.label || it.name || it.symbol;
  const sigma = `±${it.sigma_pct.toFixed(1).replace('.', ',')}%`;

  const verw = !sig
    ? `<div class="v" style="color:var(--muted)">geen signaal</div><div class="drop-tag">${it.direction === 'flat' || p == null ? 'geen duidelijk patroon' : `verwacht ${pct(p)}, onder de ${MOVE_MIN}%`}</div>`
    : `<div class="v ${d}">${pct(p)}</div><div class="drop-tag">naar ${fmt(it.target, cur)}</div>`;

  // Balk: wit streepje = koers nu. Groen naar rechts = verwachte stijging, rood naar links = verwachte daling.
  const w = sig ? Math.min(50, Math.abs(p) / 20 * 50) : 0;
  let lblL = '', lblR = '', under = `normale beweging ${sigma}`;
  const doel = `<span class="doel">doel ${fmt(it.target, cur)}</span>`;
  if (sig && d === 'up') {
    lblL = 'stop ' + fmt(it.plan.stop, cur); lblR = doel;
    under = `plan eindigt onder ${fmt(it.plan.stop, cur)}<br>actie: <b>verkopen</b>`;
  }

  const s = sig ? stappen(it) : null;
  const planBlock = s
    ? s.map(([cls, lbl, prijs, sub]) => cls === 'real'
        ? `<div class="plan-row"><b>${lbl}</b><span>${fmt(prijs, cur)}</span><span class="pp"></span><span class="real-pct">(voor +${Math.abs(sub).toFixed(1).replace('.', ',')}% realisatie)</span></div>`
        : `<div class="plan-row"><b>${lbl}</b><span>${fmt(prijs, cur)}</span><span class="pp">${sub}</span></div>`).join('')
    : `<div class="next-target">Geen plan: verwachte beweging kleiner dan ${MOVE_MIN}%</div>`;

  const ei = entryInfo(it), ep = ei && ei.ep;
  if (ei && ei.kind === 'out') el.classList.add('late');
  const since = ep ? `<span class="since" title="Advies voor het eerst getoond">${ep.bootstrap ? 'al vóór ' + dag(ep.start) : 'sinds ' + dagTijd(ep.start)}</span>` : '';
  const entry = !ei ? ''
    : ei.kind === 'in'
      ? `<span class="entry in ${ei.up ? '' : 'down'}" title="Tot deze koers blijft er minstens ${MOVE_MIN}% over tot het doel van het advies">✓ INSTAPPEN tot ${fmt(ei.grens, cur)}</span>`
      : `<span class="entry out" title="Het advies is verlopen voor nieuwe instappers; wie al instapte volgt het plan">✕ NIET MEER INSTAPPEN</span>
         <span class="since">${ei.reason}</span>`;
  const tr = tradeFor(it.symbol);
  const followBtn = tr ? `<span class="badge followed" title="Je hebt dit advies opgevolgd: zie bovenaan">OPGEVOLGD</span>`
    : sig && ei && ei.kind === 'in' ? `<button class="toggle follow" data-follow="${esc(it.symbol)}" title="Heb je dit advies uitgevoerd? Dan blijft het bovenaan staan">✓ Opgevolgd</button>` : '';

  const badge = !sig ? `<span class="badge hold">geen actie</span>`
    : `<span class="badge up">KOOPSIGNAAL</span>`;

  el.innerHTML = `
    <div class="p-name">
      <span class="p-ticker"><span class="exch-dot" data-exch="${exchangeKeyOf(it.symbol) || ''}"></span>${it.rank ? `<span class="rank-tag" title="Plaats in Kansen portefeuille">#${it.rank}</span>` : ''}${esc(title)}</span>
      <span class="p-company">(${esc(it.symbol)})${exchName(it.symbol)} <span class="src src-live" title="${it.pattern_symbol ? 'Patroon berekend op ' + esc(it.pattern_symbol) + ' (VS), koersen in euro' : 'Koersdata opgehaald'}">● data${it.pattern_symbol ? ' via ' + esc(it.pattern_symbol) : ''}</span></span>
      ${contextTags(it)}
    </div>
    <div class="p-block">
      <div class="k">Huidige koers</div>
      <div class="v ${it.day_pct > 0 ? 'up' : it.day_pct < 0 ? 'down' : ''}">${fmt(it.price, cur)}</div>
      <div class="drop-tag ${it.day_pct > 0 ? 'c-up' : it.day_pct < 0 ? 'c-down' : ''}">${it.day_pct == null ? '' : pct(it.day_pct, 2) + ' vandaag'}</div>
    </div>
    <div class="p-block">
      <div class="k">Verwachting ${data.config.horizon} dagen</div>
      ${verw}
    </div>
    <div class="bar-wrap">
      <div class="bar-labels"><span>${lblL}</span><span>${sig ? 'nu' : ''}</span><span>${lblR}</span></div>
      <div class="bar">
        ${w ? `<div class="bar-fill ${d}" style="width:${w}%"></div>` : ''}
        <div class="bar-marker"></div>
      </div>
      <div class="drop-tag">${under}</div>
    </div>
    <div class="profit-block">
      <div class="k">Plan</div>
      ${planBlock}
    </div>
    <div class="p-actions">
      ${isNew(it) ? '<span class="badge new" title="Dit signaal is in de afgelopen handelsdag ontstaan. Draait de markt, dan kan het eerder vervallen.">NIEUW SIGNAAL</span>' : ''}
      ${badge}
      ${entry}
      ${since}
      <span class="p-btns">${followBtn}<button class="toggle" data-sym="${esc(it.symbol)}">${open ? 'Minder' : 'Details'}</button></span>
    </div>
    ${open ? detail(it) : ''}`;
  return el;
}


// ---- Context van buitenaf: wereldfactoren, nieuws, kwartaalcijfers, analisten ----
const TOPIC = { 'stock market': 'beurs', 'oil prices': 'olie', war: 'oorlog/conflict', 'Federal Reserve': 'rente (Fed)', tariffs: 'handelstarieven', 'semiconductor stocks': 'chips' };
const RATING = { strong_buy: 'sterk kopen', buy: 'kopen', hold: 'houden', underperform: 'onderpresteren', sell: 'verkopen' };
function geleden(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  // vaste spatie: getal en eenheid nooit over twee regels
  return m < 60 ? m + '\u00a0min' : m < 1440 ? Math.round(m / 60) + '\u00a0uur' : Math.round(m / 1440) + '\u00a0d';
}
function fmtFactor(f) {
  const nl = (x, d) => x.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
  if (f.key === 'dollar') return nl(f.last, 4);
  if (f.key === 'rente') return nl(f.last, 2) + '%';
  if (f.key === 'vix') return nl(f.last, 1);
  return f.last >= 1000 ? nl(f.last, 0) : nl(f.last, 2);
}
function renderWorld() {
  const box = document.getElementById('world');
  const w = data && data.world;
  if (!box) return;
  if (!w || !(w.factors || []).length) { box.innerHTML = ''; return; }
  const reg = w.regime || {};
  // Volgorde: eerst wat het beursklimaat bepaalt, dan de markten, dan macro
  const ORDER = ['vix', 'nasdaq', 'dax', 'chips', 'rente', 'dollar', 'olie', 'goud'];
  const WHY = {
    vix: 'Angstindex: verwachte beweeglijkheid van de S&P 500. Onder 18 = rustig, vanaf 25 = paniek. Bepaalt mee het beursklimaat.',
    nasdaq: 'Nasdaq 100: graadmeter voor tech. Boven of onder zijn 50-daags gemiddelde bepaalt mee het beursklimaat.',
    dax: 'DAX: graadmeter voor de Duitse/Europese beurs, waar de meeste van je euro-noteringen handelen.',
    chips: 'Chipsector (SOX): veel van je posities zijn chipbedrijven; deze index laat zien hoe de sector als geheel ervoor staat.',
    rente: 'Amerikaanse 10-jaarsrente: stijgende rente drukt vooral op groei- en techaandelen.',
    dollar: 'Euro/dollar: stijgt de euro, dan zijn je dollarbedrijven in euro minder waard (en omgekeerd).',
    olie: 'Olieprijs (Brent): hoge olie jaagt inflatie aan en raakt transport en industrie.',
    goud: 'Goud: vluchthaven; sterk stijgend goud wijst vaak op onrust. Ook relevant voor je goudpositie.'
  };
  const rank = k => { const i = ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const sorted = w.factors.slice().sort((a, b) => rank(a.key) - rank(b.key));
  const byKey = Object.fromEntries(w.factors.map(f => [f.key, f]));
  const facs = sorted.map(f => {
    // stijgende angstindex of rente is slecht nieuws voor aandelen: kleur omgekeerd
    const inv = f.key === 'vix' || f.key === 'rente';
    const good = inv ? f.day_pct < 0 : f.day_pct > 0;
    const col = f.day_pct === 0 ? 'var(--muted)' : good ? 'var(--up)' : 'var(--down)';
    const key = f.key === 'vix' || f.key === 'nasdaq';
    return `<div class="fac ${key ? 'key' : ''}" title="${esc(WHY[f.key] || f.symbol)}"><div class="fac-l">${esc(f.label)}</div><div class="fac-v">${fmtFactor(f)}</div>
      <div class="fac-d"><span style="color:${col}">${pct(f.day_pct, 1)}</span>${f.week_pct != null ? `<span class="w">week ${pct(f.week_pct, 1)}</span>` : ''}</div></div>`;
  }).join('');
  const hl = w.headlines || [];
  const heads = hl.map(h =>
    `<li><span class="h-dot ${h.sent > 0 ? 'pos' : h.sent < 0 ? 'neg' : ''}" title="${h.sent > 0 ? 'positieve toon' : h.sent < 0 ? 'negatieve toon' : 'neutrale toon'}"></span>${extLink(h.link, stripSrc(h.title, h.publisher))}<span class="meta">${esc(h.publisher || '')} · ${geleden(h.time)} · ${esc(TOPIC[h.topic] || h.topic)}</span></li>`).join('');
  // Waarop het beursklimaat is gebaseerd (zelfde regel als in scripts/signals.py)
  const vix = byKey.vix, nd = byKey.nasdaq;
  const open = box.querySelector('details.heads') && box.querySelector('details.heads').open;
  const cxOpen = box.querySelector('details.crashx') && box.querySelector('details.crashx').open;
  const twOpen = box.querySelector('details.tw-det') && box.querySelector('details.tw-det').open;
  const wk = weekOutlook();
  const clim = climateCards(reg, byKey, wk);
  box.innerHTML = `
    ${clim}
    ${crashDetails(cxOpen)}
    ${techDetails(twOpen)}
    <div class="factors">${facs}</div>
    ${heads ? `<details class="heads"${open ? ' open' : ''}><summary>📰 Wereldnieuws
        <span class="h-sub">${hl.length} ${hl.length === 1 ? 'kop' : 'koppen'} · laatste 3 dagen · nieuwste eerst</span>
        <span class="h-btn"><span class="h-show-more">tonen</span><span class="h-show-less">verbergen</span></span></summary>
        <ul>${heads}</ul></details>` : ''}`;
}
// Twee kaarten: beursklimaat vandaag (blauw) en deze week (paars)
function climateCards(reg, byKey, wk) {
  const vix = byKey.vix, nd = byKey.nasdaq;
  const V = {
    calm:    ['good', 'Rustig & stijgend', 'Angstindex laag en de Nasdaq in een stijgende trend.'],
    neutral: ['mid',  'Neutraal', 'Geen duidelijke risico-aan- of risico-uit-stand.'],
    off:     ['bad',  'Risico-uit', 'Angstindex hoog of Nasdaq onder zijn trend: voorzichtig met kopen.']
  }[reg.state] || ['', '—', esc(reg.text || 'Nog geen gegevens.')];
  // angstindex op een schaal van 10 tot 40 (groen < 18, oranje 18-25, rood ≥ 25)
  const vixPos = vix ? Math.max(0, Math.min(100, (vix.last - 10) / 30 * 100)) : null;
  const up = nd && nd.trend === 'up';
  const today = `<div class="cc ${V[0]}">
      <div class="cc-k"><i></i>Beursklimaat vandaag</div>
      <div class="cc-main"><span class="cc-verdict">${V[1]}</span></div>
      <div class="cc-sub">${V[2]}</div>
      ${vix && nd ? `<div class="cc-meters">
        <div class="meter"><div class="meter-l">Angstindex <b>${fmtFactor(vix)}</b></div>
          <div class="gauge" title="rustig < 18 · onrustig 18–25 · paniek ≥ 25"><span class="pin" style="left:${vixPos.toFixed(1)}%"></span></div></div>
        <div class="meter"><div class="meter-l">Nasdaq 100 <b>${fmtFactor(nd)}</b></div>
          <div class="trend ${up ? 'c-up' : 'c-down'}">${up ? '▲ boven' : '▼ onder'} 50-daags gem.</div></div>
      </div>` : ''}
      <div class="cc-basis">Gebaseerd op <b>angstindex</b> (rustig &lt; 18 · paniek ≥ 25) en <b>Nasdaq 100</b> t.o.v. zijn 50-daags gemiddelde · <b>blauw gemarkeerd in onderstaande tegels</b></div>
    </div>`;
  const tc = techCard();
  if (!wk) return `<div class="clim${tc ? ' c4' : ''}">${today}${crashCard()}${tc}</div>`;
  const flat = wk.n - wk.up - wk.down;
  const w = x => (x / wk.n * 100).toFixed(1) + '%';
  const week = `<div class="cc wk ${wk.cls === 'pos' ? 'good' : wk.cls === 'neg' ? 'bad' : 'mid'}">
      <div class="cc-k"><i></i>Beursklimaat deze week</div>
      <div class="cc-main"><span class="cc-verdict">${wk.word[0].toUpperCase() + wk.word.slice(1)}</span><span class="cc-num">${pct(wk.avg, 1)}</span></div>
      <div class="cc-sub">Verwacht gemiddeld resultaat van ${SET === 'investeringen' ? 'je stocks' : 'deze kansen'} over 5 handelsdagen</div>
      <div class="dist">${wk.up ? `<span class="u" style="width:${w(wk.up)}"></span>` : ''}${flat ? `<span class="f" style="width:${w(flat)}"></span>` : ''}${wk.down ? `<span class="d" style="width:${w(wk.down)}"></span>` : ''}</div>
      <div class="dist-l"><em class="u">${wk.up} omhoog</em><em class="f">${flat} vlak</em><em class="d">${wk.down} omlaag</em></div>
      <div class="cc-basis">Gebaseerd op <b>${wk.n} ${SET === 'investeringen' ? 'stocks in je portefeuille' : 'kansen'}</b>${SET === 'investeringen' ? ', <b>gewogen naar positiewaarde</b>' : ', gelijk gewogen'}</div>
    </div>`;
  return `<div class="clim${tc ? ' c4' : ''}">${today}${week}${crashCard()}${tc}</div>`;
}
// Vierde tegel: techradar (techwarn.js); zonder tech.json of script geen tegel

// Verwacht weekresultaat: de verwachte beweging van elke stock (radar, 10 handelsdagen) teruggerekend
// naar 5 dagen. Bij je investeringen gewogen naar de waarde van je positie, bij de Top 250 gelijk gewogen.
function weekOutlook() {
  if (!data || !data.items) return null;
  const horizon = (data.config && data.config.horizon) || 10;
  const pos = SET === 'investeringen' ? portfolioPositions() : {};
  let sw = 0, sm = 0, up = 0, down = 0, n = 0;
  data.items.forEach(it => {
    if (it.category === 'Gold & Silver') return;
    const p = pos[it.symbol.toUpperCase()];
    const w = SET === 'investeringen' ? (it.price || 1) * ((p && p.qty) || 1) : 1;
    // zonder duidelijk patroon telt een stock mee als 0%
    const week = it.projected_pct != null && isFinite(it.projected_pct) ? it.projected_pct * 5 / horizon : 0;
    sw += w; sm += w * week; n++;
    if (week > 0) up++; else if (week < 0) down++;
  });
  if (!n || !sw) return null;
  const avg = sm / sw;
  const cls = avg >= 0.5 ? 'pos' : avg <= -0.5 ? 'neg' : '';
  const word = cls === 'pos' ? 'positief' : cls === 'neg' ? 'negatief' : 'neutraal';
  const why = `Gemiddelde verwachte beweging van ${n} ${SET === 'investeringen' ? 'stocks in je portefeuille, gewogen naar positiewaarde' : 'kansen'}, `
    + `teruggerekend van ${horizon} naar 5 handelsdagen. Stocks zonder duidelijk patroon tellen als 0%. Vanaf +0,5% positief, vanaf -0,5% negatief. Edelmetalen tellen niet mee.`;
  return { avg, cls, word, up, down, n, why };
}

function spark(it) {
  const v = it.spark; if (!v || v.length < 2) return '';
  const lines = [];
  if (it.support != null) lines.push([it.support, 'var(--muted)', 'steun']);
  if (it.resistance != null) lines.push([it.resistance, 'var(--muted)', 'weerstand']);
  if (it.plan && it.flag) {
    lines.push([it.plan.target, 'var(--accent)', 'doel']);
    lines.push([it.plan.stop, 'var(--warn)', 'stop']);
  }
  const all = v.concat(lines.map(l => l[0]));
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const W = 400, H = 130, X = i => (i / (v.length - 1)) * W, Y = x => H - ((x - lo) / (hi - lo)) * H;
  const path = v.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join('');
  const col = it.direction === 'down' ? 'var(--down)' : it.direction === 'up' ? 'var(--up)' : 'var(--text)';
  return `<div class="d-k">Koers laatste ${v.length} handelsdagen</div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Koersgrafiek">
      ${lines.map(([y, c]) => `<line x1="0" x2="${W}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`).join('')}
      <path d="${path}" fill="none" stroke="${col}" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>
    <div class="legend">${lines.map(([y, c, l]) => `<span style="color:${c}"><i></i>${l} ${fmt(y, it.currency)}</span>`).join('')}</div>`;
}

  if (SET === 'top250') cats.sort((a, b) => a.localeCompare(b, 'nl'));

  const items = data.items, errors = data.errors;
  const inMkt = x => ui.mkt === 'all' || exchangeKeyOf(x.symbol) === ui.mkt;
  const passes = it => {
    if (ui.cat !== 'all' && it.category !== ui.cat) return false;
    if (!inMkt(it)) return false;
    if (ui.status === 'flag' && !it.flag) return false;
    if ((ui.status === 'down' || ui.status === 'up') && !(it.flag && it.direction === ui.status)) return false;
    if (ui.status === 'flat' && it.flag) return false;
    if (ui.status === 'new' && !isNew(it)) return false;
