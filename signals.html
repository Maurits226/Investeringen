<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patroonradar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #141517;
    --panel: #1a1c1e;
    --panel-2: #202224;
    --line: #2a2c2f;
    --muted: #83888d;
    --text: #eceef0;
    --up: #3ecf8e;
    --down: #f0595f;
    --warn: #f5b544;
    --accent: #4f8ff0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #1e2430 0%, transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 26px;
  }
  .title-block h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px;
  }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(79,143,240,.55);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,143,240,.5); }
    70% { box-shadow: 0 0 0 10px rgba(79,143,240,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,143,240,0); }
  }
  .title-block p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, .btn {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 9px 15px;
    border-radius: 10px; font-size: 13px; font-weight: 500; transition: .15s;
    text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .updated { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  }
  .stat.clickable { cursor: pointer; transition: border-color .15s, transform .15s; }
  .stat.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat.clickable:active { transform: translateY(0); }
  .stat.clickable.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; margin-top: 8px; }
  .stat .sub { font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .markets {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .mkt {
    display: flex; flex-direction: column; gap: 4px; padding: 11px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    min-width: 0;
  }
  .mkt-top { display: flex; align-items: center; gap: 8px; }
  .mkt-hours { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .mkt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mkt.open .mkt-dot { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .mkt.closed .mkt-dot { background: var(--down); }
  .mkt-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .mkt-state { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
  .mkt.open .mkt-state b { color: var(--up); font-weight: 600; }
  .mkt.closed .mkt-state b { color: var(--down); font-weight: 600; }
  .mkt-foot {
    font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--line);
  }
  .exch-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 8px; vertical-align: middle; position: relative; top: -2px;
    background: var(--line);
  }
  .exch-dot.open { background: var(--up); box-shadow: 0 0 0 3px rgba(62,207,142,.18); }
  .exch-dot.closed { background: var(--down); }
  .toolbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin-bottom: 20px; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .tb-group { display: flex; align-items: center; gap: 8px; }
  .tb-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .toolbar select {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); padding: 7px 11px;
    border-radius: 9px; font-size: 13px;
  }
  .toolbar select:hover { border-color: var(--accent); }
  .tb-count { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-left: auto; }
  .tb-reset {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); padding: 7px 12px;
    border-radius: 9px; font-size: 13px;
  }
  .tb-reset:hover { border-color: var(--accent); color: var(--text); }
  .section-header {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
    margin-top: 18px; margin-bottom: 2px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-header::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--accent);
  }

  .position {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1.6fr 1.3fr auto; gap: 18px; align-items: center;
    position: relative; overflow: hidden; transition: .2s;
  }
  .position::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line);
  }
  .position.down::before { background: var(--down); }
  .position.down.flag {
    border-color: rgba(255,93,108,.5);
    box-shadow: 0 0 0 1px rgba(255,93,108,.25), 0 8px 30px -12px rgba(255,93,108,.4);
  }
  .position.up::before { background: var(--up); }
  .position.up.flag {
    border-color: rgba(62,207,142,.5);
    box-shadow: 0 0 0 1px rgba(62,207,142,.25), 0 8px 30px -12px rgba(62,207,142,.4);
  }

  .p-name { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .p-ticker { font-size: 19px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; }
  .p-company { font-size: 12px; color: var(--muted); max-width: 220px; }

  .p-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .p-block .v { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-top: 4px; }
  .v.up, .c-up { color: var(--up); } .v.down, .c-down { color: var(--down); }
  .drop-tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; color: var(--muted); }
  .drop-tag.c-up { color: var(--up); } .drop-tag.c-down { color: var(--down); }

  .bar-wrap { display: flex; flex-direction: column; gap: 7px; }
  .bar-labels { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 6px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .bar-fill.down { right: 50%; background: linear-gradient(270deg, var(--warn), var(--down)); }
  .bar-fill.up { left: 50%; background: linear-gradient(90deg, var(--warn), var(--up)); }
  .bar-marker { position: absolute; top: -3px; left: 50%; width: 3px; height: 14px; background: #fff; border-radius: 2px; transform: translateX(-50%); }

  .profit-block { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  .profit-block .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .plan-row { font-size: 11px; font-family: 'IBM Plex Mono', monospace; display: flex; align-items: baseline; gap: 6px; }
  .plan-row b { font-weight: 600; min-width: 92px; }
  .plan-row .koop { color: var(--up); } .plan-row .verkoop { color: var(--down); } .plan-row .wacht { color: var(--muted); }
  .plan-row .pp { color: var(--muted); margin-left: auto; }
  .next-target { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .plan-real { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--up); font-weight: 600; line-height: 1.4; }

  .p-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.down { background: rgba(255,93,108,.15); color: var(--down); border: 1px solid rgba(255,93,108,.4); }
  .badge.up { background: rgba(62,207,142,.15); color: var(--up); border: 1px solid rgba(62,207,142,.4); }
  .badge.hold { background: rgba(134,149,179,.12); color: var(--muted); border: 1px solid var(--line); }
  .toggle { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .toggle:hover { border-color: var(--accent); color: var(--text); }

  .detail {
    grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 16px;
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px;
  }
  .spark { display: block; width: 100%; height: 130px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; border-top: 2px dashed currentColor; vertical-align: middle; margin-right: 5px; }
  .d-k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .pat { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .pat li { font-size: 13px; display: flex; gap: 8px; }
  .pat small { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-left: 4px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .facts .v { font-family: 'IBM Plex Mono', monospace; font-size: 15px; margin-top: 3px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .note b { color: var(--text); font-weight: 600; }
  .stopnote { font-size: 12px; line-height: 1.5; padding: 9px 11px; border-radius: 9px; background: rgba(245,181,68,.10); border: 1px solid rgba(245,181,68,.35); color: var(--warn); margin-bottom: 14px; }

  .state { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .err { color: var(--warn); }
  .empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }

  @media (max-width: 860px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .position { grid-template-columns: 1fr 1fr; }
    .p-actions { grid-column: span 2; flex-direction: row; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .bar-wrap { grid-column: span 2; }
    .profit-block { grid-column: span 2; }
    .detail { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .markets { grid-template-columns: repeat(2, 1fr); }
    .mkt-top { flex-wrap: wrap; }
    body { padding: 18px 12px 40px; }
    header.top { flex-direction: column; align-items: stretch; }
    .controls { justify-content: space-between; }
    .summary { gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .value { font-size: 20px; }
    .position { grid-template-columns: 1fr 1fr; padding: 16px; gap: 14px; }
    .p-name { grid-column: span 2; }
    .p-ticker { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1><span class="pulse"></span>Patroonradar</h1>
    </div>
    <div class="controls">
      <span class="updated" id="updated">laden…</span>
    </div>
  </header>
  <p class="hint" id="demo" hidden style="margin:-10px 0 20px">Voorbeeld met een kopie van je signals.json. Op GitHub Pages leest deze pagina je live bestand.</p>

  <div class="markets" id="markets"></div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">Sorteer</span>
      <select id="sortSel">
        <option value="section">Categorie (standaard)</option>
        <option value="score">Sterkste signaal</option>
        <option value="move">Grootste verwachte beweging</option>
        <option value="name">Naam (A-Z)</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Categorie</span>
      <select id="catSel">
        <option value="all">Alle</option>
        <option value="Stocks">Stocks</option>
        <option value="Gold & Silver">Edelmetalen</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="tb-label">Status</span>
      <select id="statusSel">
        <option value="all">Alles</option>
        <option value="flag">Interessant</option>
        <option value="down">Verwachte daling</option>
        <option value="up">Verwachte stijging</option>
        <option value="flat">Geen signaal</option>
      </select>
    </div>
    <button id="resetFilters" class="tb-reset">Reset</button>
    <span class="tb-count" id="tbCount"></span>
  </div>

  <div class="cards" id="cards"></div>

</div>

<script>
const DEMO = null; /*__DEMO__*/
const DEMO_QUOTES = null; /*__DEMOQ__*/
const SECTION_ORDER = ['Stocks', 'Gold & Silver'];
const SKIP_CATEGORIES = ["ETF's"];                 // ETF's doen niet mee in de radar
const MERGE_CATEGORY = { Watchlist: 'Stocks' };    // watchlist telt gewoon als stock
const MOVE_MIN = 5;                                // interessant vanaf een verwachte daling of stijging van 5%
const UI_KEY = 'signals_ui';

const fmt = (n, cur) => n == null ? '–' : new Intl.NumberFormat('nl-NL', {
  style: 'currency', currency: cur || 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2
}).format(n);
const pct = (n, d = 1) => (n >= 0 ? '+' : '') + n.toFixed(d).replace('.', ',') + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

let data = null;
let ui = { sort: 'section', cat: 'all', status: 'all', open: [] };
try { ui = { ...ui, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch (e) {}
if (!['all', 'Stocks', 'Gold & Silver'].includes(ui.cat)) ui.cat = 'all';
const saveUI = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} };

// Posities van het portfolio (zelfde website, dus zelfde localStorage):
// zo kloppen categorie, label en watchlist ook voor posities die je later toevoegt.
function portfolioPositions() {
  try {
    const list = JSON.parse(localStorage.getItem('portfolio_positions') || '[]');
    const map = {};
    list.forEach(p => { if (p && p.ticker) map[p.ticker.toUpperCase()] = p; });
    return map;
  } catch (e) { return {}; }
}

function prep(raw) {
  const pos = portfolioPositions();
  const one = it => {
    const p = pos[it.symbol.toUpperCase()];
    const cat = (p && p.section) || it.category || 'Stocks';
    const pr = it.projected_pct;
    const flag = pr != null && ((it.direction === 'down' && -pr >= MOVE_MIN) || (it.direction === 'up' && pr >= MOVE_MIN));
    return { ...it, flag, category: MERGE_CATEGORY[cat] || cat, label: (p && p.label) || it.label, watch: false };
  };
  const keep = it => !SKIP_CATEGORIES.includes(it.category);
  const items = raw.items.map(one).filter(keep);
  // trefkans opnieuw optellen zonder de weggelaten posities
  const leeg = () => ({ n: 0, hits: 0, base_n: 0, base_hits: 0, plan_n: 0, wins: 0, losses: 0, ret_sum: 0 });
  const stats = { down: leeg(), up: leeg() };
  items.forEach(it => ['down', 'up'].forEach(d => Object.keys(stats[d]).forEach(k => { stats[d][k] += (it.backtest?.[d]?.[k] || 0); })));
  return { ...raw, stats, items, errors: (raw.errors || []).map(one).filter(keep) };
}

async function load() {
  if (DEMO) { data = prep(DEMO); quotes = DEMO_QUOTES || {}; document.getElementById('demo').hidden = false; render(); return; }
  try {
    const q = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (q.ok) quotes = (await q.json()).quotes || {};
  } catch (e) {}
  try {
    const r = await fetch('signals.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = prep(await r.json());
    render();
  } catch (e) {
    if (!data) {
      document.getElementById('updated').textContent = 'geen signals.json';
      document.getElementById('cards').innerHTML = `<div class="empty">Nog geen signalen. Start de workflow <b>Patroonradar</b> via de tab <b>Actions</b> → <b>Run workflow</b> en ververs daarna.</div>`;
    }
  }
}

function stappen(it) {
  const p = it.plan; if (!p) return null;
  const r = (a, b) => pct((b / a - 1) * 100);
  if (it.direction === 'down') return [
    it.watch ? ['wacht', 'Nog niet kopen', p.entry, 'nu'] : ['verkoop', 'Verkopen', p.entry, 'nu'],
    ['koop', it.watch ? 'Kopen' : 'Terugkopen', p.target, r(p.entry, p.target)],
    ['real', 'Realisatie', p.next, (p.next / p.target - 1) * 100],
  ];
  return [
    ['koop', it.watch ? 'Kopen' : 'Bijkopen', p.entry, 'nu'],
    ['real', 'Realisatie', p.target, (p.target / p.entry - 1) * 100],
    ['koop', 'Terugkopen', p.next, r(p.target, p.next)],
  ];
}

function rate(a, b) { return b ? Math.round(100 * a / b) : null; }

function card(it) {
  const el = document.createElement('div');
  const d = it.direction, p = it.projected_pct, cur = it.currency;
  el.className = 'position ' + (d === 'flat' ? '' : d) + (it.flag ? ' flag' : '');
  const open = ui.open.includes(it.symbol);
  const title = it.label || it.name || it.symbol;

  const verw = (d === 'flat' || p == null)
    ? `<div class="v" style="color:var(--muted)">geen patroon</div><div class="drop-tag">score ${it.score > 0 ? '+' : ''}${it.score}</div>`
    : `<div class="v ${d}">${pct(p)}</div><div class="drop-tag">naar ${fmt(it.target, cur)}</div>`;

  const w = p == null || d === 'flat' ? 0 : Math.min(50, Math.abs(p) / 20 * 50);
  const lblL = d === 'down' ? fmt(it.target, cur) : it.plan ? fmt(it.plan.stop, cur) : '';
  const lblR = d === 'up' ? fmt(it.target, cur) : it.plan ? fmt(it.plan.stop, cur) : '';
  const s = stappen(it);
  const planBlock = s
    ? s.map(([cls, lbl, prijs, sub]) => cls === 'real'
        ? `<div class="plan-real">${lbl} voor ${Math.abs(sub).toFixed(1).replace('.', ',')}% (verkoop ${fmt(prijs, cur)})</div>`
        : `<div class="plan-row"><b class="${cls}">${lbl}</b><span>${fmt(prijs, cur)}</span><span class="pp">${sub}</span></div>`).join('')
    : `<div class="next-target">Geen plan: wacht op een duidelijk signaal</div>`;

  const badge = d === 'down' ? `<span class="badge down">${it.watch ? 'NOG NIET KOPEN' : 'VERKOOPSIGNAAL'}</span>`
    : d === 'up' ? `<span class="badge up">KOOPSIGNAAL</span>` : `<span class="badge hold">geen actie</span>`;

  el.innerHTML = `
    <div class="p-name">
      <span class="p-ticker"><span class="exch-dot" data-exch="${exchangeKeyOf(it.symbol) || ''}"></span>${esc(title)}</span>
      <span class="p-company">(${esc(it.symbol)})${exchName(it.symbol)}${it.label && it.name ? ' ' + esc(it.name) : ''}</span>
    </div>
    <div class="p-block">
      <div class="k">Huidige koers</div>
      <div class="v">${fmt(it.price, cur)}</div>
      <div class="drop-tag ${it.day_pct > 0 ? 'c-up' : it.day_pct < 0 ? 'c-down' : ''}">${it.day_pct == null ? '' : pct(it.day_pct, 2) + ' vandaag'}</div>
    </div>
    <div class="p-block">
      <div class="k">Verwachting ${data.config.horizon} dagen</div>
      ${verw}
    </div>
    <div class="bar-wrap">
      <div class="bar-labels"><span>${lblL}</span><span>verwachte beweging</span><span>${lblR}</span></div>
      <div class="bar">
        ${w ? `<div class="bar-fill ${d}" style="width:${w}%"></div>` : ''}
        <div class="bar-marker"></div>
      </div>
      <div class="drop-tag">${it.plan ? `plan vervalt ${d === 'down' ? 'boven' : 'onder'} ${fmt(it.plan.stop, cur)}` : `normale beweging ±${it.sigma_pct.toFixed(1).replace('.', ',')}%`}</div>
    </div>
    <div class="profit-block">
      <div class="k">Plan</div>
      ${planBlock}
    </div>
    <div class="p-actions">
      ${badge}
      <button class="toggle" data-sym="${esc(it.symbol)}">${open ? 'Minder' : 'Details'}</button>
    </div>
    ${open ? detail(it) : ''}`;
  return el;
}

function detail(it) {
  const cfg = data.config, cur = it.currency;
  const isUp = it.direction === 'up';
  const bt = it.backtest[isUp ? 'up' : 'down'];
  const hit = rate(bt.hits, bt.n), base = rate(bt.base_hits, bt.base_n);
  const drempel = isUp ? cfg.eval_rise_pct : cfg.drop_pct;
  let oordeel = '';
  if (hit != null && base != null && bt.n >= 5) oordeel = hit >= base + 10 ? ' Duidelijk beter dan toeval.' : hit > base ? ' Iets beter dan toeval.' : ' Niet beter dan toeval.';
  const btText = it.direction === 'flat'
    ? `Geen actief signaal. Historisch zakt deze koers in ${base ?? '–'}% van de periodes van ${cfg.horizon} dagen ≥${cfg.drop_pct}%.`
    : bt.n
      ? `Terugblik: <b>${bt.hits} van ${bt.n}</b> ${isUp ? 'koop' : 'verkoop'}signalen gaven ≥${drempel}% ${isUp ? 'stijging' : 'daling'} binnen ${cfg.horizon} dagen (<b>${hit}%</b>, zonder signaal ${base}%).${oordeel}`
      : 'Terugblik: dit signaal kwam de afgelopen twee jaar niet voor op deze koers.';
  const planText = (it.direction !== 'flat' && bt.plan_n)
    ? `<br>Plan: <b>${bt.wins} van ${bt.plan_n}</b> keer doel gehaald (winkans <b>${rate(bt.wins, bt.plan_n)}%</b>), ${bt.losses} keer vervallen (verlieskans ${rate(bt.losses, bt.plan_n)}%), gemiddeld ${pct(bt.ret_sum / bt.plan_n)} per signaal.`
    : '';

  const stop = it.plan ? (it.direction === 'down'
    ? `<div class="stopnote">Sluit de koers boven ${fmt(it.plan.stop, cur)}, dan is het dalingspatroon mislukt: ${it.watch ? 'wacht dan niet langer op ' + fmt(it.plan.target, cur) : 'koop dan terug in plaats van te wachten op ' + fmt(it.plan.target, cur)}.</div>`
    : `<div class="stopnote">Sluit de koers onder ${fmt(it.plan.stop, cur)}, dan is het stijgingspatroon mislukt: verkoop dan (stop-loss).</div>`) : '';

  const pats = it.patterns.filter(p => p.dir !== 'info');
  return `<div class="detail">
    <div>${spark(it)}</div>
    <div>
      ${stop}
      <div class="d-k">Gevonden patronen</div>
      <ul class="pat">${pats.map(p => `<li><span class="c-${p.dir}">${p.dir === 'up' ? '▲' : '▼'}</span><span>${esc(p.label)}${p.detail ? `<small>${esc(p.detail)}</small>` : ''}</span></li>`).join('') || '<li><span></span><span style="color:var(--muted)">Geen patronen gevonden</span></li>'}</ul>
      <div class="facts">
        <div class="p-block"><div class="k">Score</div><div class="v ${it.score > 0 ? 'up' : it.score < 0 ? 'down' : ''}">${it.score > 0 ? '+' : ''}${it.score}</div></div>
        <div class="p-block"><div class="k">RSI</div><div class="v">${it.rsi == null ? '–' : Math.round(it.rsi)}</div></div>
        <div class="p-block"><div class="k">Normaal ${cfg.horizon}d</div><div class="v">±${it.sigma_pct.toFixed(1).replace('.', ',')}%</div></div>
      </div>
      <p class="note">${btText}${planText}</p>
    </div>
  </div>`;
}

function spark(it) {
  const v = it.spark; if (!v || v.length < 2) return '';
  const lines = [];
  if (it.support != null) lines.push([it.support, 'var(--muted)', 'steun']);
  if (it.resistance != null) lines.push([it.resistance, 'var(--muted)', 'weerstand']);
  if (it.plan) {
    lines.push([it.plan.target, 'var(--accent)', 'doel']);
    lines.push([it.plan.stop, 'var(--warn)', 'plan vervalt']);
  }
  const all = v.concat(lines.map(l => l[0]));
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const W = 400, H = 130, X = i => (i / (v.length - 1)) * W, Y = x => H - ((x - lo) / (hi - lo)) * H;
  const path = v.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join('');
  const col = it.direction === 'down' ? 'var(--down)' : it.direction === 'up' ? 'var(--up)' : 'var(--text)';
  return `<div class="d-k">Koers laatste ${v.length} handelsdagen</div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Koersgrafiek">
      ${lines.map(([y, c]) => `<line x1="0" x2="${W}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`).join('')}
      <path d="${path}" fill="none" stroke="${col}" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>
    <div class="legend">${lines.map(([y, c, l]) => `<span style="color:${c}"><i></i>${l} ${fmt(y, it.currency)}</span>`).join('')}</div>`;
}

function errorCard(e) {
  const el = document.createElement('div');
  el.className = 'position';
  el.innerHTML = `
    <div class="p-name"><span class="p-ticker"><span class="exch-dot" data-exch="${exchangeKeyOf(e.symbol) || ''}"></span>${esc(e.label || e.name || e.symbol)}</span>
      <span class="p-company">(${esc(e.symbol)})${exchName(e.symbol)}</span></div>
    <div style="grid-column: span 4; font-size:12px; color:var(--muted); line-height:1.5">
      <span class="err">Geen signaal mogelijk.</span> ${/weinig/.test(e.error) ? 'Yahoo heeft te weinig koershistorie voor deze beursnotering (minimaal 60 handelsdagen nodig).' : 'Koersen konden niet worden opgehaald: ' + esc(e.error)}
    </div>
    <div class="p-actions"><span class="badge hold">geen data</span></div>`;
  return el;
}

function render() {
  if (!data) return;
  const scrollY = window.scrollY;
  const cfg = data.config;
  document.getElementById('sortSel').value = ui.sort;
  document.getElementById('catSel').value = ui.cat;
  document.getElementById('statusSel').value = ui.status;

  const items = data.items, errors = data.errors;
  const passes = it => {
    if (ui.cat !== 'all' && it.category !== ui.cat) return false;
    if (ui.status === 'flag' && !it.flag) return false;
    if ((ui.status === 'down' || ui.status === 'up') && !(it.flag && it.direction === ui.status)) return false;
    if (ui.status === 'flat' && it.flag) return false;
    return true;
  };
  const filtered = items.filter(passes);
  const errs = ui.status === 'all' ? errors.filter(e => ui.cat === 'all' || e.category === ui.cat) : [];
  const naam = it => (it.label || it.name || it.symbol).toLowerCase();
  const strength = it => (it.direction === 'flat' ? 0 : 1000) + Math.abs(it.score);

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  if (!filtered.length && !errs.length) {
    cards.innerHTML = `<div class="empty">Geen posities met dit filter. Kies bij Status "Alles" om alle posities te zien.</div>`;
  } else if (ui.sort === 'section') {
    const secs = [...new Set([...SECTION_ORDER, ...items.map(i => i.category), ...errors.map(e => e.category)])];
    secs.forEach(sec => {
      const inSec = filtered.filter(i => i.category === sec).sort((a, b) => strength(b) - strength(a) || naam(a).localeCompare(naam(b), 'nl'));
      const errSec = errs.filter(e => e.category === sec);
      if (!inSec.length && !errSec.length) return;
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = sec;
      cards.appendChild(h);
      inSec.forEach(i => cards.appendChild(card(i)));
      errSec.forEach(e => cards.appendChild(errorCard(e)));
    });
  } else {
    filtered.slice().sort((a, b) => {
      if (ui.sort === 'name') return naam(a).localeCompare(naam(b), 'nl');
      if (ui.sort === 'move') return Math.abs(b.projected_pct || 0) - Math.abs(a.projected_pct || 0);
      return strength(b) - strength(a);
    }).forEach(i => cards.appendChild(card(i)));
    errs.forEach(e => cards.appendChild(errorCard(e)));
  }

  const total = items.length + errors.length;
  const shown = filtered.length + errs.length;
  document.getElementById('tbCount').textContent = shown === total ? `${total} posities` : `${shown} van ${total} getoond`;

  const nDown = items.filter(i => i.flag && i.direction === 'down').length;
  const nUp = items.filter(i => i.flag && i.direction === 'up').length;
  const nFlat = items.length - nDown - nUp;
  const s = data.stats;
  const pn = s.down.plan_n + s.up.plan_n;
  const win = rate(s.down.wins + s.up.wins, pn), loss = rate(s.down.losses + s.up.losses, pn);
  const avg = pn ? (s.down.ret_sum + s.up.ret_sum) / pn : null;
  const summary = document.getElementById('summary');
  summary.innerHTML = `
    <div class="stat clickable ${ui.status === 'down' ? 'active' : ''}" data-status="down"><div class="label">Dalingen ≥${MOVE_MIN}%</div><div class="value" style="color:var(--down)">${nDown}</div><div class="sub">stocks met verwachte daling</div></div>
    <div class="stat clickable ${ui.status === 'up' ? 'active' : ''}" data-status="up"><div class="label">Stijgingen ≥${MOVE_MIN}%</div><div class="value" style="color:var(--up)">${nUp}</div><div class="sub">stocks met verwachte stijging</div></div>
    <div class="stat clickable ${ui.status === 'flat' ? 'active' : ''}" data-status="flat"><div class="label">Geen signaal</div><div class="value">${nFlat}</div><div class="sub">${errors.length ? errors.length + ' zonder data' : 'rustig'}</div></div>
    ${pn ? `<div class="stat"><div class="label">Winkans plan</div><div class="value" style="color:var(--up)">${win}%</div><div class="sub"><span style="color:var(--down)">verlieskans ${loss}%</span><br>gem. ${pct(avg)} per signaal</div></div>`
         : `<div class="stat"><div class="label">Winkans plan</div><div class="value">–</div><div class="sub">berekend bij de volgende run</div></div>`}`;
  summary.querySelectorAll('.stat.clickable').forEach(el => {
    el.onclick = () => { const st = el.dataset.status; ui.status = ui.status === st ? 'all' : st; saveUI(); render(); };
  });

  const d = new Date(data.generated);
  document.getElementById('updated').textContent = 'data van ' + d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  renderMarkets();
  window.scrollTo(0, scrollY);
}


// ---- Beursstatus: open/dicht per handelsplaats (zelfde regels als het portfolio) ----
let quotes = {};
const EXCHANGES = {
  XETRA:  { name: 'Xetra',              city: 'Frankfurt',  tz: 'Europe/Berlin',    open: [9, 0],  close: [17, 30] },
  DUS:    { name: 'Börse Düsseldorf',   city: 'Düsseldorf', tz: 'Europe/Berlin',    open: [8, 0],  close: [22, 0]  },
  AMS:    { name: 'Euronext Amsterdam', city: 'Amsterdam',  tz: 'Europe/Amsterdam', open: [9, 0],  close: [17, 30] },
  MIL:    { name: 'Borsa Italiana',     city: 'Milaan',     tz: 'Europe/Rome',      open: [9, 0],  close: [17, 30] },
  NYSE:   { name: 'NYSE',               city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  },
  NASDAQ: { name: 'NASDAQ',             city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  },
  US:     { name: 'VS-beurs',           city: 'New York',   tz: 'America/New_York', open: [9, 30], close: [16, 0]  }
};
const YAHOO_EXCHANGE = {
  GER: 'XETRA', DUS: 'DUS', AMS: 'AMS', MIL: 'MIL',
  NYQ: 'NYSE', ASE: 'NYSE', PCX: 'NYSE',
  NMS: 'NASDAQ', NGM: 'NASDAQ', NCM: 'NASDAQ', NAS: 'NASDAQ'
};
const SUFFIX_EXCHANGE = { DE: 'XETRA', DU: 'DUS', AS: 'AMS', MI: 'MIL' };

function exchangeKeyOf(ticker) {
  const q = quotes[ticker.toUpperCase()];
  if (q && q.exchange && YAHOO_EXCHANGE[q.exchange]) return YAHOO_EXCHANGE[q.exchange];
  const m = ticker.match(/\.([A-Z]+)$/);
  if (m) return SUFFIX_EXCHANGE[m[1]] || null;
  return 'US';
}
function exchName(ticker) {
  const k = exchangeKeyOf(ticker);
  return k && EXCHANGES[k] ? ' · ' + EXCHANGES[k].name : '';
}
function tzParts(date, tz) {
  const f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const o = {};
  f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute };
}
function tzDate(tz, y, m, d, h, mi) {
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const p = tzParts(new Date(guess), tz);
  const offset = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) - guess;
  return new Date(guess - offset);
}
function marketStatus(ex, now) {
  const p = tzParts(now, ex.tz);
  for (let k = 0; k < 8; k++) {
    const day = new Date(Date.UTC(p.y, p.m - 1, p.d + k));
    const wd = day.getUTCDay();
    if (wd === 0 || wd === 6) continue;
    const y = day.getUTCFullYear(), m = day.getUTCMonth() + 1, d = day.getUTCDate();
    const openAt = tzDate(ex.tz, y, m, d, ex.open[0], ex.open[1]);
    const closeAt = tzDate(ex.tz, y, m, d, ex.close[0], ex.close[1]);
    if (now >= openAt && now < closeAt) return { open: true, at: closeAt };
    if (now < openAt) return { open: false, at: openAt };
  }
  return { open: false, at: null };
}
function fmtMoment(date, now) {
  const tijd = date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  if (date.toDateString() === now.toDateString()) return tijd;
  const morgen = new Date(now); morgen.setDate(now.getDate() + 1);
  if (date.toDateString() === morgen.toDateString()) return 'morgen ' + tijd;
  return date.toLocaleDateString('nl-NL', { weekday: 'short' }) + ' ' + tijd;
}
function renderMarkets() {
  const box = document.getElementById('markets');
  if (!box || !data) return;
  const counts = {};
  data.items.concat(data.errors || []).forEach(it => {
    const key = exchangeKeyOf(it.symbol);
    if (key && EXCHANGES[key]) counts[key] = (counts[key] || 0) + 1;
  });
  const now = new Date();
  const status = {};
  Object.keys(EXCHANGES).forEach(k => { status[k] = marketStatus(EXCHANGES[k], now); });
  function lokaleTijden(ex) {
    const p = tzParts(now, ex.tz);
    const o = tzDate(ex.tz, p.y, p.m, p.d, ex.open[0], ex.open[1]);
    const c = tzDate(ex.tz, p.y, p.m, p.d, ex.close[0], ex.close[1]);
    const hm = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    return { openMin: o.getHours() * 60 + o.getMinutes(), closeMin: c.getHours() * 60 + c.getMinutes(), label: hm(o) + '–' + hm(c) };
  }
  const keys = Object.keys(counts).filter(k => EXCHANGES[k]);
  const tijden = {};
  keys.forEach(k => { tijden[k] = lokaleTijden(EXCHANGES[k]); });
  keys.sort((a, b) => tijden[a].openMin - tijden[b].openMin || tijden[a].closeMin - tijden[b].closeMin ||
    EXCHANGES[a].name.localeCompare(EXCHANGES[b].name));
  box.innerHTML = keys.map(key => {
    const ex = EXCHANGES[key], st = status[key];
    const tekst = st.open ? `<b>open</b> · sluit ${fmtMoment(st.at, now)}`
      : `<b>gesloten</b>${st.at ? ' · opent ' + fmtMoment(st.at, now) : ''}`;
    return `<div class="mkt ${st.open ? 'open' : 'closed'}">
      <div class="mkt-top"><span class="mkt-dot"></span><span class="mkt-name">${ex.name}</span></div>
      <div class="mkt-hours">${ex.city} · ${tijden[key].label}</div>
      <div class="mkt-state">${tekst}</div>
      <div class="mkt-foot">${counts[key]} ${counts[key] === 1 ? 'positie' : 'posities'}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.exch-dot').forEach(el => {
    const ex = EXCHANGES[el.dataset.exch];
    if (!ex) { el.className = 'exch-dot'; return; }
    const st = status[el.dataset.exch];
    el.className = 'exch-dot ' + (st.open ? 'open' : 'closed');
    el.title = `${ex.name}: ${st.open ? 'open, sluit ' : 'gesloten, opent '}${st.at ? fmtMoment(st.at, now) : ''}`;
  });
}
setInterval(renderMarkets, 60 * 1000);

document.addEventListener('click', e => {
  const t = e.target.closest('.toggle');
  if (!t) return;
  const sym = t.dataset.sym;
  ui.open = ui.open.includes(sym) ? ui.open.filter(x => x !== sym) : [...ui.open, sym];
  saveUI(); render();
});
document.getElementById('sortSel').onchange = e => { ui.sort = e.target.value; saveUI(); render(); };
document.getElementById('catSel').onchange = e => { ui.cat = e.target.value; saveUI(); render(); };
document.getElementById('statusSel').onchange = e => { ui.status = e.target.value; saveUI(); render(); };
document.getElementById('resetFilters').onclick = () => { ui.sort = 'section'; ui.cat = 'all'; ui.status = 'all'; saveUI(); render(); };

load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
