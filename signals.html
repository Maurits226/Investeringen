  };
  const filtered = items.filter(passes);
  const errs = (ui.status === 'all' || ui.status === 'flat') ? errors.filter(e => (ui.cat === 'all' || e.category === ui.cat) && inMkt(e)) : [];
  const naam = it => (it.label || it.name || it.symbol).toLowerCase();
  // eerst hoogste realisatie, daarna alfabetisch; zonder signaal achteraan
  const byReal = (a, b) => (realPct(b) ?? -Infinity) - (realPct(a) ?? -Infinity) || naam(a).localeCompare(naam(b), 'nl');

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  // Kaarten van één groep tonen; bij een lange lijst op een smal scherm de kaarten zonder signaal inkorten
  const kort = SMAL.matches && filtered.length + errs.length > LANG;
  const vul = (key, list, errList, max) => {
    const alles = !kort || ui.more.includes(key);
    let n = 0, weg = 0;
    list.forEach(i => {
      if (alles || i.flag || n < max || ui.open.includes(i.symbol)) { cards.appendChild(card(i)); if (!i.flag) n++; }
      else weg++;
    });
    errList.forEach(e => { if (alles || n < max) { cards.appendChild(errorCard(e)); n++; } else weg++; });
    if (!weg) return;
    const b = document.createElement('button');
    b.className = 'more-btn'; b.dataset.more = key;
    b.textContent = `Toon nog ${weg} ${NOUN(weg)} zonder signaal`;
    cards.appendChild(b);
  };
  if (!filtered.length && !errs.length) {
    const wat = { up: 'met een verwachte stijging ≥' + MOVE_MIN + '%', flat: 'zonder signaal', new: 'met een nieuw signaal sinds gisteren' }[ui.status] || '';
    const cat = ui.cat === 'Gold & Silver' ? 'edelmetalen' : ui.cat === 'Stocks' ? 'stocks' : ui.cat !== 'all' ? CFG.noun[1] + ' in ' + esc(ui.cat.toLowerCase()) : CFG.noun[1];
    const beurs = ui.mkt !== 'all' && EXCHANGES[ui.mkt] ? ' op ' + EXCHANGES[ui.mkt].name : '';
    cards.innerHTML = `<div class="empty">Op dit moment geen ${cat}${beurs} ${wat}.</div>`;
  } else if (ui.sort === 'section') {
    const secs = [...new Set([...SECTION_ORDER, ...items.map(i => i.category), ...errors.map(e => e.category)])];
    secs.forEach(sec => {
      const inSec = filtered.filter(i => i.category === sec).sort(byReal);
      const errSec = errs.filter(e => e.category === sec);
      if (!inSec.length && !errSec.length) return;
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = CAT_LABEL[sec] || sec;
      cards.appendChild(h);
      vul(sec, inSec, errSec, MAX_GROEP);
    });
  } else {
    vul('*', filtered.slice().sort((a, b) => {
      if (ui.sort === 'name') return naam(a).localeCompare(naam(b), 'nl');
      if (ui.sort === 'rank') return (a.rank || 999) - (b.rank || 999);
      if (ui.sort === 'result') return byReal(a, b);   // resultaat = realisatie hoog-laag, over alle categorieën
      if (ui.sort === 'move') return Math.abs(b.projected_pct || 0) - Math.abs(a.projected_pct || 0);
      return byReal(a, b);
    }), errs, MAX_LIJST);
  }

  const total = items.length + errors.length;
  const shown = filtered.length + errs.length;
  document.getElementById('tbCount').textContent = shown === total ? `${total} ${NOUN(total)}` : `${shown} van ${total} getoond`;

  const inCat = x => (ui.cat === 'all' || x.category === ui.cat) && inMkt(x);
  const catItems = items.filter(inCat), catErrors = errors.filter(inCat);
  const nUp = catItems.filter(i => i.flag && i.direction === 'up').length;
  const nFlat = catItems.length - nUp + catErrors.length;
  const nNew = catItems.filter(isNew).length;
  const s = data.stats;
  const summary = document.getElementById('summary');
  summary.innerHTML = `
    <div class="stat clickable ${ui.status === 'up' ? 'active' : ''}" data-status="up" role="button" tabindex="0" aria-pressed="${ui.status === 'up'}"><div class="label">Verwachte stijging</div><div class="value" style="color:var(--up)">${nUp}</div><div class="sub">${NOUN(2)} ${MOVE_MIN}% of meer omhoog</div></div>
    <div class="stat clickable ${ui.status === 'new' ? 'active' : ''}" data-status="new" role="button" tabindex="0" aria-pressed="${ui.status === 'new'}"><div class="label">Nieuw signaal</div><div class="value" style="color:var(--warn)">${nNew}</div><div class="sub">in de afgelopen handelsdag</div></div>
    <div class="stat clickable ${ui.status === 'flat' ? 'active' : ''}" data-status="flat" role="button" tabindex="0" aria-pressed="${ui.status === 'flat'}"><div class="label">Geen signaal</div><div class="value">${nFlat}</div><div class="sub">${catErrors.length ? catErrors.length + ' zonder data' : 'onder de ' + MOVE_MIN + '%'}</div></div>
`;
  summary.querySelectorAll('.stat.clickable').forEach(el => {
    el.onclick = () => { const st = el.dataset.status; ui.status = ui.status === st ? 'all' : st; saveUI(); render(); };
    // toetsenbord: Enter/spatie werkt als klik; de tegel wordt opnieuw opgebouwd, dus de focus terugzetten
    el.onkeydown = e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault(); el.onclick();
      const n = summary.querySelector(`[data-status="${el.dataset.status}"]`); if (n) n.focus();
    };
  });

  const d = new Date(data.generated);
  document.getElementById('updated').textContent = 'data van ' + d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  renderPinned();      // vóór renderMarkets: die kleurt ook de beurs-stip op de opgevolgde kaarten
  renderMarkets();
  renderWorld();
  window.scrollTo(0, scrollY);
}


// ---- Datums ----
function toDate(iso) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  return new Date(iso);
}
const dag = iso => iso ? toDate(iso).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }) : '–';
const dagTijd = iso => iso ? dag(iso) + ' ' + toDate(iso).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '–';
const numIn = n => n == null ? '' : n.toFixed(2).replace('.', ',');
function parsePrice(str) {
  if (str == null) return null;
  const v = parseFloat(String(str).replace(/[€\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
  return isFinite(v) && v > 0 ? v : null;
}

// ---- Geschiedenis van adviezen (uit signals.json, bijgehouden door de workflow) ----
const itemOf = sym => data && data.items.find(i => i.symbol === sym);
const activeEpisode = (sym, dir) => (data?.history || []).find(h => h.symbol === sym && !h.end && (!dir || h.dir === dir));
const episodeById = id => (data?.history || []).find(h => h.id === id);
const grensOf = (dir, target) => dir === 'up' ? target / (1 + MOVE_MIN / 100) : target / (1 - MOVE_MIN / 100);
// Instappen of niet: op basis van het advies zoals het gegeven is (vast doel), met de koers van nu.
function entryInfo(it) {
  const ep = activeEpisode(it.symbol);
  if (!ep || (it.flag && ep.dir !== it.direction)) {
    return it.flag && it.plan ? { kind: 'in', up: it.direction === 'up', grens: grensOf(it.direction, it.plan.target), ep: null } : null;
  }
  const up = ep.dir === 'up', grens = ep.instap_grens ?? grensOf(ep.dir, ep.plan.target);
  const base = { up, grens, ep };
  if (!it.flag) return null;      // signaal weg = advies vervallen: staat alleen nog in het archief
  if (up ? it.price > grens : it.price < grens) {
    // minder dan 5% over tot het doel: dit advies vervalt; de radar ziet nog ≥5%, dus er start een nieuw advies
    return { kind: 'in', up: it.direction === 'up', grens: grensOf(it.direction, it.plan.target), ep: null };
  }
  return { ...base, kind: 'in' };
}

// ---- Opgevolgde adviezen: lokaal bewaard én in radar.json op GitHub (zelfde token als Sync bij Investeringen) ----
const GH_OWNER = 'Maurits226', GH_REPO = 'Investeringen', GH_BRANCH = 'main', GH_TRADES_FILE = 'radar.json';
const TRADES_KEY = 'radar_trades';
let trades = (() => { try { const t = JSON.parse(localStorage.getItem(TRADES_KEY) || '[]'); return Array.isArray(t) ? t : []; } catch (e) { return []; } })();
let tradesSha = null, syncState = '', tradesPlain = false;
const saveTradesLocal = () => { try { localStorage.setItem(TRADES_KEY, JSON.stringify(trades)); } catch (e) {} };
// Andere pagina (bv. Vandaag) heeft nieuwere opgevolgde adviezen opgehaald: overnemen
window.addEventListener('storage', e => {
  if (e.key !== TRADES_KEY || !e.newValue) return;
  try { trades = mergeTrades(JSON.parse(e.newValue), trades); render(); } catch (err) {}
});
const ghToken = () => { try { return localStorage.getItem('gh_token') || ''; } catch (e) { return ''; } };
const openTrades = () => trades.filter(t => !t.deleted && t.status === 'open' && (t.set || 'investeringen') === SET);
const tradeFor = sym => openTrades().find(t => t.symbol === sym);

const mergeTrades = Shared.mergeTrades;   // shared.js: zelfde samenvoeging als Vandaag
async function fetchRemoteTrades() {
  const headers = { Accept: 'application/vnd.github+json' };
  if (ghToken()) headers.Authorization = 'Bearer ' + ghToken();
  const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_TRADES_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
  if (r.status === 404) { tradesSha = null; return []; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  tradesSha = j.sha;
  let parsed = JSON.parse(Vault.b64ToText(j.content));
  tradesPlain = !Vault.isLocked(parsed);
  if (!tradesPlain) {
    if (!ghToken()) throw new Error('versleuteld, geen token');
    parsed = await Vault.unlock(parsed, ghToken());      // gooit een fout bij een verkeerde token
  }
  return Array.isArray(parsed.trades) ? parsed.trades : [];
}
async function pushTrades() {
  // versleuteld opslaan (zie vault.js): alleen te lezen met jouw token
  const locked = await Vault.lock({ trades }, ghToken());
  const body = { message: 'Patroonradar: opgevolgde adviezen bijgewerkt (versleuteld)', content: Vault.textToB64(JSON.stringify(locked, null, 2)), branch: GH_BRANCH };
  if (tradesSha) body.sha = tradesSha;
  const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_TRADES_FILE}`, {
    method: 'PUT', body: JSON.stringify(body),
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + ghToken(), 'Content-Type': 'application/json' }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  tradesSha = (await r.json()).content.sha;
}
let syncBusy = false;
async function syncTrades() {
  if (DEMO || syncBusy) return;
  syncBusy = true;
  try {
    for (let poging = 0; poging < 2; poging++) {
      const remote = await fetchRemoteTrades();
      const merged = mergeTrades(remote, trades);
      const changed = JSON.stringify(merged) !== JSON.stringify(mergeTrades(remote, [])) || (tradesPlain && remote.length > 0);
      trades = merged; saveTradesLocal();
      if (!changed || !ghToken()) break;
      try { await pushTrades(); break; } catch (e) { if (poging) throw e; }   // tegelijk gewijzigd op ander apparaat: opnieuw
    }
    syncState = ghToken() ? 'ok' : 'local';
  } catch (e) { syncState = 'error'; }
  syncBusy = false;
  showSync(); render();
}
function showSync() {
  const el = document.getElementById('syncNote');
  const n = trades.some(t => !t.deleted);
  el.textContent = syncState === 'error' ? '☁ sync mislukt' : syncState === 'ok' && n ? '☁ gesynchroniseerd' : syncState === 'local' && n ? '☁ alleen op dit apparaat' : '';
  el.title = syncState === 'local' ? 'Stel Sync in op het tabblad Investeringen om opgevolgde adviezen op al je apparaten te zien' : '';
  el.style.color = syncState === 'error' ? 'var(--warn)' : '';
}
function touch(t) { t.updated = new Date().toISOString(); saveTradesLocal(); render(); syncTrades(); }

function followAdvice(sym) {
  const it = itemOf(sym);
  if (!it || !it.flag || !it.plan) return;
  const name = it.label || it.name || sym;
  const ans = prompt(`Tegen welke koers heb je ${name} ${it.direction === 'up' ? 'gekocht' : 'verkocht'}?`, numIn(it.price));
  if (ans === null) return;
  const px = parsePrice(ans);
  if (!px) { alert('Dat is geen geldige koers.'); return; }
  const ep = activeEpisode(sym, it.direction), now = new Date().toISOString();
  const t = { id: sym + '|' + now, set: SET, symbol: sym, name, dir: it.direction, date: now, price: px, currency: it.currency || 'EUR',
    plan: { target: it.plan.target, next: it.plan.next, stop: it.plan.stop }, episode: ep ? ep.id : null, status: 'open' };
  trades.push(t); touch(t);
}
function closeTrade(id) {
  const t = trades.find(x => x.id === id); if (!t) return;
  const it = itemOf(t.symbol);
  const ans = prompt(`Tegen welke koers heb je ${t.name} ${t.dir === 'up' ? 'verkocht' : 'teruggekocht'}?`, numIn(it ? it.price : t.price));
  if (ans === null) return;
  const px = parsePrice(ans);
  if (!px) { alert('Dat is geen geldige koers.'); return; }
  Object.assign(t, { status: 'closed', close_price: px, closed_at: new Date().toISOString() }); touch(t);
}
function deleteTrade(id) {
  const t = trades.find(x => x.id === id); if (!t) return;
  if (!confirm(`${t.name} verwijderen uit je opgevolgde adviezen? Gebruik "Afronden" als je de positie hebt gesloten.`)) return;
  t.deleted = true; touch(t);
}
const tradeResult = (t, px) => t.dir === 'up' ? (px / t.price - 1) * 100 : (1 - px / t.price) * 100;

function tradeState(t) {
  const it = itemOf(t.symbol), px = it ? it.price : null, up = t.dir === 'up', p = t.plan;
  const ep = t.episode ? episodeById(t.episode) : null;
  const naTrade = ep && ep.outcome_at && ep.outcome_at >= t.date.slice(0, 10);
  const doel = (px != null && (up ? px >= p.target : px <= p.target)) || (naTrade && ep.outcome === 'doel');
  const stop = !doel && ((px != null && (up ? px <= p.stop : px >= p.stop)) || (naTrade && ep.outcome === 'stop'));
  return { it, px, up, p, ep, naTrade, state: doel ? 'go' : stop ? 'stop' : 'wait' };
}

function tradeCard(t) {
  const { it, px, up, p, ep, naTrade, state } = tradeState(t), cur = t.currency;
  const res = px != null ? tradeResult(t, px) : null;
  const geraakt = naTrade && ep.outcome !== 'open' ? ` · geraakt op ${dag(ep.outcome_at)}` : '';
  const action = state === 'go'
    ? `<b class="c-up">Doel bereikt: ${up ? 'verkopen' : 'terugkopen'}</b><span class="sub">doel ${fmt(p.target, cur)}${geraakt} · daarna ${up ? 'terugkopen' : 'weer verkopen'} bij ${fmt(p.next, cur)}</span>`
    : state === 'stop'
      ? `<b class="c-down">Stop geraakt: ${up ? 'verkopen' : 'terugkopen'}</b><span class="sub">koers ${up ? 'onder' : 'boven'} ${fmt(p.stop, cur)}${geraakt} · ${up ? 'verlies beperken' : 'daling zette niet door'}</span>`
      : `<b>${up ? 'Vasthouden' : 'Wachten met terugkopen'}</b><span class="sub">${up ? 'verkopen' : 'terugkopen'} bij ${fmt(p.target, cur)} · stop ${fmt(p.stop, cur)}</span>`;
  const warn = it && it.flag && it.direction !== t.dir ? `<span class="t-warn">⚠ Radar geeft nu een ${it.direction === 'up' ? 'koop' : 'verkoop'}signaal</span>` : '';
  const pos = px == null ? null : Math.max(0, Math.min(1, (px - p.stop) / (p.target - p.stop)));
  const el = document.createElement('div');
  el.className = 'trade' + (state === 'go' ? ' go' : state === 'stop' ? ' stop' : '');
  el.innerHTML = `
    <div class="p-name t-name">
      <span class="p-ticker"><span class="exch-dot" data-exch="${exchangeKeyOf(t.symbol) || ''}"></span>${esc((it && (it.label || it.name)) || t.name)}</span>
      <span class="p-company">(${esc(t.symbol)}) · ${up ? 'gekocht' : 'verkocht'} ${dag(t.date)} à ${fmt(t.price, cur)}</span>
    </div>
    <div class="p-block"><div class="k">Koers nu</div><div class="v">${fmt(px, cur)}</div></div>
    <div class="p-block"><div class="k">${up ? 'Resultaat' : 'Voordeel'}</div>
      <div class="v ${res == null ? '' : res >= 0 ? 'up' : 'down'}">${res == null ? '–' : pct(res)}</div>
      <div class="drop-tag">${up ? 'sinds aankoop' : 't.o.v. je verkoop'}</div></div>
    <div class="t-action">${action}${warn}
      ${pos == null ? '' : `<div class="t-range"><span class="dot" style="left:${(pos * 100).toFixed(1)}%"></span></div>
      <div class="t-range-l"><span>stop ${fmt(p.stop, cur)}</span><span>doel ${fmt(p.target, cur)}</span></div>`}
    </div>
    <div class="t-btns">
      <button class="toggle" data-close="${esc(t.id)}" title="Positie gesloten: gaat naar het Archief">Afronden</button>
      <button class="toggle" data-del="${esc(t.id)}" title="Verwijderen">✕</button>
    </div>`;
  return el;
}

function renderPinned() {
  const el = document.getElementById('pinned');
  el.innerHTML = '';
  const rang = { go: 0, stop: 0, wait: 1 };
  const list = openTrades().sort((a, b) => rang[tradeState(a).state] - rang[tradeState(b).state] || b.date.localeCompare(a.date));
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'section-header';
  h.textContent = `Opgevolgd (${list.length})`;
  el.appendChild(h);
  list.forEach(t => el.appendChild(tradeCard(t)));
}

};
const YAHOO_EXCHANGE = {
  GER: 'XETRA', DUS: 'DUS', AMS: 'AMS', MIL: 'MIL',
  NYQ: 'NYSE', ASE: 'NYSE', PCX: 'NYSE',
  NMS: 'NASDAQ', NGM: 'NASDAQ', NCM: 'NASDAQ', NAS: 'NASDAQ'
};
const SUFFIX_EXCHANGE = { DE: 'XETRA', DU: 'DUS', AS: 'AMS', MI: 'MIL', F: 'FRA', PA: 'PAR', BR: 'BRU', MC: 'MCE', HE: 'HEL', IR: 'ISE', VI: 'VIE', LS: 'LIS' };

function exchangeKeyOf(ticker) {
  const q = quotes[ticker.toUpperCase()];
  if (q && q.exchange && YAHOO_EXCHANGE[q.exchange]) return YAHOO_EXCHANGE[q.exchange];
  const m = ticker.match(/\.([A-Z]+)$/);
  if (m) return SUFFIX_EXCHANGE[m[1]] || null;
  return 'US';
}
function exchName(ticker) {
  const k = exchangeKeyOf(ticker);
  return k && EXCHANGES[k] ? ' · ' + EXCHANGES[k].name : '';
}
function tzParts(date, tz) {
  const f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const o = {};
  f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute };
}
function tzDate(tz, y, m, d, h, mi) {
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const p = tzParts(new Date(guess), tz);
  const offset = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) - guess;
  return new Date(guess - offset);
}
function marketStatus(ex, now) {
  const p = tzParts(now, ex.tz);
  for (let k = 0; k < 8; k++) {
    const day = new Date(Date.UTC(p.y, p.m - 1, p.d + k));
    const wd = day.getUTCDay();
    if (wd === 0 || wd === 6) continue;
    const y = day.getUTCFullYear(), m = day.getUTCMonth() + 1, d = day.getUTCDate();
    const openAt = tzDate(ex.tz, y, m, d, ex.open[0], ex.open[1]);
    const closeAt = tzDate(ex.tz, y, m, d, ex.close[0], ex.close[1]);
    if (now >= openAt && now < closeAt) return { open: true, at: closeAt };
    if (now < openAt) return { open: false, at: openAt };
  }
  return { open: false, at: null };
}
function fmtMoment(date, now) {
  const tijd = date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  if (date.toDateString() === now.toDateString()) return tijd;
  const morgen = new Date(now); morgen.setDate(now.getDate() + 1);
  if (date.toDateString() === morgen.toDateString()) return 'morgen ' + tijd;
  return date.toLocaleDateString('nl-NL', { weekday: 'short' }) + ' ' + tijd;
}
function renderMarkets() {
  const box = document.getElementById('markets');
  if (!box || !data) return;
  const counts = {};
  data.items.concat(data.errors || []).forEach(it => {
    const key = exchangeKeyOf(it.symbol);
    if (key && EXCHANGES[key]) counts[key] = (counts[key] || 0) + 1;
  });
  const now = new Date();
  const status = {};
  Object.keys(EXCHANGES).forEach(k => { status[k] = marketStatus(EXCHANGES[k], now); });
  function lokaleTijden(ex) {
    const p = tzParts(now, ex.tz);
    const o = tzDate(ex.tz, p.y, p.m, p.d, ex.open[0], ex.open[1]);
    const c = tzDate(ex.tz, p.y, p.m, p.d, ex.close[0], ex.close[1]);
    const hm = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    return { openMin: o.getHours() * 60 + o.getMinutes(), closeMin: c.getHours() * 60 + c.getMinutes(), label: hm(o) + '–' + hm(c) };
  }
  const keys = Object.keys(counts).filter(k => EXCHANGES[k]);
  const tijden = {};
  keys.forEach(k => { tijden[k] = lokaleTijden(EXCHANGES[k]); });
  keys.sort((a, b) => tijden[a].openMin - tijden[b].openMin || tijden[a].closeMin - tijden[b].closeMin ||
    EXCHANGES[a].name.localeCompare(EXCHANGES[b].name));
  // Beurs-dropdown in de toolbar (alleen opnieuw opbouwen als de lijst verandert)
  const mktSel = document.getElementById('mktSel');
  const opts = keys.includes(ui.mkt) || ui.mkt === 'all' || !EXCHANGES[ui.mkt] ? keys : [...keys, ui.mkt];
  const sig = opts.join(',');
  if (mktSel && mktSel.dataset.sig !== sig) {
    mktSel.innerHTML = '<option value="all">Alle</option>' +
      opts.map(k => `<option value="${k}">${EXCHANGES[k].name}</option>`).join('');
    mktSel.dataset.sig = sig;
  }
  if (mktSel) mktSel.value = EXCHANGES[ui.mkt] ? ui.mkt : 'all';
  box.classList.toggle('filtering', ui.mkt !== 'all');

  box.innerHTML = keys.map(key => {
    const ex = EXCHANGES[key], st = status[key];
    const tekst = st.open ? `<b>open</b> · sluit ${fmtMoment(st.at, now)}`
      : `<b>gesloten</b>${st.at ? ' · opent ' + fmtMoment(st.at, now) : ''}`;
    const aan = ui.mkt === key;
    return `<div class="mkt ${st.open ? 'open' : 'closed'}${aan ? ' active' : ''}" data-mkt="${key}"
      role="button" tabindex="0" aria-pressed="${aan}"
      title="${aan ? 'Toon weer alle ' + CFG.noun[1] : 'Toon alleen ' + CFG.noun[1] + ' op ' + ex.name}">
      <div class="mkt-top"><span class="mkt-dot"></span><span class="mkt-name">${ex.name}</span></div>
      <div class="mkt-hours">${ex.city} · <span class="mkt-time">${tijden[key].label}</span></div>
      <div class="mkt-state">${tekst}</div>
      <div class="mkt-foot">${counts[key]} ${NOUN(counts[key])}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.exch-dot').forEach(el => {
    const ex = EXCHANGES[el.dataset.exch];
    if (!ex) { el.className = 'exch-dot'; return; }
    const st = status[el.dataset.exch];
    el.className = 'exch-dot ' + (st.open ? 'open' : 'closed');
    el.title = `${ex.name}: ${st.open ? 'open, sluit ' : 'gesloten, opent '}${st.at ? fmtMoment(st.at, now) : ''}`;
  });
}
setInterval(renderMarkets, 60 * 1000);

// Klik op een beurs = alleen posities van die beurs (nog eens klikken = weer alles)
function toggleMarket(key) {
  ui.mkt = ui.mkt === key ? 'all' : key;
  saveUI(); render();
  const tb = document.querySelector('.toolbar');
  if (ui.mkt !== 'all' && tb && tb.getBoundingClientRect().top > window.innerHeight - 140) {
    tb.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
(function () {
  const box = document.getElementById('markets');
  box.addEventListener('click', e => { const el = e.target.closest('.mkt'); if (el) toggleMarket(el.dataset.mkt); });
  box.addEventListener('keydown', e => {
    const el = e.target.closest('.mkt');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleMarket(el.dataset.mkt); }
  });
})();

document.addEventListener('click', e => {
  const t = e.target.closest('.toggle[data-sym]');
  if (!t) return;
  const sym = t.dataset.sym;
  ui.open = ui.open.includes(sym) ? ui.open.filter(x => x !== sym) : [...ui.open, sym];
  saveUI(); render();
});
// 'Toon nog … zonder signaal': die groep voortaan helemaal tonen (render houdt de scrollpositie vast)
document.addEventListener('click', e => {
  const b = e.target.closest('.more-btn[data-more]');
  if (!b) return;
  ui.more = [...ui.more, b.dataset.more]; saveUI(); render();
});
SMAL.addEventListener('change', () => render());   // draaien of venster breder/smaller: lijst opnieuw inkorten of voluit
document.getElementById('sortSel').onchange = e => { ui.sort = e.target.value; saveUI(); render(); };
document.getElementById('catSel').onchange = e => { ui.cat = e.target.value; saveUI(); render(); };
document.getElementById('statusSel').onchange = e => { ui.status = e.target.value; saveUI(); render(); };
document.getElementById('mktSel').onchange = e => { ui.mkt = e.target.value; saveUI(); render(); };
document.getElementById('resetFilters').onclick = () => { ui.sort = 'section'; ui.cat = 'all'; ui.status = 'all'; ui.mkt = 'all'; saveUI(); render(); };

document.getElementById('pageTitle').textContent = CFG.title;
document.getElementById('pageSub').textContent = CFG.sub;
if (SET === 'top250') {
  const o = document.createElement('option'); o.value = 'rank'; o.textContent = 'Plaats in kansenlijst (hoog → laag)';
  document.getElementById('sortSel').insertBefore(o, document.querySelector('#sortSel option[value="name"]'));
  document.querySelector('#sortSel option[value="section"]').textContent = 'Sector';
  document.querySelector('#catSel').previousElementSibling.textContent = 'Sector';
}
document.getElementById('sortSel').value = ui.sort;
load().then(syncTrades);
setInterval(load, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); syncTrades(); } });
</script>
</body>
