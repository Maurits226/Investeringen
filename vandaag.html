<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style id="af">html{display:none}</style>
<script src="antiframe.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="preload" href="fonts/SpaceGrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vandaag</title>
<style>
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --up: #3ecf8e; --down: #f0595f;
    --warn: #f5b544; --accent: #4f8ff0; --violet: #a78bfa; --gold: #c9a45c;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1100px 520px at 85% -12%, #1e2430 0%, transparent 60%), var(--ink);
    color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; min-height: 100vh; padding: 28px 18px 60px;
  }
  /* één kolom: rustig lezen van boven naar beneden */
  .wrap { max-width: 860px; margin: 0 auto; }
  header.top { margin-bottom: 18px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .date { color: var(--muted); font-size: 13px; margin-top: 5px; line-height: 1.4; }
  .date .old { color: var(--warn); }

  /* drie kerngetallen */
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0;
         text-align: left; color: inherit; font: inherit; cursor: pointer; transition: border-color .15s;
         display: flex; flex-direction: column; justify-content: flex-start; }   /* knop: inhoud bovenaan, labels op één lijn */
  @media (hover: hover) { .kpi:hover { border-color: #3d4045; } }
  .kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .kpi .v { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 5px; line-height: 1.15; }
  .kpi .v.w { font-family: inherit; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  .kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .c-up { color: var(--up); } .c-down { color: var(--down); } .c-warn { color: var(--warn); }
  #techwarn:empty { display: none; }
  #techwarn .tw-ban { margin-bottom: 0; }

  /* te doen: per groep een blok, regels zonder poespas */
  .todo-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 24px 2px 10px; }
  .todo-h h2 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .todo-h span { font-size: 12.5px; color: var(--muted); }
  .grp { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; --mark: var(--accent); }
  .grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px 9px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .grp-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--mark); flex-shrink: 0; }
  .grp-h em { font-style: normal; margin-left: auto; text-transform: none; letter-spacing: 0; }
  .g-kopen { --mark: var(--up); } .g-winst { --mark: var(--warn); } .g-beoordelen { --mark: var(--gold); }
  .g-radar { --mark: var(--accent); } .g-opgevolgd { --mark: var(--violet); } .g-agenda { --mark: var(--muted); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 10px 14px;
         border-top: 1px solid var(--line); cursor: pointer; min-height: 52px; }
  @media (hover: hover) { .row:hover { background: var(--panel-2); } }
  .r-t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-s { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .r-v { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .more { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: var(--accent);
          font: inherit; font-size: 12.5px; padding: 10px 14px; min-height: 42px; cursor: pointer; }
  @media (hover: hover) { .more:hover { background: var(--panel-2); } }
  .none { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .none b { color: var(--text); font-weight: 600; }
  .row:focus-visible, .kpi:focus-visible, .more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .foot { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  @media (max-width: 560px) {
    body { padding: 18px 12px 40px; }
    h1 { font-size: 22px; }
    .kpis { gap: 8px; }
    .kpi { padding: 10px 10px 9px; }
    .kpi .l { font-size: 10.5px; letter-spacing: .5px; }
    .kpi .v { font-size: 19px; } .kpi .v.w { font-size: 16px; }
    .kpi .s { font-size: 11.5px; }
    .row { padding: 10px 12px; } .grp-h { padding-left: 12px; padding-right: 12px; } .more { padding-left: 12px; }
    .r-t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="hello">Vandaag</h1><div class="date" id="date"></div></header>
  <div class="kpis" id="kpis"></div>
  <div id="techwarn"></div>
  <div class="todo-h"><h2>Te doen vandaag</h2><span id="todoCount"></span></div>
  <div id="todo"><div class="none">Laden…</div></div>
  <p class="foot">Tik op een regel om naar het bijbehorende scherm te gaan. Hulpmiddel, geen beleggingsadvies.</p>
</div>

<script src="vault.js"></script>
<script src="shared.js"></script>
<script src="steps.js"></script>
<script src="techwarn.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null || v === '' || !isFinite(+v) ? '—' : (+v).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : '') + nf(v, d) + '%';
const cls = v => v == null ? '' : v > 0 ? 'c-up' : v < 0 ? 'c-down' : '';

// Naar een ander scherm van het dashboard (de pagina staat in een iframe van index.html)
function go(hash) {
  try { if (window.top !== window) { window.top.location.hash = hash; return; } } catch (e) {}
  location.href = 'index.html#' + hash;
}

async function getJSON(u) {
  try { const r = await fetch(u, { cache: 'no-cache' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

// Posities en state: zelfde bron als alle andere pagina's (shared.js)
const loadPositions = Shared.positions;

// Zelfde regels als het Overzicht (shared.js): slimme koopdrempel en winstnemingstrap
const thresholdFor = Shared.thresholdFor;

function newCutoff() {
  const c = new Date(Date.now() - 24 * 3600 * 1000);
  while (c.getDay() === 0 || c.getDay() === 6) c.setDate(c.getDate() - 1);
  return c;
}
function ageTxt(iso) {
  if (!iso) return { t: 'onbekend', min: Infinity };
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  return { t: m < 60 ? Math.round(m) + ' min' : m < 48 * 60 ? Math.round(m / 60) + ' uur' : Math.round(m / 1440) + ' dagen', min: m };
}
// Bedrijfsnaam zonder rechtsvorm: 'Advanced Micro Devices, Inc.' → 'Advanced Micro Devices'
const LEGAL = /[,\s]+(inc\.?|incorporated|corp\.?|corporation|co\.?|company|n\.?v\.?|s\.?a\.?|se|ag|plc|ltd\.?|limited|holdings?|group)$/i;
function short(n) { let s = String(n || '').trim(); for (let i = 0; i < 3 && LEGAL.test(s); i++) s = s.replace(LEGAL, '').trim(); return s || String(n || ''); }
const dShort = iso => new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
const list = (xs, n = 3) => xs.slice(0, n).join(', ') + (xs.length > n ? ` +${xs.length - n}` : '');

// Te doen: per groep een blok met hooguit 3 regels; de rest klap je hier open (blijft open bij verversen)
const GROUPS = [['Kopen', 'kopen'], ['Winst nemen', 'winst'], ['Beoordelen', 'beoordelen'], ['Radar', 'radar'], ['Opgevolgd', 'opgevolgd'], ['Agenda', 'agenda']];
const SHOW = 3;
const opened = new Set();
let twOpen = false, todo = [];
const row = t => `<div class="row" role="button" tabindex="0" data-go="${esc(t.go)}"${t.tip ? ` title="${esc(t.tip)}"` : ''}>
    <div class="r-m"><div class="r-t">${esc(t.title)}</div><div class="r-s">${t.subHTML ? t.sub : esc(t.sub)}</div></div><div class="r-v">${t.val}</div></div>`;
function drawTodo() {
  $('todoCount').textContent = todo.length ? `${todo.length} ${todo.length === 1 ? 'punt' : 'punten'}` : '';
  $('todo').innerHTML = todo.length ? GROUPS.map(([g, key]) => {
    const xs = todo.filter(t => t.g === g).sort((a, b) => a.prio - b.prio || (a.ord || 0) - (b.ord || 0));
    if (!xs.length) return '';
    const all = opened.has(g) || xs.length <= SHOW + 1;             // één verborgen regel tonen we gewoon
    return `<section class="grp g-${key}"><div class="grp-h"><i></i>${esc(g)}<em>${xs.length}</em></div>
      ${(all ? xs : xs.slice(0, SHOW)).map(row).join('')}
      ${xs.length > SHOW + 1 ? `<button type="button" class="more" data-grp="${esc(g)}">${opened.has(g) ? 'minder tonen' : `nog ${xs.length - SHOW} tonen`}</button>` : ''}</section>`;
  }).join('') : '<div class="none"><b>Niets te doen vandaag.</b><br>Geen koopsignalen, winstnemingen, beoordelingen, nieuwe adviezen of cijfers.</div>';
}

async function render() {
  const [data, sig, scr, pos, trades, tech, these] = await Promise.all([getJSON('data.json'), getJSON('signals.json'), getJSON('screener.json'), loadPositions(), Shared.loadTrades(), getJSON('tech.json'), Shared.loadThese()]);
  // de Top 250-radar (1,2 MB) alleen als je een Top 250-advies opvolgt: daar komt dan de actuele koers vandaan
  const sigTop = (trades || []).some(t => t && !t.deleted && t.status === 'open' && t.set === 'top250') ? await getJSON('signals_top250.json') : null;
  const idx = Shared.stockIndex(scr, sig, data);
  const quotes = (data && data.quotes) || {};
  const q = t => quotes[(t || '').toUpperCase()];
  const now = new Date();
  const h = now.getHours();
  $('hello').textContent = (h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond') + ', Maurits';
  // Datum en versheid in één regel; alleen als iets echt achterloopt (een halve dag) valt het op
  const fresh = ageTxt(data && data.updated);
  const old = [['koersen', data && data.updated], ['radar', sig && sig.generated], ['kansen', scr && scr.updated]]
    .map(([k, iso]) => [k, ageTxt(iso)]).filter(([, a]) => a.min > 12 * 60).map(([k, a]) => a.min === Infinity ? `${k} ontbreekt` : `${k} ${a.t} oud`);
  $('date').innerHTML = esc(now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }))
    + ` · bijgewerkt ${esc(fresh.t)} geleden` + (old.length ? ` · <span class="old">${esc(old.join(', '))}</span>` : '');

  // Posities met koers
  const held = pos.filter(p => !p.watch && p.cost != null).map(p => ({ p, q: q(p.ticker) })).filter(x => x.q && x.q.price);
  const val = x => x.q.price * (x.p.qty || 1);
  const totV = held.reduce((a, x) => a + val(x), 0);
  const dayOf = x => x.q.prevClose ? (x.q.price / x.q.prevClose - 1) * 100 : 0;
  const dayPct = totV ? held.reduce((a, x) => a + val(x) * dayOf(x), 0) / totV : null;
  const costSum = held.reduce((a, x) => a + x.p.cost * (x.p.qty || 1), 0);
  const plPct = costSum ? (held.reduce((a, x) => a + (x.q.price - x.p.cost) * (x.p.qty || 1), 0) / costSum) * 100 : null;
  const upN = held.filter(x => dayOf(x) > 0).length, downN = held.filter(x => dayOf(x) < 0).length;
  const nm = x => short(x.q.name || x.p.ticker);

  // Beursklimaat vandaag en deze week (zelfde regels als de Patroonradar)
  const reg = (sig && sig.world && sig.world.regime) || {};
  const REG = { calm: ['c-up', 'Rustig & stijgend'], neutral: ['c-warn', 'Neutraal'], off: ['c-down', 'Risico-uit'] }[reg.state] || ['', '—'];
  const horizon = (sig && sig.config && sig.config.horizon) || 10;
  let sw = 0, sm = 0;
  ((sig && sig.items) || []).forEach(it => {
    if (it.category === 'Gold & Silver') return;
    const p = pos.find(x => x.ticker.toUpperCase() === it.symbol.toUpperCase());
    const w = (it.price || 1) * ((p && p.qty) || 1);
    sw += w; sm += w * (it.projected_pct != null ? it.projected_pct * 5 / horizon : 0);
  });
  const wk = sw ? sm / sw : null;
  const week = wk == null ? '—' : wk >= 0.5 ? 'positief' : wk <= -0.5 ? 'negatief' : 'neutraal';

  $('kpis').innerHTML = `
    <button class="kpi" onclick="go('investeringen')"><div class="l">Vandaag</div>
      <div class="v ${cls(dayPct)}">${pct(dayPct, 2)}</div>
      <div class="s">${held.length ? `${upN}&nbsp;omhoog · ${downN}&nbsp;omlaag` : 'geen aankoopprijzen op dit apparaat'}</div></button>
    <button class="kpi" onclick="go('investeringen')"><div class="l">Sinds aankoop</div>
      <div class="v ${cls(plPct)}">${pct(plPct)}</div>
      <div class="s">${held.length} posities</div></button>
    <button class="kpi" onclick="go('patroonradar')"><div class="l">Beursklimaat</div>
      <div class="v w ${REG[0]}">${esc(REG[1])}</div>
      <div class="s">deze&nbsp;week ${esc(week)}${wk == null ? '' : `&nbsp;(${pct(wk)})`}</div></button>`;

  // Techradar: één regel (niveau en hoeveel van je portefeuille in tech zit); uitleg en tips pas na openklappen
  if (typeof TechWarn !== 'undefined') {
    TechWarn.css();
    const exposure = Shared.techExposure(held.map(x => ({ p: x.p, value: val(x) })), idx.find);
    $('techwarn').innerHTML = tech ? TechWarn.banner(tech, exposure, { compact: true, open: twOpen }) : '';
    const d = $('techwarn').querySelector('details');
    if (d) d.addEventListener('toggle', () => { twOpen = d.open; });
  }

  // ── Te doen
  todo = [];
  // 1. Koopsignalen (incl. watchlist); met een dalende trend achteraan
  pos.forEach(p => {
    const qq = q(p.ticker); if (!qq || !qq.high52 || !qq.price) return;
    const drop = (qq.high52 - qq.price) / qq.high52 * 100, thr = thresholdFor(p, qq);
    if (drop >= thr) {
      const trend = qq.sma200 ? qq.price > qq.sma200 : null;
      todo.push({ g: 'Kopen', title: short(qq.name || p.ticker), tip: `drempel ${thr}% onder de top`,
        sub: `${nf(drop, 0)}% onder de top${trend === false ? ' · <span class="c-warn">dalende trend</span>' : trend ? ' · stijgende trend' : ''}`, subHTML: true,
        val: `<span class="c-up">${p.watch ? 'watchlist' : 'bijkopen'}</span>`, go: 'investeringen', prio: trend === false ? 2 : 1, ord: -drop });
    }
  });
  // 2. Winstnemingstrap (zelfde regel als de knop "Realiseer" op het tabblad Investeringen)
  held.forEach(x => {
    const pl = (x.q.price / x.p.cost - 1) * 100;
    const s = Shared.sellStatus(x.p.sells, pl, x.q.price, x.q.wk);
    if (!s.canRealise) return;
    todo.push({ g: 'Winst nemen', title: nm(x),
      sub: `+${s.nextTargetPct}% ${s.isHeropend ? 'opnieuw bereikt na een daling van 25%' : 'bereikt'} · resultaat ${pct(pl, 0)}`,
      val: `<span class="c-warn">${s.nextSellPct}% verkopen</span>`, go: 'investeringen', prio: 1 });
  });
  // Oude verkopen zonder vastgelegde verkoopkoers: zonder koers kan die trede niet weer opengaan na een daling van 25%
  const noPrice = held.filter(x => (x.p.sells || []).some(v => v && !(v.price > 0)));
  if (noPrice.length) todo.push({ g: 'Winst nemen', title: 'Verkoopkoers invullen', sub: `${list(noPrice.map(nm))} · nodig voor de 25%-regel`,
    val: '<span class="c-warn">invullen</span>', go: 'investeringen', prio: 3 });
  // 3. Beoordeling (12 stappen): these-alarm en these herzien per aandeel; nieuwe kwartaalcijfers en de kwartaalcheck
  //    elk samen in één regel (these.json, zelfde regels als Beoordeling via shared.js)
  const stocks = pos.filter(p => !p.watch && p.section === 'Stocks');
  const earned = [], due = [];
  const today = new Date().toISOString().slice(0, 10);
  stocks.forEach(p => {
    const it = idx.find(p.ticker), v = Steps.verdict(it), name = short((it && it.name) || p.label || p.ticker);
    const al = Shared.theseAlerts(it, (these && it && these.stocks[it.sym]) || null, p.review, today);
    const alarm = al.filter(a => a.kind === 'drop' || a.kind === 'newfail');
    if (alarm.length) todo.push({ g: 'Beoordelen', title: `These-alarm: ${name}`, sub: alarm.map(a => a.text).join(' · '),
      val: `<span class="${alarm[0].sev >= 3 ? 'c-down' : 'c-warn'}">alarm</span>`, go: 'beoordeling', prio: 0 });
    if (v.cls === 'v-bad') todo.push({ g: 'Beoordelen', title: `These herzien: ${name}`, sub: v.text.split('. ')[0] + '.',
      val: '<span class="c-down">herzien</span>', go: 'beoordeling', prio: 2 });
    const earn = al.find(a => a.kind === 'earn');
    if (earn) earned.push({ name, since: earn.since });
    if (al.some(a => a.kind === 'due')) due.push(name);
  });
  if (earned.length) {
    earned.sort((a, b) => String(b.since).localeCompare(String(a.since)));
    todo.push({ g: 'Beoordelen', title: `Kwartaalcijfers lezen (${earned.length})`, sub: list(earned.map(e => `${e.name} (${dShort(e.since)})`)),
      val: '', go: 'beoordeling', prio: 1 });
  }
  if (due.length) todo.push({ g: 'Beoordelen', title: `Kwartaalcheck (${due.length})`, sub: `${list(due)} · al 100 dagen niet gecheckt`,
    val: '', go: 'beoordeling', prio: 3 });
  // 4. Nieuwe radaradviezen (afgelopen handelsdag)
  const cut = newCutoff();
  ((sig && sig.history) || []).filter(e => e.dir === 'up' && !e.end && !e.bootstrap && e.start && new Date(e.start) >= cut).forEach(e => {
    todo.push({ g: 'Radar', title: `Koopadvies ${short(e.name || e.symbol)}`, sub: `nieuw signaal · verwacht ${pct(e.projected_pct)} in ${horizon} dagen`,
      val: '<span class="c-up">kopen</span>', go: 'patroonradar', prio: 1 });
  });
  // 5. Opgevolgde adviezen
  (trades || []).filter(t => t && !t.deleted && t.status === 'open').forEach(t => {
    const it = ((sig && sig.items) || []).concat((sigTop && sigTop.items) || []).find(i => i.symbol === t.symbol);
    const px = it && it.price, res = px && t.price ? (t.dir === 'up' ? px / t.price - 1 : 1 - px / t.price) * 100 : null;
    todo.push({ g: 'Opgevolgd', title: short(t.name || t.symbol), sub: `${t.dir === 'up' ? 'koopadvies' : 'verkoopadvies'}${t.plan && t.plan.target ? ' · doel ' + nf(t.plan.target, 2) : ''}`,
      val: `<span class="${cls(res)}">${pct(res)}</span>`, go: (t.set === 'top250' ? 'top250-radar' : 'patroonradar'), prio: 3 });
  });
  // 6. Kwartaalcijfers binnen 7 dagen: één regel, de eerstvolgende voorop
  const soon = [];
  ((sig && sig.items) || []).forEach(it => {
    const e = it.context && it.context.earnings;
    if (e && e.days != null && e.days >= 0 && e.days <= 7) soon.push({ n: short(it.label || it.name || it.symbol), d: e.days, date: e.date });
  });
  if (soon.length) {
    soon.sort((a, b) => a.d - b.d || a.n.localeCompare(b.n));
    const when = x => x.d === 0 ? 'vandaag' : x.d === 1 ? 'morgen' : x.date ? dShort(x.date) : `over ${x.d} d`;
    todo.push({ g: 'Agenda', title: `Kwartaalcijfers deze week (${soon.length})`, sub: list(soon.map(x => `${x.n} (${when(x)})`), 4),
      val: '', go: 'patroonradar', prio: 4 });
  }

  drawTodo();
}

// Een regel opent het bijbehorende scherm; 'nog N tonen' klapt de groep hier open
$('todo').addEventListener('click', e => {
  const m = e.target.closest('.more');
  if (m) { const g = m.dataset.grp; opened.has(g) ? opened.delete(g) : opened.add(g); drawTodo(); return; }
  const r = e.target.closest('.row');
  if (r) go(r.dataset.go);
});

// Rijen zijn div's met role="button": Enter en spatie werken zoals een klik
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button') { e.preventDefault(); el.click(); }
});

render();
setInterval(render, 5 * 60 * 1000);
Shared.onRefresh(render);   // andere pagina wijzigt iets, of je komt terug op dit tabblad: meteen bijwerken
</script>
</body>
</html>
