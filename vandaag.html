<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style id="af">html{display:none}</style>
<script src="antiframe.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="preload" href="fonts/SpaceGrotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vandaag</title>
<style>
  :root {
    --ink: #141517; --panel: #1a1c1e; --panel-2: #202224; --line: #2a2c2f;
    --muted: #83888d; --text: #eceef0; --up: #3ecf8e; --down: #f0595f;
    --warn: #f5b544; --accent: #4f8ff0; --violet: #a78bfa;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1100px 520px at 85% -12%, #1e2430 0%, transparent 60%), var(--ink);
    color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; min-height: 100vh; padding: 28px 18px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.6px; }
  .date { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-family: var(--mono); color: var(--muted); border: 1px solid var(--line); background: var(--panel);
          padding: 5px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .chip.warn i { background: var(--warn); } .chip.bad i { background: var(--down); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card {
    position: relative; overflow: hidden; border-radius: 14px; padding: 15px 17px 13px;
    background: linear-gradient(180deg, var(--panel), var(--ink)); border: 1px solid var(--line);
    --mark: var(--accent); --tone: var(--muted); cursor: pointer; transition: border-color .15s, transform .15s; text-align: left; color: inherit; font: inherit;
  }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--mark); }
  .card::after { content: ''; position: absolute; right: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%;
                 background: radial-gradient(circle, color-mix(in srgb, var(--tone) 15%, transparent), transparent 70%); pointer-events: none; }
  @media (hover: hover) { .card:hover { border-color: var(--mark); transform: translateY(-2px); } }   /* op touch blijft :hover hangen na een tik */
  .card.good { --tone: var(--up); } .card.bad { --tone: var(--down); } .card.mid { --tone: var(--warn); }
  .card.v { --mark: var(--violet); } .card.g { --mark: var(--up); } .card.o { --mark: var(--warn); }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); display: flex; align-items: flex-start; gap: 7px; }
  .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); flex: none; margin-top: .3em; }
  .big { font-family: var(--mono); font-size: 26px; font-weight: 600; margin-top: 8px; color: var(--tone); }
  .word { font-size: 21px; font-weight: 700; letter-spacing: -.3px; margin-top: 8px; color: var(--tone); }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--mono); line-height: 1.45; }
  .sub b { color: var(--text); font-weight: 500; }

  .cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; margin-bottom: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 10px; }
  .p-head h2 { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .p-head span { font-size: 11.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .todo { display: flex; flex-direction: column; gap: 6px; }
  .t { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px;
       background: var(--panel-2); border: 1px solid transparent; cursor: pointer; transition: border-color .15s; }
  @media (hover: hover) { .t:hover { border-color: var(--line); } }
  .card:focus-visible, .t:focus-visible, .kans:focus-visible, .brc:focus-visible, .t-more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .t .ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: rgba(79,143,240,.12); }
  .t.buy .ic { background: rgba(62,207,142,.14); } .t.sell .ic { background: rgba(245,181,68,.14); }
  .t.sig .ic { background: rgba(79,143,240,.14); } .t.earn .ic { background: rgba(167,139,250,.16); } .t.trade .ic { background: rgba(240,89,95,.12); }
  .t.rev .ic { background: rgba(201,164,92,.16); }
  .t-main { min-width: 0; }
  .t-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }   /* mag afbreken: anders valt de uitleg weg */
  .t-val { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .empty { font-size: 13px; color: var(--muted); padding: 18px 8px; text-align: center; }
  .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); margin: 8px 2px 2px; }
  .kans-h { display: flex; justify-content: space-between; gap: 10px; padding: 0 4px 6px; border-bottom: 1px dashed #26282b;
            font-size: 11px; color: var(--muted); font-family: var(--mono); }   /* zegt op touch wat de getallen zijn (title werkt daar niet) */
  .kans { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px dashed #26282b; cursor: pointer; }
  .kans:last-child { border-bottom: 0; }
  .sc { display: flex; }   /* scorecard-ring uit steps.js, dezelfde als in Kansen portefeuille */
  .brs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .brc { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; cursor: pointer; background: var(--panel-2); }
  .brc b { display: block; font-size: 12.5px; }
  .brc small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .c-up { color: var(--up); } .c-down { color: var(--down); } .c-warn { color: var(--warn); }
  .foot { font-size: 11px; color: var(--muted); margin-top: 18px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .cols { grid-template-columns: 1fr; } }
  /* kaarten zijn knoppen: inhoud bovenaan, zodat labels en getallen in een rij gelijk staan */
  .kpis > .card { display: flex; flex-direction: column; justify-content: flex-start; }
  .t-more { font-size: 12px; color: var(--accent); padding: 8px 10px; cursor: pointer; min-height: 40px; display: flex; align-items: center; }
  @media (max-width: 480px) {
    .t-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
    .t { gap: 8px; padding: 9px 8px; } .t-val { font-size: 12px; }
    .status { gap: 6px; } .chip { padding: 5px 8px; gap: 5px; }
  }
  @media (max-width: 480px) { body { padding: 18px 12px 40px; } h1 { font-size: 23px; } .big { font-size: 22px; } .word { font-size: 18px; } }
  /* smalle telefoon: 2 kaarten naast elkaar houden labels op 2 regels en sublines korter */
  @media (max-width: 360px) { .card { padding: 13px 12px 11px; } .k { letter-spacing: .5px; } .sub { font-size: 11px; } .t-title { -webkit-line-clamp: 3; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="hello">Vandaag</h1><div class="date" id="date"></div></div>
    <div class="status" id="status"></div>
  </header>
  <div id="techwarn"></div>
  <div class="kpis" id="kpis"></div>
  <div class="cols">
    <div class="panel"><div class="p-head"><h2>Te doen vandaag</h2><span id="todoCount"></span></div><div class="todo" id="todo"><div class="empty">Laden…</div></div></div>
    <div class="panel"><div class="p-head"><h2>Kansen van de dag</h2><span>Kansen portefeuille</span></div><div id="kansen"><div class="empty">Laden…</div></div></div>
  </div>
  <p class="foot">Klik op een onderdeel om naar het bijbehorende scherm te gaan. Dit overzicht is een hulpmiddel, geen beleggingsadvies.</p>
</div>

<script src="vault.js"></script>
<script src="shared.js"></script>
<script src="steps.js"></script>
<script src="techwarn.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 1) => v == null || v === '' || !isFinite(+v) ? '—' : (+v).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : '') + nf(v, d) + '%';
const cls = v => v == null ? '' : v > 0 ? 'c-up' : v < 0 ? 'c-down' : '';
Steps.css();
const tone = v => v == null ? '' : v >= 0.5 ? 'good' : v <= -0.5 ? 'bad' : 'mid';
const SECTOR_NL = { Technology: 'Technologie', Healthcare: 'Gezondheidszorg', 'Financial Services': 'Financieel',
  'Consumer Cyclical': 'Cyclische consumptie', 'Consumer Defensive': 'Basisconsumptie', Industrials: 'Industrie',
  'Communication Services': 'Communicatie', Energy: 'Energie', Utilities: 'Nutsbedrijven', 'Real Estate': 'Vastgoed', 'Basic Materials': 'Grondstoffen' };

// Naar een ander scherm van het dashboard (de pagina staat in een iframe van index.html)
function go(hash) {
  try { if (window.top !== window) { window.top.location.hash = hash; return; } } catch (e) {}
  location.href = 'index.html#' + hash;
}

async function getJSON(u) {
  try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
const ls = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

// Posities en state: zelfde bron als alle andere pagina's (shared.js)
const loadPositions = Shared.positions;

// Zelfde regels als het Overzicht (shared.js): slimme koopdrempel en winstnemingstrap
const thresholdFor = Shared.thresholdFor;

function newCutoff() {
  const c = new Date(Date.now() - 24 * 3600 * 1000);
  while (c.getDay() === 0 || c.getDay() === 6) c.setDate(c.getDate() - 1);
  return c;
}
function ageTxt(iso) {
  if (!iso) return { t: 'onbekend', cls: 'bad' };
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  const t = m < 60 ? Math.round(m) + ' min' : m < 48 * 60 ? Math.round(m / 60) + ' uur' : Math.round(m / 1440) + ' dagen';
  return { t, cls: m > 6 * 60 ? 'bad' : m > 60 ? 'warn' : '' };
}

async function render() {
  const [data, sig, scr, pos, sigTop, trades, tech, these] = await Promise.all([getJSON('data.json'), getJSON('signals.json'), getJSON('screener.json'), loadPositions(), getJSON('signals_top250.json'), Shared.loadTrades(), getJSON('tech.json'), Shared.loadThese()]);
  const idx = Shared.stockIndex(scr, sig, data);
  const quotes = (data && data.quotes) || {};
  const q = t => quotes[(t || '').toUpperCase()];
  const now = new Date();
  const h = now.getHours();
  $('hello').textContent = (h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond') + ', Maurits';
  $('date').textContent = now.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // Versheid van de data
  const st = [['koersen', data && data.updated], ['radar', sig && sig.generated], ['kansen', scr && scr.updated]].map(([k, iso]) => {
    const a = ageTxt(iso); return `<span class="chip ${a.cls}" title="Laatst bijgewerkt"><i></i>${k} ${a.t}</span>`;
  });
  $('status').innerHTML = st.join('');

  // Posities met koers
  const held = pos.filter(p => !p.watch && p.cost != null).map(p => ({ p, q: q(p.ticker) })).filter(x => x.q && x.q.price);
  const val = x => x.q.price * (x.p.qty || 1);
  const totV = held.reduce((a, x) => a + val(x), 0);
  const dayOf = x => x.q.prevClose ? (x.q.price / x.q.prevClose - 1) * 100 : 0;
  const dayPct = totV ? held.reduce((a, x) => a + val(x) * dayOf(x), 0) / totV : null;
  const costSum = held.reduce((a, x) => a + x.p.cost * (x.p.qty || 1), 0);
  const plPct = costSum ? (held.reduce((a, x) => a + (x.q.price - x.p.cost) * (x.p.qty || 1), 0) / costSum) * 100 : null;
  const sorted = held.slice().sort((a, b) => dayOf(b) - dayOf(a));
  const upN = held.filter(x => dayOf(x) > 0).length;
  const nm = x => x.q.name || x.p.ticker;

  // Techradar: dreigt er een terugval in tech en chips? Met hoeveel van je portefeuille daarin zit.
  if (typeof TechWarn !== 'undefined') {
    TechWarn.css();
    const exposure = Shared.techExposure(held.map(x => ({ p: x.p, value: val(x) })), idx.find);
    $('techwarn').innerHTML = tech ? TechWarn.banner(tech, exposure) : '';
  }

  // Beursklimaat vandaag en deze week (zelfde regels als de Patroonradar)
  const reg = (sig && sig.world && sig.world.regime) || {};
  const REG = { calm: ['good', 'Rustig & stijgend'], neutral: ['mid', 'Neutraal'], off: ['bad', 'Risico-uit'] }[reg.state] || ['', '—'];
  const horizon = (sig && sig.config && sig.config.horizon) || 10;
  let sw = 0, sm = 0;
  ((sig && sig.items) || []).forEach(it => {
    if (it.category === 'Gold & Silver') return;
    const p = pos.find(x => x.ticker.toUpperCase() === it.symbol.toUpperCase());
    const w = (it.price || 1) * ((p && p.qty) || 1);
    sw += w; sm += w * (it.projected_pct != null ? it.projected_pct * 5 / horizon : 0);
  });
  const wk = sw ? sm / sw : null;

  $('kpis').innerHTML = `
    <button class="card ${tone(dayPct)}" onclick="go('investeringen')"><div class="k"><i></i>Portefeuille vandaag</div>
      <div class="big">${pct(dayPct, 2)}</div>
      <div class="sub">${held.length ? `${upN} omhoog, ${held.length - upN} omlaag${sorted.length ? `<br>beste <b>${esc(nm(sorted[0]))}</b> ${pct(dayOf(sorted[0]))}` : ''}` : 'geen koersen of aankoopprijzen op dit apparaat'}</div></button>
    <button class="card g ${tone(plPct)}" onclick="go('investeringen')"><div class="k"><i></i>Resultaat t.o.v. aankoop</div>
      <div class="big">${pct(plPct)}</div>
      <div class="sub">${held.length} posities${sorted.length ? `<br>zwakste vandaag <b>${esc(nm(sorted[sorted.length - 1]))}</b> ${pct(dayOf(sorted[sorted.length - 1]))}` : ''}</div></button>
    <button class="card ${REG[0]}" onclick="go('patroonradar')"><div class="k"><i></i>Beursklimaat vandaag</div>
      <div class="word">${REG[1]}</div><div class="sub">${esc((reg.text || 'nog geen radardata').replace(/^[^:]*:\s*/, ''))}</div></button>
    <button class="card v ${tone(wk)}" onclick="go('patroonradar')"><div class="k"><i></i>Beursklimaat deze week</div>
      <div class="word">${wk == null ? '—' : wk >= 0.5 ? 'Positief' : wk <= -0.5 ? 'Negatief' : 'Neutraal'}</div>
      <div class="sub">verwacht gemiddeld <b>${pct(wk)}</b> voor je stocks</div></button>`;

  // Te doen vandaag
  const todo = [];
  // 1. Koopsignalen (incl. watchlist)
  pos.forEach(p => {
    const qq = q(p.ticker); if (!qq || !qq.high52 || !qq.price) return;
    const drop = (qq.high52 - qq.price) / qq.high52 * 100, thr = thresholdFor(p, qq);
    if (drop >= thr) {
      const trend = qq.sma200 ? qq.price > qq.sma200 : null;
      todo.push({ g: 'Kopen', cls: 'buy', ic: '🟢', title: `Koopsignaal ${qq.name || p.ticker}`,
        sub: `${nf(drop)}% onder de top (drempel ${thr}%)${trend == null ? '' : trend ? ' · in stijgende trend' : ' · ⚠ dalende trend'}`,
        val: `<span class="c-up">${p.watch ? 'watchlist' : 'bijkopen'}</span>`, go: 'investeringen', prio: trend === false ? 2 : 1 });
    }
  });
  // 2. Winstnemingstrap (zelfde regel als de knop "Realiseer" op het tabblad Investeringen)
  held.forEach(x => {
    const pl = (x.q.price / x.p.cost - 1) * 100;
    const s = Shared.sellStatus(x.p.sells, pl, x.q.price);
    if (!s.canRealise) return;
    todo.push({ g: 'Winst nemen', cls: 'sell', ic: '💰', title: `Winstneming ${nm(x)}`,
      sub: `${s.isHeropend ? 'trede ' + s.nextStep + ' weer open (koers 25% onder je verkoop)' : 'trede ' + s.nextStep + ' (+' + s.nextTargetPct + '%) bereikt'} · resultaat ${pct(pl, 0)}`,
      val: `<span class="c-warn">${s.nextSellPct}% verkopen</span>`, go: 'investeringen', prio: 1 });
  });
  // 3. Beoordeling (12 stappen): these herzien, these-alarm (these.json, zelfde regels als Beoordeling via shared.js)
  //    en de kwartaalcheck: na nieuwe kwartaalcijfers per aandeel, zonder bekende cijferdatum elke 100 dagen (samen).
  //    Volgorde: eerst wat nieuw is (alarm, net gepubliceerde cijfers), dan wat al langer speelt.
  const stocks = pos.filter(p => !p.watch && p.section === 'Stocks');
  const due = [];
  const today = new Date().toISOString().slice(0, 10);
  stocks.forEach(p => {
    const it = idx.find(p.ticker), v = Steps.verdict(it), name = (it && it.name) || p.label || p.ticker;
    if (v.cls === 'v-bad') todo.push({ g: 'Beoordelen', cls: 'rev', ic: '🧭', title: `These herzien: ${name}`,
      sub: v.text.split('. ')[0] + '.', val: '<span class="c-down">herzien</span>', go: 'beoordeling', prio: 2 });
    const al = Shared.theseAlerts(it, (these && it && these.stocks[it.sym]) || null, p.review, today);
    const alarm = al.filter(a => a.kind === 'drop' || a.kind === 'newfail');
    if (alarm.length) todo.push({ g: 'Beoordelen', cls: 'rev', ic: '⚠️', title: `These-alarm: ${name}`,
      sub: alarm.map(a => a.text).join(' · '), val: `<span class="${alarm[0].sev >= 3 ? 'c-down' : 'c-warn'}">alarm</span>`, go: 'beoordeling', prio: 0 });
    const earn = al.find(a => a.kind === 'earn');
    if (earn) todo.push({ g: 'Beoordelen', cls: 'rev', ic: '📋', title: earn.title,
      sub: 'Lees de cijfers: is er iets wezenlijks veranderd aan het bedrijf? Vink af op Beoordeling.', val: '', go: 'beoordeling', prio: 1 });
    if (al.some(a => a.kind === 'due')) due.push(p);
  });
  if (due.length) todo.push({ g: 'Beoordelen', cls: 'rev', ic: '📋', title: `Kwartaalcheck: ${due.length} ${due.length === 1 ? 'aandeel' : 'aandelen'}`,
    sub: 'Na de kwartaalcijfers: is er iets wezenlijks veranderd aan het bedrijf? Vink af op Beoordeling.', val: '', go: 'beoordeling', prio: 3 });
  // 4. Nieuwe radaradviezen (afgelopen handelsdag)
  const cut = newCutoff();
  ((sig && sig.history) || []).filter(e => e.dir === 'up' && !e.end && !e.bootstrap && e.start && new Date(e.start) >= cut).forEach(e => {
    const it = ((sig && sig.items) || []).find(i => i.symbol === e.symbol) || {};
    todo.push({ g: 'Radar', cls: 'sig', ic: '📡', title: `Koopadvies ${e.name || e.symbol}`,
      sub: `nieuw signaal · verwacht ${pct(e.projected_pct)} in ${horizon} dagen`, val: '<span class="c-up">kopen</span>',
      go: 'patroonradar', prio: 1 });
  });
  // 5. Opgevolgde adviezen
  (trades || []).filter(t => t && !t.deleted && t.status === 'open').forEach(t => {
    const it = ((sig && sig.items) || []).concat((sigTop && sigTop.items) || []).find(i => i.symbol === t.symbol);
    const px = it && it.price, res = px && t.price ? (t.dir === 'up' ? px / t.price - 1 : 1 - px / t.price) * 100 : null;
    todo.push({ g: 'Opgevolgd', cls: 'trade', ic: '🎯', title: `${t.name || t.symbol}`, sub: `opgevolgd ${t.dir === 'up' ? 'koopadvies' : 'verkoopadvies'}${t.plan && t.plan.target ? ' · doel ' + nf(t.plan.target, 2) : ''}`,
      val: `<span class="${cls(res)}">${pct(res)}</span>`, go: (t.set === 'top250' ? 'top250-radar' : 'patroonradar'), prio: 3 });
  });
  // 6. Kwartaalcijfers binnen 7 dagen
  ((sig && sig.items) || []).forEach(it => {
    const e = it.context && it.context.earnings;
    if (e && e.days != null && e.days >= 0 && e.days <= 7)
      todo.push({ g: 'Agenda', cls: 'earn', ic: '📅', title: `Kwartaalcijfers ${it.label || it.name || it.symbol}`,
        sub: e.days === 0 ? 'vandaag' : `over ${e.days} ${e.days === 1 ? 'dag' : 'dagen'}${e.date ? ' · ' + new Date(e.date).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : ''}`,
        val: '', go: 'patroonradar', prio: 4 });
  });
  const groups = ['Kopen', 'Winst nemen', 'Beoordelen', 'Radar', 'Opgevolgd', 'Agenda'];
  $('todoCount').textContent = todo.length ? `${todo.length} ${todo.length === 1 ? 'punt' : 'punten'}` : '';
  $('todo').innerHTML = todo.length ? groups.map(g => {
    const xs = todo.filter(t => t.g === g).sort((a, b) => a.prio - b.prio);
    const MAX = matchMedia('(max-width: 480px)').matches ? 3 : 6;
    return xs.length ? `<div class="grp">${g}</div>` + xs.slice(0, MAX).map(t => `<div class="t ${t.cls}" role="button" tabindex="0" onclick="go('${t.go}')">
      <div class="ic">${t.ic}</div><div class="t-main"><div class="t-title">${esc(t.title)}</div><div class="t-sub">${esc(t.sub)}</div></div><div class="t-val">${t.val}</div></div>`).join('')
      + (xs.length > MAX ? `<div class="t-more" role="button" tabindex="0" onclick="go('${xs[0].go}')">en nog ${xs.length - MAX} →</div>` : '') : '';
  }).join('') : '<div class="empty">Niets dringends vandaag 🎉<br>Geen koopsignalen, winstnemingen, beoordelingen, nieuwe adviezen of cijfers.</div>';

  // Kansen van de dag
  const own = new Set(pos.filter(p => !p.watch).map(p => p.ticker.toUpperCase()));
  const cardOf = it => (it.card && it.card.s != null) ? it.card.s : -1;   // scorecard (van 125), het hoofdgetal
  // Find the gap (hoge score én een gap: cijfers omhoog, aandeel omlaag) eerst, zoals op Kansen portefeuille:
  // scorecard 100+ met gap, dan 90+ met gap, daarbinnen de grootste gap; daarna de hoogste scorecard
  const isGap = it => !!(it.gap && it.gap.ok && cardOf(it) >= ((scr && scr.gap_card) || 90));
  const tier = it => isGap(it) ? (cardOf(it) >= 100 ? 2 : 1) : 0;
  const kansen = ((scr && scr.items) || []).filter(it => cardOf(it) >= 75 && !own.has((it.eu || '').toUpperCase()) && !own.has(it.sym))
    .sort((a, b) => tier(b) - tier(a) || (tier(a) ? b.gap.pct - a.gap.pct : 0) || cardOf(b) - cardOf(a) || b.score - a.score);
  const money = it => it.region === 'VS' ? '$\u00a0' + nf(it.native, 2) : '€\u00a0' + nf(it.price, 2);   // valuta en bedrag niet los van elkaar
  const brs = Object.entries((scr && scr.branches) || {});
  $('kansen').innerHTML = kansen.length ? '<div class="kans-h"><span>scorecard van 125</span><span>verwacht 12 mnd</span></div>' + kansen.slice(0, 5).map(it => `<div class="kans" role="button" tabindex="0" onclick="go('top250')">
      <div class="sc" title="Scorecard ${Math.round(cardOf(it))} van 125">${Steps.ring(cardOf(it), 38)}</div>
      <div class="t-main"><div class="t-title">${esc(it.name)}</div><div class="t-sub">${esc(it.region === 'VS' ? it.sym : (it.eu || it.sym))}&nbsp;· ${esc(SECTOR_NL[it.sector] || it.sector || '')}&nbsp;· ${money(it)}${isGap(it) ? `&nbsp;· <span class="c-up" title="Find the gap: hoge score én een gap (omzet en winst omhoog, aandeel omlaag)">gap ${Math.round(it.gap.pct)}%</span>` : ''}</div></div>
      <div class="t-val ${cls(it.exp && it.exp.pct)}" title="Verwacht rendement 12 maanden">${pct(it.exp && it.exp.pct)}</div></div>`).join('')
    + (brs.length ? `<div class="brs">${brs.map(([k, b]) => `<div class="brc" role="button" tabindex="0" onclick="go('top250')"><b>${esc(b.label)}</b><small>${kansen.filter(i => i.branch === k).length} kansen · ${esc((b.etf || '').split('.')[0])}&nbsp;${pct(b.ret12)}</small></div>`).join('')}</div>` : '')
    : '<div class="empty">Nog geen kansenlijst. Draai de workflow Top 250.</div>';

}

// Rijen zijn div's met role="button": Enter en spatie werken zoals een klik
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button') { e.preventDefault(); el.click(); }
});

render();
setInterval(render, 5 * 60 * 1000);
Shared.onRefresh(render);   // andere pagina wijzigt iets, of je komt terug op dit tabblad: meteen bijwerken
</script>
</body>
</html>
